[`p`,`Le violet, c'était la seule chose qu'elle ait jamais choisie. Le nom était venu tout seul, le premier jour, comme il vient à tout le monde. La couleur, elle l'avait prise huit jours plus tard, dans une pièce où l'on donnait de quoi s'habiller aux arrivants, devant des piles où personne ne disait quoi prendre. Depuis, rien n'avait bougé.`,``,1],
[`pause`,``,``,0],
[`p`,`En sept ans elle avait appris qu'il existe des fourmis qui cultivent des champignons, des oiseaux qui cousent leur nid, et un loir qui dort onze mois sur douze. Celui-là, le nom lui était resté. Aucun des trois ne s'était jamais montré par ici. Ça lui allait très bien.`,``,1],
[`p`,`Une heure passa. Puis une autre.`,``,0],
[`pause`,``,``,0],
[`p`,`Le pinceau était en l'air quand elle se souvint.`,``,1],
[`tiret`,`— Oh ! Tant que j'y pense…`,``,0],
[`p`,`Il était cinq heures passées. Elle posa le pinceau en travers du pot et alla chercher une enveloppe, qui attendait depuis la veille contre le pied de la lampe, à l'endroit où elle l'avait mise pour ne pas l'oublier.`,``,0],
[`p`,`Puis elle sortit.`,``,0],
[`pause`,``,``,0],
[`p`,`Le perron faisait trois marches et il faisait encore chaud dessus. Le soleil était descendu jusqu'au bas des façades d'en face et il tapait dans les vitres.`,``,1],
[`p`,`D'ici au croisement, la rue ne donnait sur rien. Des portails, des boîtes aux lettres, le portail bleu du quatorze, et rien entre les maisons.`,``,0],
[`pause`,``,``,0],
[`p`,`C'est là qu'elle l'aperçut, le garçon. Il remontait le trottoir d'en face, les bras ballants, sans se presser.`,``,1],
[`p`,`Elle avait failli le louper. Elle se félicita en silence de ne pas l'avoir oublié et lui fit de grands signes, l'enveloppe levée au bout du bras.`,``,0],
[`tiret`,`— Ho ! Mon grand !`,``,0],
[`p`,`Il leva la tête.`,``,0],
[`p`,`Il la vit.`,``,0],
[`p`,`Pendant une seconde, il resta immobile.`,``,0],
[`p`,`Puis il regarda à gauche.`,``,0],
[`p`,`À droite.`,``,0],
[`p`,`Linette fronça légèrement les sourcils.`,``,0],
[`p`,`Il descendit du trottoir.`,``,0],
[`p`,`Une voiture était garée un peu plus loin, juste avant le croisement. Une autre arrivait dans l'autre sens.`,``,0],
[`p`,`Linette leva davantage son enveloppe.`,``,0],
[`tiret`,`— Attends !`,``,0],
[`p`,`Il traversa.`,``,0],
[`p`,`La voiture passa entre eux.`,``,0],
[`p`,`Linette ne vit plus rien pendant deux secondes.`,``,0],
[`p`,`Elle entendit seulement le moteur ralentir, puis repartir.`,``,0],
[`p`,`Quand elle retrouva l'autre trottoir du regard, il n'y était plus.`,``,0],
[`p`,`Elle resta avec son bras levé.`,``,0],
[`tiret`,`— Oh.`,``,0],
[`p`,`Elle baissa lentement l'enveloppe.`,``,0],
[`p`,`Elle avait été certaine de l'avoir vu continuer.`,``,0],
[`p`,`Peut-être avait-il tourné derrière la voiture.`,``,0],
[`p`,`Elle retourna l'enveloppe pour vérifier.`,``,0],
[`p`,`Le timbre était là.`,``,0],
[`p`,`Un peu de travers, mais il y était.`,``,0],
[`p`,`Elle sourit, satisfaite.`,``,0],
[`p`,`Elle reprit sa lettre à pleine main et regarda vers le croisement.`,``,0],
[`p`,`Rien.`,``,0],
[`p`,`Elle descendit une marche.`,``,0],
[`p`,`Puis une autre.`,``,0],
[`p`,`Il y avait du monde dans la rue. Quelqu'un rentrait une poubelle. Deux femmes remontaient vers le tournant. Un arroseur tournait dans un jardin.`,``,0],
[`p`,`Lui, non.`,``,0],
[`p`,`Elle attendit encore.`,``,0],
[`p`,`Il avait dû tourner.`,``,0],
[`p`,`Il tournait quelquefois.`,``,0],
[`p`,`Ce petit allait vite, et ce n'était pas à elle de savoir par où il rentrait.`,``,0],
[`tiret`,`— Tant pis, dit-elle. La prochaine fois.`,``,0],
[`p`,`Elle remonta chez elle.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`L'enveloppe retourna sur la console, contre le pied de la lampe, à l'endroit où elle la verrait.`,``,1],
[`pause`,``,``,0],
[`p`,`La télévision parlait toujours.`,``,1],
[`p`,`Ce n'était plus le même sujet — des termites, maintenant, et la façon dont ils réglaient la température de leur nid — et la voix off était la même que le matin, du même train, sans se presser.`,``,0],
[`p`,`Linette alluma la lampe et reprit son pinceau.`,``,0],
[`p`,`Le quatrième canard n'allait toujours pas.`,``,0],
[`p`,`Elle le laissa comme ça et commença le cinquième.`,``,0],
]},
{ id:`chapitre-3`, rang:`Chapitre III`, titre:`L'aquarium`, quand:`Cinq semaines plus tôt`, encart:``, p:[
[`p`,`Il n'avait rien écrit dans la case.`,``,3],
[`pause`,``,``,0],
[`p`,`Le carnet resta dans la poche de sa blouse toute la semaine, et les pages s'empilèrent par-dessus. Il le rouvrit un matin avant de commencer, pour une salle qu'on lui redemandait, et il s'arrêta à celle-là. Le jour, les deux travées, l'heure, les âges relevés, les deux mots, les deux numéros. Tout y était. Le bout de la ligne était blanc.`,``,1],
[`p`,`Il le rouvrit à la même page le mardi suivant, et il ne vérifia rien.`,``,0],
[`p`,`Ce qu'il aurait mis dans la case, il n'aurait pas su le dire. Le garçon avait imité l'autre geste pour geste et l'autre s'en était aperçu ; ça s'était arrêté là.`,``,0],
[`p`,`Il aurait fallu écrire pourquoi il l'avait imité.`,``,0],
[`p`,`Ça ne faisait pas une observation. Une observation, c'était une capsule qui prenait du retard, un instrument qui avait sauté, une salle qu'on avait changée. Il n'y avait pas de case pour une question.`,``,0],
[`p`,`Il remit le carnet dans sa poche et alla ouvrir sa salle.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`La rue montait sans qu'on s'en aperçoive et les maisons se ressemblaient toutes. Un carré d'herbe devant, une allée de gravier jusqu'au perron, une boîte aux lettres sur son piquet. Celle de June était la quatrième après le tournant, avec un cerisier plein à craquer.`,``,1],
[`pause`,``,``,0],
[`p`,`Il sortit son téléphone en marchant.`,``,1],
[`p`,`Passé voir la douzième de la dix-neuf ce matin, vers six heures. La paroi a pâli. Je ne me prononce pas, mais je la surveillerais.`,`sms:Andrew|9 h 12`,0],
[`p`,`La réponse vint avant qu'il ait fait vingt pas.`,``,0],
[`p`,`Il était temps ! Vera a fini par avoir sa courbe : cueillie à quinze heures. Je m'en occupe, on sera deux. Tu es bien matinal ! Profite de ton jour de repos, va.`,`sms:Nora|9 h 13`,0],
[`pause`,``,``,0],
[`p`,`Il sonna. L'attente fut courte.`,``,1],
[`p`,`June ouvrit, un torchon à la main. Elle avait tiré ses cheveux blonds en arrière et les avait noués bas. Grande et mince, elle avait le visage d'une jeune femme au début de la vingtaine, les traits fins et quelque chose de tranquille dans les yeux. Son tablier avait déjà servi ce matin-là. Elle le portait avec cette simplicité des vêtements qu'on enfile pour travailler, sans chercher à leur donner plus d'importance qu'ils n'en avaient.`,``,0],
[`pause`,``,``,0],
[`p`,`Si le métier lui avait appris quelque chose, c'était la douceur. C'était en tout cas ce qu'Andrew voyait d'elle à chacune de ses visites.`,``,1],
[`p`,`Une berceuse prenait chez elle ceux qui arrivaient à quatorze ans, les accompagnait au quotidien pendant des années, puis les remettait à ses consœurs et confrères du jardin, passé huit ans. June en avait trois sous son toit.`,``,0],
[`p`,`Le reste du métier ne s'écrivait nulle part et tenait en peu de mots. Aimer son prochain. C'était par ces hommes et ces femmes que les plus jeunes s'épanouissaient.`,``,0],
[`tiret`,`— Andrew, bonjour. Entrez, entrez.`,``,0],
[`p`,`Elle s'essuya les mains à son tablier et s'écarta pour le laisser passer. Sa manche gauche était remontée un peu plus haut que l'autre.`,``,0],
[`pause`,``,``,0],
[`p`,`Il entra dans le séjour. La pièce faisait aussi office de salle à manger et de cuisine, sans séparation véritable. Le canapé occupait un côté, la table l'autre, et le plan de travail courait au fond.`,``,1],
[`p`,`Elle le dépassa et retourna à sa planche.`,``,0],
[`tiret`,`— Il finit quelque chose là-haut, il en a pour deux minutes. Vous prendrez bien un verre d'eau.`,``,0],
[`tiret`,`— Je veux bien.`,``,0],
[`p`,`Elle sortit une bouteille du réfrigérateur, lui servit un verre et reprit là où elle s'était arrêtée. Des poivrons ouverts en deux, un couteau court, et le bruit régulier de la lame contre la planche.`,``,0],
[`p`,`Andrew resta debout, comme les autres fois, une oreille sur l'étage.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Julie, l'une des trois, était installée à la table, une machine à coudre devant elle et un pantalon en travers des genoux. Elle avait dix ans, comme Eliott. Ses cheveux bruns, légèrement ondulés, étaient retenus d'un côté par une pince. Elle leva la tête, dit bonjour, puis retourna à sa couture.`,``,1],
[`pause`,``,``,0],
[`p`,`Andrew la regarda faire. Elle plia l'ourlet à l'ongle, le fit passer sous le pied de biche sans une épingle, tourna le tissu d'un quart à l'angle et repartit dans l'autre sens. Elle releva les yeux et le trouva en train de la regarder.`,``,1],
[`tiret`,`— J'ai été couturière, dit-elle. Vingt-cinq ans de métier. Pour un magasin de vêtements en ville, un grand.`,``,0],
[`tiret`,`— Ça se voit.`,``,0],
[`tiret`,`— C'est ce qu'on me dit.`,``,0],
[`tiret`,`— Julie s'est proposée pour reprendre toutes les affaires d'Eliott, dit June sans lever les yeux de sa planche. Entre les allers-retours en ville et le reste, ça me fait ça en moins à m'occuper.`,``,0],
[`p`,`Julie haussa une épaule et lui rendit son sourire.`,``,0],
[`pause`,`· · ·`,``,0],
[`tiret`,`— Paul s'en va, dit June. Trois semaines. Ou quatre, ça dépendra de la place.`,``,0],
[`tiret`,`— Il est content d'aller au jardin ?`,``,0],
[`tiret`,`— Il compte les jours à l'envers depuis un mois. Il a refait son sac deux fois, et il l'a défait deux fois pour vérifier qu'il avait bien tout mis. Je le laisse faire, ça l'occupe.`,``,0],
[`tiret`,`— Et vous ?`,``,0],
[`tiret`,`— Moi, c'est le quatrième à partir. On s'y fait.`,``,0],
[`p`,`Elle mit les queues et les graines de côté, en un tas qu'elle repoussa du dos de la lame, et elle ne repartit pas tout de suite.`,``,0],
[`tiret`,`— Enfin, c'est ce qu'on dit.`,``,0],
[`pause`,`· · ·`,``,0],
[`tiret`,`— Lui, c'est autre chose, reprit-elle. Je ne dirais pas que c'est de pire en pire. Mais il ne me raconte plus rien. Il rentre, il monte, il redescend pour manger. Je lui pose une question, il me répond juste ce qu'il faut pour que j'arrête d'en poser.`,``,0],
[`tiret`,`— Il dort ?`,``,0],
[`tiret`,`— Il dort. C'est déjà ça.`,``,0],
[`p`,`Elle chercha son torchon, le trouva sur son épaule, et s'essuya les mains avec.`,``,0],
[`tiret`,`— Il vous parle, à vous.`,``,0],
[`p`,`Elle dit ça comme on dit qu'il va pleuvoir, et elle passa à autre chose.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`L'escalier fit du bruit. Eliott descendit les dernières marches d'un coup et s'arrêta en bas, une main sur la rampe.`,``,1],
[`tiret`,`— Vous êtes venu.`,``,0],
[`tiret`,`— J'ai dit que je viendrais.`,``,0],
[`p`,`Il avait des affaires à lui, maintenant, et elles tombaient bien. Des chaussures que personne n'avait encore usées.`,``,0],
[`pause`,``,``,0],
[`p`,`Son visage était doux, encore rond aux joues, avec un nez court et droit et une bouche fine. Quelqu'un qui savait le faire lui avait coupé les cheveux, et ils repartaient quand même en mèches sur le front et sur les oreilles. Ce qui tenait le visage, c'étaient les yeux. Verts, grands, et ils lui donnaient une présence que le reste n'annonçait pas.`,``,1],
[`p`,`Son corps était encore mince. Les épaules étroites, les poignets fins, les mains encore petites. Il y avait dans sa façon de se tenir quelque chose qui cherchait encore sa forme.`,``,0],
[`p`,`Julie posa son ouvrage et se leva pour lui tirer sur le bas de la chemise, des deux côtés, jusqu'à ce que ça tombe droit.`,``,0],
[`tiret`,`— Voilà. Comme ça tu es beau.`,``,0],
[`tiret`,`— Arrête.`,``,0],
[`p`,`Il se laissa faire jusqu'au bout, et il attendit qu'elle ait fini pour reculer.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Eliott regarda June, qui lui montra la porte avec le menton.`,``,1],
[`tiret`,`— On sort ? On va où ?`,``,0],
[`tiret`,`— Tu verras, répondit le veilleur.`,``,0],
[`tiret`,`— Je déteste quand vous dites ça.`,``,0],
[`p`,`Il s'assit par terre dans le couloir pour mettre ses chaussures, et il y mit plus de temps qu'il n'en fallait. June rouvrit la porte pour eux et la tint jusqu'à ce qu'ils soient dehors tous les deux.`,``,0],
[`pause`,``,``,0],
[`p`,`Ils descendirent la rue ensemble. Eliott marchait un demi-pas devant et ne demanda pas où ils allaient.`,``,1],
[`p`,`Le bâtiment était bas et long, en pierre claire, avec une porte battante au milieu. Au-dessus, une planche peinte indiquait le nom du lieu et l'heure à laquelle on fermait.`,``,0],
[`p`,`Eliott s'arrêta à quelques pas.`,``,0],
[`tiret`,`— C'est quoi ?`,``,0],
[`tiret`,`— Un aquarium.`,``,0],
[`tiret`,`— C'est de l'eau.`,``,0],
[`tiret`,`— Il y a des choses dedans.`,``,0],
[`tiret`,`— Quoi ?`,``,0],
[`tiret`,`— Des poissons.`,``,0],
[`p`,`Eliott regarda la porte.`,``,0],
[`p`,`Andrew attendit.`,``,0],
[`p`,`Il avait appris à ne pas remplir trop vite les silences d'Eliott. Il y avait chez lui des moments où une réponse semblait sur le point de venir, puis disparaissait avant d'avoir trouvé son chemin.`,``,0],
[`tiret`,`— Tu ne seras pas déçu.`,``,0],
[`tiret`,`— Mouais.`,``,0],
[`tiret`,`— Et je n'ai pas pris d'affaires de rechange. On ne va pas se baigner.`,``,0],
[`p`,`Andrew fit un pas vers la porte.`,``,0],
[`p`,`Eliott le regarda, puis passa devant lui. Il monta la marche du perron et poussa doucement la porte.`,``,0],
[`pause`,``,``,0],
[`p`,`Dedans, il y avait un guichet sur la gauche. Une femme se tenait derrière et leva la tête en les entendant.`,``,1],
[`p`,`Sur le comptoir, une pancarte proposait plusieurs montants : la nourriture d'une semaine, l'entretien d'un bassin, les soins aux animaux. En dessous, une ligne précisait que chacun donnait ce qu'il voulait et qu'on entrait de toute façon.`,``,0],
[`tiret`,`— Il faut payer ?`,``,0],
[`tiret`,`— Non. Mais les poissons ne se nourrissent pas que de bulles.`,``,0],
[`p`,`Andrew sourit en guettant la réaction du garçon.`,``,0],
[`p`,`Eliott ne répondit pas. Le veilleur se demanda s'il en avait déjà vu autrement que dans une assiette.`,``,0],
[`tiret`,`— Tu vas comprendre.`,``,0],
[`p`,`Il posa de quoi pour deux dans la coupelle. La femme le remercia et leur souhaita une bonne visite.`,``,0],
[`pause`,``,``,0],
[`p`,`On passait de la rue à autre chose en trois pas.`,``,1],
[`p`,`Le couloir tournait tout de suite. La lumière baissait d'un cran à chaque tournant et le bruit du dehors s'arrêtait quelque part derrière eux. L'air devint frais, avec une odeur qui n'était ni celle de la rue ni celle d'une maison.`,``,0],
[`p`,`Les murs étaient noirs.`,``,0],
[`p`,`On ne voyait bientôt plus très bien où l'on posait les pieds, et cela n'avait aucune importance. Il n'y avait qu'un sens. Plus loin, quelque chose brillait.`,``,0],
[`p`,`Le couloir s'ouvrit.`,``,0],
[`p`,`Il n'y eut plus de mur devant eux.`,``,0],
[`pause`,``,``,0],
[`p`,`Le bassin montait du sol jusqu'au plafond. Il fallait lever la tête pour en trouver le haut, et le bas descendait plus bas que le sol où ils se tenaient. La lumière tombait du dessus et se défaisait en descendant, jusqu'à ne plus rien éclairer, tout en bas.`,``,1],
[`pause`,``,``,0],
[`p`,`Eliott ne fit pas trois pas de plus.`,``,1],
[`p`,`Ce qu'il avait sur le visage en entrant n'y était plus. Sa bouche s'était ouverte un peu, et son regard passait d'un bout à l'autre de la vitre sans arriver à se poser.`,``,0],
[`pause`,``,``,0],
[`p`,`Ils étaient des centaines derrière la vitre. Plats, gris, argentés sur le flanc, tous dans le même sens. Ils faisaient le tour et revenaient. De temps en temps, le banc entier virait d'un coup, sans que rien ne l'ait commandé, et la lumière changeait avec lui.`,``,1],
[`pause`,``,``,0],
[`p`,`Puis, loin derrière eux, quelque chose de gros passa sans se presser et repartit dans le noir.`,``,1],
[`p`,`Eliott s'approcha jusqu'à poser le front contre la vitre.`,``,0],
[`p`,`Un poisson passa devant lui. Il le suivit des yeux jusqu'à ce qu'il disparaisse, puis attendit son retour.`,``,0],
[`p`,`Ils étaient une dizaine à regarder, debout, chacun devant son morceau de vitre. On distinguait à peine les visages.`,``,0],
[`p`,`Plus loin, le plafond descendait. Des bassins de la taille d'une fenêtre s'alignaient des deux côtés, et il fallait s'arrêter devant chacun pour voir tout ce qu'il contenait.`,``,0],
[`p`,`Dans le premier, tout vivait ensemble.`,``,0],
[`p`,`Des coraux tenaient le fond, les uns durs et branchus, les autres mous et remuants, dans des mauves et des verts qu'on n'attendait pas d'une pierre. Une anémone se refermait à moitié sur des poissons orange barrés de blanc qui entraient et ressortaient sans en avoir l'air gênés.`,``,0],
[`p`,`Au-dessus, une dizaine de petits jaunes vifs repartaient tous ensemble dès qu'on approchait, puis revenaient dès qu'on s'arrêtait.`,``,0],
[`p`,`Un poisson-ange empereur passa au milieu de tout ça sans se presser, rayé de jaune et de bleu de la tête à la queue, avec une barre noire en travers de l'œil. Il ne s'occupait de personne.`,``,0],
[`p`,`Depuis qu'il était arrivé dans ce monde, le garçon n'avait pas dû en voir autant d'un coup.`,``,0],
[`pause`,``,``,0],
[`p`,`Au fond, un bassin plus profond, avec des rochers empilés et un creux dessous.`,``,1],
[`p`,`Une pieuvre en sortit pendant qu'ils étaient là.`,``,0],
[`p`,`Un bras d'abord, qui se déroula le long d'une pierre et s'y colla par en dessous. Un autre suivit. Puis tous les autres à la fois.`,``,0],
[`p`,`Elle traversa le bassin sans se presser, en tenant tout ce qu'elle touchait.`,``,0],
[`p`,`Eliott ne bougea plus.`,``,0],
[`tiret`,`— Il y en a combien ?`,``,0],
[`tiret`,`— Huit.`,``,0],
[`p`,`Il les compta en la suivant des yeux.`,``,0],
[`p`,`Au bout de la rangée, le garçon s'arrêta et ne repartit plus.`,``,0],
[`p`,`Celui-ci était petit, mais étonnant. Sur le vert de son dos couraient des lignes orange bordées de bleu, qui tournaient, se recoupaient et ne faisaient jamais deux fois le même dessin. Il se tenait presque immobile, à hauteur de visage, et remuait une nageoire pour rester où il était. Eliott posa les deux mains sur la barre.`,``,0],
[`tiret`,`— Regardez celui-là. Regardez-le.`,``,0],
[`p`,`Il ne se retourna pas pour vérifier qu'Andrew le regardait. Il resta là, changeant d'appui d'un pied sur l'autre.`,``,0],
[`p`,`Au bout d'un moment, il se mit à chanter. Pas fort. Pour lui seul, en suivant le poisson des yeux. C'était une vraie chanson, avec des mots dedans, et il en connaissait la fin. Il y était question d'eau, ou de ce qu'il y avait dessous. Andrew ne la connaissait pas. Il ne demanda pas où il l'avait apprise.`,``,0],
[`p`,`Puis le garçon s'arrêta de chanter.`,``,0],
[`tiret`,`— J'en ai déjà vu un comme ça.`,``,0],
[`p`,`Andrew regarda le bassin.`,``,0],
[`tiret`,`— Où ?`,``,0],
[`tiret`,`— Dans une boîte en verre, posée sur un meuble. Il y avait un tapis en dessous.`,``,0],
[`p`,`Andrew resta silencieux. Eliott tourna la tête vers lui.`,``,0],
[`tiret`,`— Vous me croyez pas.`,``,0],
[`tiret`,`— J'ai rien dit.`,``,0],
[`tiret`,`— C'est pareil.`,``,0],
[`p`,`Il s'écarta de la vitre et enfonça les mains dans ses poches.`,``,0],
[`tiret`,`— Tout le monde fait ça. On dit « ah », et après on parle d'autre chose.`,``,0],
[`tiret`,`— Qu'est-ce que tu veux que je dise ?`,``,0],
[`tiret`,`— Rien.`,``,0],
[`p`,`Ils repartirent.`,``,0],
[`p`,`Ailleurs, quelque chose bougeait entre des herbes qui montaient du fond en se tenant droites. On ne le voyait jamais en entier.`,``,0],
[`p`,`Eliott se pencha d'un côté, puis de l'autre.`,``,0],
[`tiret`,`— Il est où ?`,``,0],
[`tiret`,`— Quoi ?`,``,0],
[`tiret`,`— Le truc.`,``,0],
[`p`,`Andrew regarda à son tour.`,``,0],
[`tiret`,`— Je ne sais pas.`,``,0],
[`tiret`,`— Il était là.`,``,0],
[`tiret`,`— Je te crois.`,``,0],
[`p`,`Eliott continua de chercher.`,``,0],
[`pause`,``,``,0],
[`p`,`Ensuite, un bassin bas, à peine éclairé, avec du sable clair au fond.`,``,1],
[`p`,`Quatre axolotls y étaient posés, roses et pâles, avec leurs petites pattes et leur couronne de plumes de chaque côté de la tête. Ils ne faisaient rien du tout. L'un d'eux ouvrit la bouche, la referma et garda l'air content.`,``,0],
[`tiret`,`— Il sourit.`,``,0],
[`tiret`,`— On dirait.`,``,0],
[`p`,`Ils passèrent.`,``,0],
[`p`,`Pour finir, il n'y eut plus de plafond du tout. L'eau passait au-dessus d'eux et redescendait des deux côtés, et ils marchaient dessous.`,``,0],
[`pause`,``,``,0],
[`p`,`C'était le moment que le lieu gardait pour la fin. Tout le monde ralentissait sans qu'on le leur demande. La lumière traversait l'eau et bougeait sur le sol. Des poissons passaient dans la clarté, disparaissaient, revenaient ailleurs.`,``,1],
[`p`,`Puis une raie traversa tout le plafond, d'un bord à l'autre, si large qu'elle les mit à l'ombre en passant. Elle battit des ailes une fois, très lentement, et cela suffit pour longtemps.`,``,0],
[`p`,`Personne ne parla pendant qu'elle était au-dessus d'eux.`,``,0],
[`p`,`Personne sauf Eliott, qui reprit sa chanson à mi-voix. Cette fois-ci, la raie en devenait le personnage principal et faisait de la musique avec un autre poisson.`,``,0],
[`p`,`Ça ne voulait rien dire.`,``,0],
[`pause`,``,``,0],
[`p`,`Ils firent quelques pas sous l'eau. Un banc de petits poissons vira au-dessus d'eux, d'un seul bloc. Leur ombre passa sur le sol.`,``,1],
[`p`,`Andrew attendit encore un peu.`,``,0],
[`tiret`,`— Il était de quelle couleur, le meuble ?`,``,0],
[`p`,`Eliott releva la tête.`,``,0],
[`tiret`,`— Quoi ?`,``,0],
[`tiret`,`— Le meuble. Celui avec la boîte dessus.`,``,0],
[`p`,`Le garçon le regarda un moment.`,``,0],
[`tiret`,`— Marron. Foncé… avec… réfléchit-il en se grattant la tête. Avec une porte qui fermait mal.`,``,0],
[`p`,`Andrew hocha la tête.`,``,0],
[`tiret`,`— D'accord.`,``,0],
[`p`,`Ils sortirent.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Dehors, il fallut un moment pour que leurs yeux reviennent. La lumière paraissait trop franche après les couloirs noirs de l'aquarium.`,``,1],
[`p`,`Ils prirent un autre chemin pour rentrer.`,``,0],
[`pause`,``,``,0],
[`p`,`Cette fois, Eliott marchait à côté d'Andrew. Il parlait encore de l'aquarium, par morceaux, sans vraiment chercher à raconter ce qu'il avait vu. Un poisson revenait dans plusieurs de ses phrases. Puis un autre. Puis la pieuvre.`,``,1],
[`p`,`La rue remontait doucement.`,``,0],
[`pause`,``,``,0],
[`p`,`Au bout de quelques minutes, les maisons laissèrent place à une longue grille. Elle suivait le trottoir sur plusieurs dizaines de mètres, et derrière elle on apercevait des bâtiments bas, des fenêtres ouvertes et, plus loin, une cour.`,``,1],
[`p`,`Eliott ralentit.`,``,0],
[`tiret`,`— C'est quoi ?`,``,0],
[`p`,`Andrew regarda derrière les barreaux.`,``,0],
[`tiret`,`— Une école.`,``,0],
[`p`,`Ils avancèrent encore de quelques pas.`,``,0],
[`p`,`Une fenêtre était ouverte au ras du trottoir. On entendait une voix depuis l'intérieur.`,``,0],
[`p`,`Une femme écrivait au tableau en parlant sans se retourner. Elle était debout, droite, vive dans ses gestes, et elle avait le visage d'une fille de quinze ou seize ans.`,``,0],
[`p`,`Devant elle, une vingtaine de personnes occupaient les tables.`,``,0],
[`pause`,``,``,0],
[`p`,`Ils étaient tous tout en haut, quatre-vingts ans et plus. Certains avaient le dos droit, d'autres déjà bien courbé ; l'un tendait l'oreille vers le tableau, un autre plissait les yeux sur son cahier. Tous avaient pourtant l'air d'être à leur place.`,``,1],
[`p`,`Un homme du troisième rang, la nuque dégarnie et les mains tachées, dressa brusquement le bras.`,``,0],
[`p`,`Il le tendit si haut qu'on aurait dit qu'il voulait toucher le plafond. La main tremblait presque d'impatience.`,``,0],
[`p`,`La professeure continua d'écrire. L'homme remua les doigts. Toujours rien.`,``,0],
[`p`,`Derrière lui, deux autres se penchèrent l'un vers l'autre. Le premier se couvrit la bouche de la main et souffla quelques mots. Le second eut un sourire qu'il tenta de cacher derrière son cahier.`,``,0],
[`pause`,``,``,0],
[`p`,`La professeure s'interrompit.`,``,1],
[`tiret`,`— Dis donc, vous deux.`,``,0],
[`p`,`Ils levèrent les yeux vers elle avec une innocence parfaite. Ce n'était visiblement pas la première fois : ils s'étaient sus visés avant qu'elle ait fini sa phrase.`,``,0],
[`p`,`Elle ne les regardait même pas.`,``,0],
[`tiret`,`— Vous savez très bien que je vous entends.`,``,0],
[`p`,`Le premier baissa la tête pour dissimuler son sourire. Son voisin fit de même.`,``,0],
[`pause`,``,``,0],
[`p`,`Deux secondes passèrent.`,``,1],
[`p`,`Puis la main du troisième rang monta encore plus haut.`,``,0],
[`p`,`Cette fois, la professeure se retourna.`,``,0],
[`tiret`,`— Oui ?`,``,0],
[`p`,`Le visage de l'homme s'éclaira aussitôt.`,``,0],
[`tiret`,`— Je veux répondre, s'il te plaît ! Je sais la réponse, je peux ? J'ai levé le doigt !`,``,0],
[`p`,`Elle sourit malgré elle.`,``,0],
[`tiret`,`— Bien sûr. Dis-moi.`,``,0],
[`p`,`La grille continuait.`,``,0],
[`p`,`Les salles laissèrent peu à peu place à une cour, puis à un terrain couvert de lignes peintes. Onze personnes en faisaient le tour, à leur rythme, avec ou sans appui — une canne, un déambulateur.`,``,0],
[`p`,`Plusieurs les encadraient. L'un des professeurs de sport s'occupait du retardataire.`,``,0],
[`tiret`,`— Voilà ! C'est bien ! Encore un peu !`,``,0],
[`tiret`,`— J'en peux plus.`,``,0],
[`tiret`,`— Alors on ralentit, lui lança-t-il en calant son pas sur le sien. Mais on ne s'arrête pas.`,``,0],
[`tiret`,`— C'est facile à dire.`,``,0],
[`p`,`Le professeur se mit à rire gentiment, lui donna une petite tape encourageante sur le haut du bras.`,``,0],
[`tiret`,`— Allez. Encore jusqu'au poteau. Après, tu pourras me bouder si tu veux.`,``,0],
[`p`,`L'homme eut un rire essoufflé.`,``,0],
[`tiret`,`— Je boude déjà !`,``,0],
[`tiret`,`— Parfait. Ça veut dire qu'on progresse.`,``,0],
[`p`,`Ils continuèrent.`,``,0],
[`p`,`Eliott s'était arrêté contre la grille. Ses doigts s'étaient glissés entre deux barreaux.`,``,0],
[`p`,`Il regardait le terrain.`,``,0],
[`p`,`Puis la cour.`,``,0],
[`p`,`Puis les fenêtres.`,``,0],
[`tiret`,`— C'est donc à ça que ça ressemble, l'école.`,``,0],
[`tiret`,`— Oui.`,``,0],
[`p`,`Il resta silencieux.`,``,0],
[`tiret`,`— June m'a dit que je pourrais jamais y aller.`,``,0],
[`p`,`Andrew regarda la cour avec lui.`,``,0],
[`tiret`,`— Parce que je suis trop petit.`,``,0],
[`p`,`C'était vrai.`,``,0],
[`pause`,``,``,0],
[`p`,`L'école prenait ceux qui arrivaient tout en haut. La plupart avaient entre quatre-vingts et quatre-vingt-dix ans lorsqu'ils en franchissaient les portes. Il arrivait qu'on en reçoive de plus haut encore, quatre-vingt-quinze, cent un. Cela ne changeait rien : ils entraient, apprenaient, recommençaient, et prenaient le temps qu'il fallait.`,``,1],
[`pause`,``,``,0],
[`p`,`Pour eux, l'école durait des années. On y apprenait les premières lettres, les nombres, l'histoire du monde, les gestes de la vie courante et tout ce qu'il fallait savoir pour y trouver sa place.`,``,1],
[`p`,`Ceux qui arrivaient plus bas, autour de cinquante ou soixante ans, n'avaient pas ce temps-là. Ils entraient directement dans la vie active et recevaient, le soir, des cours adaptés à leur rythme. Un <a class="glo" data-mot="Tuteur">tuteur</a> les accompagnait au début, au cas par cas, jusqu'à ce qu'ils puissent avancer seuls.`,``,0],
[`p`,`Et pour les plus jeunes, il y avait les berceurs.`,``,0],
[`pause`,``,``,0],
[`p`,`Eliott ne quittait pas la cour des yeux.`,``,1],
[`p`,`Andrew le laissa regarder aussi longtemps qu'il voulut.`,``,0],
[`p`,`Puis, quand le garçon finit par décrocher ses doigts de la grille, ils reprirent leur chemin.`,``,0],
[`p`,`Ils rentrèrent sans se presser.`,``,0],
[`p`,`Son téléphone vibra dans sa poche.`,``,0],
[`p`,`Cérémonie faite. Capsule éclaircie, arrivant réactif.`,`sms:Nora|16 h 40`,0],
[`p`,`Il rangea l'appareil. Une chose de réglée.`,``,0],
[`pause`,``,``,0],
[`p`,`Devant chez June, Eliott monta les marches et poussa la porte tout seul, puis il se retourna sur le seuil, une main sur le montant.`,``,1],
[`tiret`,`— La prochaine fois, c'est où ?`,``,0],
[`tiret`,`— Tu verras.`,``,0],
[`p`,`Eliott le regarda encore une seconde.`,``,0],
[`p`,`Puis il entra.`,``,0],
[`p`,`La porte se referma. À l'intérieur, quelqu'un lui demanda quelque chose et il répondit en montant l'escalier.`,``,0],
[`pause`,``,``,0],
[`p`,`Andrew resta un moment devant l'allée de gravier.`,``,1],
[`p`,`Puis il repartit par où il était venu.`,``,0],
[`p`,`Il ne compta pas.`,``,0],
]},
{ id:`chapitre-4`, rang:`Chapitre IV`, titre:`La tournée`, quand:`Sept jours plus tôt`, encart:``, p:[
[`p`,`Il y retourna le mardi suivant, et le mardi d'après.`,``,3],
[`p`,`Il y eut d'autres fois.`,``,0],
[`p`,`À force de se voir, quelque chose changea entre eux sans qu'aucun des deux ne s'en aperçoive vraiment. Un matin, Eliott lui dit bonjour sans le vouvoyer. Andrew ne releva pas ; ce ne fut que deux jours plus tard, en y repensant, qu'il comprit.`,``,0],
[`pause`,``,``,0],
[`p`,`Ce jour-là, il rejoignit Eliott sur sa tournée.`,``,1],
[`p`,`Le garçon l'attendait au coin de la rue, la sacoche en travers du corps. Il dit bonjour et repartit sans attendre.`,``,0],
[`p`,`Il avait le visage des mauvais jours.`,``,0],
[`p`,`La sacoche s'ouvrait sur le devant. Des enveloppes y étaient maintenues par une pince et, au fond, trois paquets attendaient dans l'ordre où il devait les livrer.`,``,0],
[`p`,`Eliott connaissait les boîtes. Il savait laquelle s'ouvrait mal, laquelle prenait les gros paquets et laquelle il fallait pousser par en dessous. Devant l'une, il se mit sur la pointe des pieds ; devant une autre, il s'accroupit sans ralentir.`,``,0],
[`pause`,``,``,0],
[`p`,`Tout se faisait à pied. On ne donnait pas de véhicule à quelqu'un qui n'aurait pas le temps, devant lui, d'apprendre à conduire.`,``,1],
[`p`,`Andrew avait relevé assez d'âges pour savoir ce que cela valait. Chez les grands nombres, la descente se tenait : régulière, prévisible d'une année sur l'autre, et il n'y avait qu'à laisser faire.`,``,0],
[`p`,`Chez les petits, elle faisait ce qu'elle voulait.`,``,0],
[`p`,`On l'avait constaté. Personne n'avait jamais dit pourquoi.`,``,0],
[`pause`,``,``,0],
[`p`,`Au bout de la deuxième rue, une femme sortit sur le perron d'une maison aux volets violets en agitant une enveloppe.`,``,1],
[`tiret`,`— Tu me la prends ?`,``,0],
[`tiret`,`— Faut la timbrer.`,``,0],
[`tiret`,`— Elle est timbrée.`,``,0],
[`p`,`Eliott la retourna, vérifia le timbre et la glissa dans le rabat du fond, celui qui repartait au centre de tri.`,``,0],
[`tiret`,`— Merci, mon grand.`,``,0],
[`p`,`Il ne répondit pas, et ils repartirent.`,``,0],
[`tiret`,`— Elle le fait toutes les semaines, dit-il au bout de dix pas. Et une fois sur deux, elle n'a pas timbré.`,``,0],
[`tiret`,`— Et tu la prends quand même.`,``,0],
[`tiret`,`— Ben oui.`,``,0],
[`p`,`Il haussa les épaules, comme si la question était bête.`,``,0],
[`p`,`C'était peut-être le cas.`,``,0],
[`pause`,``,``,0],
[`p`,`Il connaissait son quartier par cœur. Sa tournée commençait à quelques rues de chez June, et il y avait pris ses repères aussi bien pour travailler que pour sortir seul. Il savait chez qui il fallait sonner deux fois, laquelle des maisons de la rangée haute avait un chien qui n'aboyait jamais, et quelle porte s'ouvrait avant même qu'on ait posé le paquet.`,``,1],
[`p`,`Son responsable lui avait ajouté deux rues le mois précédent, puis une troisième la semaine passée.`,``,0],
[`tiret`,`— Il t'en donne de plus en plus.`,``,0],
[`tiret`,`— Il dit que je vais vite.`,``,0],
[`tiret`,`— Tu vas vite ?`,``,0],
[`tiret`,`— Je vais normalement. C'est les autres qui traînent.`,``,0],
[`p`,`Il l'avait dit sans sourire.`,``,0],
[`pause`,``,``,0],
[`p`,`Ils descendirent la rue en pente, celle qui donnait sur la place.`,``,1],
[`tiret`,`— Après, je redescends jusqu'au magasin de chaussures et je remonte par le haut.`,``,0],
[`tiret`,`— L'épicerie.`,``,0],
[`tiret`,`— Non. Magasin de chaussures, je te dis.`,``,0],
[`p`,`Eliott s'arrêta.`,``,0],
[`p`,`Il regarda la devanture, fronça légèrement les sourcils et inspira par le nez.`,``,0],
[`tiret`,`— Il y avait un magasin de chaussures, ici…`,``,0],
[`p`,`Il resta encore une seconde devant la vitrine.`,``,0],
[`tiret`,`— Bon. C'est pas grave. J'ai rien à y livrer de toute façon.`,``,0],
[`p`,`Il repartit sans regarder derrière lui.`,``,0],
[`p`,`Andrew jeta un coup d'œil à la vitrine en passant. Des cageots occupaient le trottoir. Un panneau était posé contre la porte, écrit à la craie. Une femme rentrait des caisses vides.`,``,0],
[`p`,`Le garçon avait déjà repris son itinéraire là où il l'avait laissé.`,``,0],
[`p`,`Après le bas, il remontait par la rangée du haut, celle où personne ne descendait jamais chercher son courrier.`,``,0],
[`pause`,``,``,0],
[`p`,`Il parlait un peu plus, maintenant. De tout.`,``,1],
[`p`,`Et, à travers tout ce qu'il disait, il tournait autour de quelque chose.`,``,0],
[`tiret`,`— L'autre, il fait quoi ?`,``,0],
[`p`,`C'était évident qu'il faisait allusion au second arrivant lors de sa cérémonie.`,``,0],
[`tiret`,`— Je ne sais pas. Il est parti chez un tuteur.`,``,0],
[`tiret`,`— Il va apprendre un métier.`,``,0],
[`tiret`,`— Sûrement.`,``,0],
[`p`,`Quelques pas passèrent.`,``,0],
[`tiret`,`— Un vrai…`,``,0],
[`tiret`,`— Le <a class="glo" data-mot="Portage">portage</a> est un métier.`,``,0],
[`tiret`,`— Le portage, c'est pas un vrai.`,``,0],
[`tiret`,`— C'en est un.`,``,0],
[`tiret`,`— On me l'a donné. On m'a pas demandé.`,``,0],
[`p`,`Il donna un coup de pied dans un caillou. Le caillou roula de quelques centimètres avant de s'arrêter.`,``,0],
[`tiret`,`— Personne m'a demandé ce que je voulais faire. On m'a dit : voilà, tu portes ça, tu vas là, tu reviens. Et voilà.`,``,0],
[`p`,`Andrew attendit.`,``,0],
[`tiret`,`— Tu voulais faire quoi ?`,``,0],
[`p`,`Eliott ouvrit la bouche.`,``,0],
[`p`,`Rien ne vint.`,``,0],
[`p`,`Il regarda devant lui.`,``,0],
[`tiret`,`— Je sais pas.`,``,0],
[`p`,`Il repartit d'un pas plus vif. Andrew le laissa prendre deux mètres avant de le rejoindre.`,``,0],
[`tiret`,`— Il y en a qui sont pas contents, dit Eliott.`,``,0],
[`tiret`,`— Où ça ?`,``,0],
[`tiret`,`— Au travail. Ils disent qu'on nous donne tout.`,``,0],
[`tiret`,`— Ils te disent ça à toi ?`,``,0],
[`tiret`,`— Ils le disent, répondit-il en rajustant la sacoche sur son épaule. Ils le disent pas aux autres. Ils le disent à moi.`,``,0],
[`p`,`Andrew n'eut pas le temps de répondre.`,``,0],
[`p`,`Eliott s'arrêta net, porta deux doigts à sa bouche et siffla.`,``,0],
[`p`,`Le son partit d'un seul coup et traversa la rue. Deux personnes se retournèrent sur le trottoir d'en face.`,``,0],
[`p`,`Trente mètres plus haut, Julie leva la tête, chercha l'origine du sifflement, les trouva et n'eut l'air surprise qu'une seconde.`,``,0],
[`tiret`,`— Tu vas où ?`,``,0],
[`tiret`,`— June m'a demandé de récupérer du lait !`,``,0],
[`tiret`,`— Prends le gros !`,``,0],
[`p`,`Elle leva son filet vide pour montrer qu'elle avait entendu, puis repartit.`,``,0],
[`pause`,``,``,0],
[`p`,`Andrew n'avait pas bougé.`,``,1],
[`p`,`Eliott s'en aperçut et remit sa sacoche en place une seconde fois.`,``,0],
[`tiret`,`— Désolé. Je sais. June me l'a déjà dit, qu'on fait pas ça.`,``,0],
[`p`,`Il chercha ses mots.`,``,0],
[`tiret`,`— C'est… je sais pas. J'y pense qu'après.`,``,0],
[`p`,`Ce n'était pas le sifflement qui avait arrêté Andrew.`,``,0],
[`p`,`C'étaient les deux doigts.`,``,0],
[`p`,`La façon de les plier, de les poser sous la langue, de souffler d'un seul coup sec.`,``,0],
[`p`,`Ce genre de chose s'apprenait.`,``,0],
[`p`,`Et ça s'apprenait de quelqu'un.`,``,0],
[`tiret`,`— Qui t'a montré ?`,``,0],
[`tiret`,`— Quoi ?`,``,0],
[`tiret`,`— À faire ça avec les doigts.`,``,0],
[`p`,`Eliott haussa les épaules.`,``,0],
[`tiret`,`— Je sais pas, dit-il en regardant sa main comme s'il ne comprenait pas la question. Je sais le faire, c'est tout.`,``,0],
[`p`,`Puis il repartit, et Andrew le suivit.`,``,0],
[`pause`,``,``,0],
[`p`,`La sacoche était vide lorsqu'ils arrivèrent devant chez June.`,``,1],
[`p`,`Eliott monta les marches, sonna et se retourna à moitié.`,``,0],
[`tiret`,`— Salut.`,``,0],
[`p`,`La porte s'ouvrit et il entra sans attendre. On l'entendit monter l'escalier, puis une porte se ferma à l'étage.`,``,0],
[`p`,`June resta sur le seuil, une main sur le montant, à regarder le haut de l'escalier.`,``,0],
[`tiret`,`— Vous avez cinq minutes ?`,``,0],
[`p`,`Andrew acquiesça.`,``,0],
[`p`,`Elle sortit, tira la porte derrière elle et s'assit sur la deuxième marche. Il prit place à côté d'elle.`,``,0],
[`pause`,``,``,0],
[`p`,`Pendant quelques secondes, aucun des deux ne parla.`,``,1],
[`tiret`,`— Il a été comme ça toute la journée ?`,``,0],
[`tiret`,`— Toute la semaine.`,``,0],
[`p`,`June passa les mains sur son tablier, sans rien y chercher.`,``,0],
[`tiret`,`— J'en ai eu six avant lui. Six, en comptant Paul et Julie. Il y en a eu des difficiles. Certains qui pleuraient les premiers jours. Un qui n'a pas parlé pendant deux semaines. Mais ça passait.`,``,0],
[`p`,`Elle regarda la rue.`,``,0],
[`tiret`,`— Ça passait toujours.`,``,0],
[`p`,`Un silence.`,``,0],
[`tiret`,`— Et là, non, reprit-elle.`,``,0],
[`tiret`,`— Non.`,``,0],
[`p`,`Elle posa les mains à plat sur ses genoux.`,``,0],
[`tiret`,`— Ce n'est pas qu'il est méchant. Il n'est pas méchant du tout. Il dit bonjour, il mange, il aide quand on lui demande. Julie l'adore. Elle lui montre des choses, elle le laisse aller à son rythme, elle est très protectrice avec lui. Paul essaie à sa façon : il lui parle de ses livres. Mais on vient tout juste de commencer la lecture et l'écriture, alors il décroche vite. J'ai ressorti les imagiers. Ça amuse beaucoup Paul.`,``,0],
[`p`,`Elle eut un petit sourire qui disparut presque aussitôt.`,``,0],
[`tiret`,`— Mais lui… chercha-t-elle à dire, lui, il est poli.`,``,0],
[`p`,`Le mot resta entre eux.`,``,0],
[`tiret`,`— Il me remercie après chaque repas. Je lui propose des choses, il dit oui, et il n'a pas envie. Ça fait un mois qu'on vit sous le même toit et je ne saurais pas dire ce qu'il aime.`,``,0],
[`p`,`Andrew regarda l'allée de gravier.`,``,0],
[`tiret`,`— Je crois qu'il n'a pas envie de me connaître.`,``,0],
[`p`,`Elle ne disait pas cela comme un reproche, plutôt comme un constat qui lui faisait mal.`,``,0],
[`tiret`,`— Et c'est mon métier. C'est exactement mon métier.`,``,0],
[`p`,`Andrew attendit un peu.`,``,0],
[`tiret`,`— Il m'a dit une chose, tout à l'heure. Que personne ne lui avait demandé ce qu'il voulait faire.`,``,0],
[`p`,`June baissa les yeux.`,``,0],
[`tiret`,`— Le portage ?`,``,0],
[`tiret`,`— Le portage.`,``,0],
[`tiret`,`— Il a raison, soupira-t-elle en relevant la tête. À son âge, on attribue.`,``,0],
[`tiret`,`— Et vous ?`,``,0],
[`tiret`,`— Moi, j'ai pu choisir… J'ai eu l'école. J'ai eu le temps de regarder autour de moi. J'ai vu travailler une berceuse et j'ai su que c'était ce que je voulais.`,``,0],
[`p`,`Le silence revint. Elle regarda ses mains, perdue dans ses pensées.`,``,0],
[`tiret`,`— Lui n'aura rien vu du tout… murmura-t-elle comme pour elle-même. Plus on arrive bas, moins il y a de portes ouvertes. Ça ne se dit pas comme ça, mais c'est comme ça.`,``,0],
[`tiret`,`— Il le sait ?`,``,0],
[`p`,`June secoua doucement la tête.`,``,0],
[`tiret`,`— Il le sent… C'est pire.`,``,0],
[`p`,`Andrew ne répondit pas.`,``,0],
[`pause`,``,``,0],
[`p`,`Il pensa à la façon dont Eliott avait regardé le magasin de chaussures, à la façon dont il avait parlé de l'autre, à ce qu'il avait dit du travail.`,``,1],
[`tiret`,`— Ça expliquerait le reste ?`,``,0],
[`tiret`,`— Une partie.`,``,0],
[`p`,`Il n'ajouta pas ce qu'il pensait.`,``,0],
[`p`,`Ça n'expliquait pas le premier jour, ni ce qu'il avait dit en sortant de sa capsule, ni cette manière qu'avait le garçon d'imiter certains gestes sans savoir pourquoi.`,``,0],
[`pause`,``,``,0],
[`p`,`Deux ou trois maisons plus loin, une tondeuse démarra.`,``,1],
[`p`,`June resta silencieuse jusqu'à ce que le bruit s'éloigne.`,``,0],
[`tiret`,`— Il a fini par me sortir une chose, hier soir.`,``,0],
[`p`,`Andrew tourna la tête vers elle.`,``,0],
[`tiret`,`— Que les autres, au travail, le traitaient de porteur de voiles.`,``,0],
[`p`,`Elle prononça les derniers mots plus bas, comme s'ils avaient une mauvaise sonorité.`,``,0],
[`tiret`,`— Il vous a dit ça comme ça ?`,``,0],
[`tiret`,`— En débarrassant.`,``,0],
[`p`,`Elle regarda ses mains.`,``,0],
[`tiret`,`— Sans s'arrêter. Sans me regarder. Et après il est monté.`,``,0],
[`p`,`Elle se leva et épousseta l'arrière de son tablier.`,``,0],
[`tiret`,`— Et vous pensez que ça pourrait en être un ?`,``,0],
[`p`,`Andrew leva les yeux vers elle.`,``,0],
[`p`,`June hésita.`,``,0],
[`tiret`,`— Je ne sais pas, dit-elle en fixant la fenêtre fermée à l'étage. En tout cas, un porteur de voiles de cet âge…`,``,0],
[`p`,`Elle secoua lentement la tête avant de reprendre.`,``,0],
[`tiret`,`— Je n'en avais jamais vu.`,``,0],
[`p`,`Elle inspira, marqua un temps d'arrêt. Avant de poser le pied sur la marche suivante, elle posa la paume de sa main sur son épaule.`,``,0],
[`tiret`,`— Merci, en tout cas. De prendre de votre temps pour lui.`,``,0],
[`p`,`Il hocha la tête sans rien dire. Elle lui répondit d'un signe, puis rentra chez elle ; la porte se referma doucement sur sa silhouette.`,``,0],
[`pause`,``,``,0],
[`p`,`Andrew resta assis sur la deuxième marche.`,``,1],
[`p`,`En haut, la fenêtre du garçon était fermée.`,``,0],
]},
{ id:`chapitre-5`, rang:`Chapitre V`, titre:`La maison`, quand:``, encart:``, p:[
[`p`,`La semaine fut ordinaire.`,``,3],
[`p`,`Quatre éclaircies le lundi, deux le mercredi, aucune le jeudi. Un instrument à changer dans la salle six. Une travée fermée deux jours, rouverte sans qu'on ait rien trouvé.`,``,0],
[`pause`,``,``,0],
[`p`,`Il pensa deux ou trois fois à ce qu'il pourrait lui montrer. Il n'y avait pas grand-chose, dans le quartier, qu'un garçon qui faisait le portage n'ait pas déjà vu dix fois.`,``,1],
[`p`,`Il trouva quand même.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`La porte s'ouvrit avant qu'il ait frappé.`,``,1],
[`p`,`June se tenait dans l'encadrement, une main sur le montant. Elle n'avait pas de tablier.`,``,0],
[`tiret`,`— Il n'est pas rentré.`,``,0],
[`p`,`Andrew ne bougea pas.`,``,0],
[`tiret`,`— Hier soir ?`,``,0],
[`tiret`,`— Hier soir.`,``,0],
[`p`,`Elle recula d'un pas et poussa la porte jusqu'au mur.`,``,0],
[`p`,`Il entra.`,``,0],
[`pause`,``,``,0],
[`p`,`Les volets étaient tirés à moitié et personne n'était venu les ouvrir. La table du soir n'avait pas été débarrassée.`,``,1],
[`p`,`C'était l'heure où la pièce aurait dû sentir quelque chose.`,``,0],
[`p`,`Elle ne sentait rien.`,``,0],
[`p`,`Sur le plan de travail, la planche à découper était propre et rangée debout contre le mur.`,``,0],
[`p`,`Le sac de Paul n'était plus dans l'entrée. La place s'était libérée plus tôt que prévu : il était parti le vendredi.`,``,0],
[`p`,`En haut, aucun bruit.`,``,0],
[`tiret`,`— Vous voulez un verre d'eau ?`,``,0],
[`tiret`,`— Non, merci.`,``,0],
[`p`,`Elle alla en chercher un quand même, le posa devant lui et resta debout de l'autre côté de la table.`,``,0],
[`tiret`,`— Julie est en haut. Elle a dormi deux heures.`,``,0],
[`tiret`,`— Et vous ?`,``,0],
[`tiret`,`— J'ai repassé.`,``,0],
[`p`,`Elle dit cela comme une chose sans importance.`,``,0],
[`tiret`,`— Il n'y avait rien à repasser. J'ai repassé ce qui était déjà plié.`,``,0],
[`tiret`,`— Racontez-moi.`,``,0],
[`tiret`,`— Je l'ai déjà raconté hier soir.`,``,0],
[`tiret`,`— Racontez-moi quand même.`,``,0],
[`p`,`Elle le fit dans l'ordre, sans chercher ses mots, comme on répète une chose qu'on a déjà donnée deux fois et qui n'a servi à rien.`,``,0],
[`tiret`,`— Il est parti à sept heures et demie. Il n'a pas déjeuné. Il a dit au revoir et il a fermé la porte derrière lui. Il finit à cinq heures. Il rentre à cinq heures et demie, six heures s'il traîne.`,``,0],
[`p`,`Elle marqua une pause.`,``,0],
[`tiret`,`— Julie est rentrée à six heures et quart. J'ai attendu jusqu'à sept heures, puis j'ai appelé Henri.`,``,0],
[`tiret`,`— Henri… C'est son responsable de portage, c'est bien ça ?`,``,0],
[`tiret`,`— C'est bien ça…`,``,0],
[`p`,`Elle regarda un instant le verre posé devant Andrew.`,``,0],
[`tiret`,`— Henri m'a dit qu'il était parti à l'heure. Sacoche rendue, tournée finie, rien à signaler. Julie est ressortie faire le tour du quartier. Elle est rentrée à huit heures moins le quart. Je suis allée au commissariat à neuf heures.`,``,0],
[`p`,`Elle s'arrêta.`,``,0],
[`tiret`,`— Voilà.`,``,0],
[`pause`,``,``,0],
[`p`,`Andrew regarda le haut de l'escalier.`,``,1],
[`tiret`,`— Il avait quelque chose avec lui ?`,``,0],
[`tiret`,`— Rien. Ses chaussures de tous les jours sont dans le couloir, à l'endroit où il les laisse. Il est parti avec celles du travail.`,``,0],
[`p`,`Elle ne regarda même pas vers l'entrée.`,``,0],
[`tiret`,`— Il n'a rien pris.`,``,0],
[`p`,`Elle se tut, puis reprit sans qu'on lui demande rien.`,``,0],
[`tiret`,`— Ils m'ont demandé de le décrire.`,``,0],
[`p`,`Elle ébaucha un geste et le laissa retomber.`,``,0],
[`tiret`,`— La taille, les cheveux, ce qu'il portait. J'ai dit un mètre quarante.`,``,0],
[`p`,`Elle s'interrompit.`,``,0],
[`tiret`,`— Je ne sais pas s'il fait un mètre quarante…`,``,0],
[`tiret`,`— Ça n'a pas d'importance.`,``,0],
[`tiret`,`— Si.`,``,0],
[`p`,`Elle tira une chaise et s'assit enfin, de biais, sans vraiment s'y installer.`,``,0],
[`tiret`,`— Ils ne m'ont pas demandé comment il allait.`,``,0],
[`p`,`Andrew releva les yeux.`,``,0],
[`tiret`,`— Non ?`,``,0],
[`tiret`,`— Non. Ils m'ont demandé à quelle heure il était parti.`,``,0],
[`p`,`Elle passa la main à plat sur la table, là où il n'y avait rien à ramasser.`,``,0],
[`tiret`,`— J'ai passé trois semaines sur le départ de Paul. Les papiers, les rendez-vous, le sac qu'il a refait quatre fois. Et lui à côté, qui ne demandait rien.`,``,0],
[`tiret`,`— Vous en aviez trois.`,``,0],
[`tiret`,`— J'en avais trois.`,``,0],
[`p`,`Elle baissa les yeux.`,``,0],
[`pause`,``,``,0],
[`tiret`,`— Je vous l'ai dit, la semaine dernière. Que ça n'allait pas.`,``,0],
[`p`,`Elle laissa la phrase se poser entre eux.`,``,0],
[`tiret`,`— Je vous l'ai dit, et je n'ai rien fait d'autre que vous le dire.`,``,0],
[`p`,`Andrew ne répondit pas.`,``,0],
[`tiret`,`— Ils m'ont demandé s'il pouvait être parti de lui-même.`,``,0],
[`tiret`,`— Qui, ils ?`,``,0],
[`tiret`,`— Au commissariat.`,``,0],
[`tiret`,`— Non, répondit-il en reposant le verre auquel il n'avait pas touché.`,``,0],
[`tiret`,`— Vous dites ça vite.`,``,0],
[`tiret`,`— Je le connais.`,``,0],
[`p`,`June ne répondit pas.`,``,0],
[`tiret`,`— Vous n'êtes pas de la police.`,``,0],
[`tiret`,`— Non.`,``,0],
[`p`,`Elle n'insista pas.`,``,0],
[`pause`,``,``,0],
[`p`,`Il avait passé le mardi précédent à côté d'Eliott, sur toute la tournée, à l'entendre dire que personne ne lui avait jamais demandé ce qu'il voulait faire.`,``,1],
[`p`,`Il ne le dit pas.`,``,0],
[`p`,`L'escalier fit du bruit.`,``,0],
[`pause`,``,``,0],
[`p`,`Julie descendit sans se presser et resta un moment en bas des marches, une main sur la rampe. Elle avait gardé les vêtements de la veille.`,``,1],
[`tiret`,`— Bonjour.`,``,0],
[`tiret`,`— Bonjour Julie.`,``,0],
[`p`,`Elle vint s'asseoir à sa place, devant sa machine à coudre, et ne l'ouvrit pas.`,``,0],
[`tiret`,`— J'ai refait le tour ce matin, dit Julie.`,``,0],
[`p`,`June se tourna vers elle.`,``,0],
[`tiret`,`— Tu es sortie ?`,``,0],
[`tiret`,`— Pendant que tu repassais.`,``,0],
[`tiret`,`— Julie, on en a déjà parlé. Tu peux sortir, ce n'est pas le problème. Mais tu dois me dire où tu vas.`,``,0],
[`p`,`Julie attendit qu'elle ait fini.`,``,0],
[`tiret`,`— La place, les deux rangées, jusqu'au bout du quartier. Je suis repassée deux fois devant l'épicerie.`,``,0],
[`p`,`Andrew tourna la tête vers elle.`,``,0],
[`tiret`,`— Pourquoi l'épicerie ?`,``,0],
[`tiret`,`— Parce qu'il s'arrête toujours devant.`,``,0],
[`p`,`Elle haussa une épaule.`,``,0],
[`tiret`,`— Il regarde la vitrine et il repart. Je ne sais pas ce qu'il regarde.`,``,0],
[`p`,`June la regarda.`,``,0],
[`p`,`Elle ne le savait pas non plus.`,``,0],
[`p`,`Julie posa les mains à plat sur le capot de la machine.`,``,0],
[`tiret`,`— J'ai demandé à tout le monde. Aux deux qui tiennent l'épicerie, à ceux qui étaient encore sur la place. J'ai sonné à des portes. Ils ont tous répondu.`,``,0],
[`p`,`Elle décrocha un fil du tissu posé devant elle et le fit rouler entre ses doigts.`,``,0],
[`tiret`,`— Personne ne l'avait vu.`,``,0],
[`p`,`Un silence.`,``,0],
[`tiret`,`— Ils sont tous très gentils, et personne ne l'avait vu.`,``,0],
[`p`,`Andrew revint à June.`,``,0],
[`tiret`,`— Henri a rappelé ce matin ?`,``,0],
[`tiret`,`— Tôt. Il voulait savoir s'il devait envoyer quelqu'un sur la tournée.`,``,0],
[`p`,`June eut un demi-sourire qui ne dura pas.`,``,0],
[`tiret`,`— J'ai dit oui. Je ne sais pas pourquoi j'ai dit oui.`,``,0],
[`pause`,``,``,0],
[`p`,`Dehors, une portière claqua, puis une autre. Une voiture descendit la rue et le bruit s'en alla avec elle.`,``,1],
[`p`,`June commença à empiler les assiettes du soir. Elle en prit deux. S'arrêta.`,``,0],
[`p`,`Puis les reposa exactement où elles étaient. Elle alla jusqu'au plan de travail et ouvrit le tiroir du haut.`,``,0],
[`p`,`Elle en sortit un papier plié en deux, le déplia et le lui tendit. Un numéro, une date, une heure. Trois lignes tapées et une signature.`,``,0],
[`tiret`,`— Ils m'ont donné ça en partant.`,``,0],
[`p`,`Andrew le prit.`,``,0],
[`tiret`,`— J'ai parlé à quelqu'un, là-bas. Il a tout noté, il m'a fait relire. Il a été correct avec moi.`,``,0],
[`pause`,``,``,0],
[`p`,`Elle chercha le nom sur le papier, de loin, sans se pencher.`,``,1],
[`tiret`,`— Isaac.`,``,0],
[`p`,`Andrew relut la ligne du bas.`,``,0],
[`tiret`,`— Hmm, le monde est petit…`,``,0],
[`tiret`,`— Vous le connaissez ?`,``,0],
[`tiret`,`— Oui.`,``,0],
[`p`,`Il replia le papier en deux.`,``,0],
[`tiret`,`— C'est un ami.`,``,0],
[`tiret`,`— Vous croyez qu'ils vont chercher ?`,``,0],
[`p`,`Andrew se leva.`,``,0],
[`tiret`,`— J'y vais tout de suite.`,``,0],
[`p`,`June hocha la tête.`,``,0],
[`p`,`Pour la première fois depuis qu'il était entré, elle eut l'air de tenir debout.`,``,0],
[`p`,`Julie n'avait toujours pas ouvert la machine.`,``,0],
]},
{ id:`chapitre-6`, rang:`Chapitre VI`, titre:`Le poste`, quand:``, encart:``, p:[
[`p`,`Le bâtiment était haut et large, en retrait de la rue. Une grille en fer en fermait l'enceinte, et l'on ne franchissait le portail qu'après avoir été vu par quelqu'un. On n'entrait pas là par hasard.`,``,3],
[`pause`,``,``,0],
[`p`,`À l'intérieur, le poste tenait dans une grande salle et trois bureaux.`,``,1],
[`p`,`À droite de l'entrée, un comptoir que personne ne tenait. Deux hommes attendaient sur un banc, avec entre eux cette distance que gardent les gens qui ne se connaissent pas. L'un avait posé un sac à ses pieds et le regardait de temps en temps, comme pour vérifier qu'il était toujours là. L'autre restait immobile, les yeux glissant d'un prospectus à l'autre sur le panneau d'affichage, histoire de faire passer le temps.`,``,0],
[`p`,`Au fond, un couloir desservait des portes ouvertes des deux côtés. Un téléphone sonna quatre fois avant que quelqu'un ne décroche. Une odeur de café refroidi traînait dans l'air depuis le matin.`,``,0],
[`p`,`Il resta un moment devant le comptoir.`,``,0],
[`p`,`Personne ne vint.`,``,0],
[`pause`,``,``,0],
[`p`,`Au troisième bureau, un homme leva la tête et le remarqua.`,``,1],
[`p`,`Il était grand, avec une silhouette large et pleine, des épaules qui donnaient de l'ampleur à toute sa carrure. Sa peau brune faisait ressortir la régularité de ses traits et la profondeur de ses yeux sombres, légèrement enfoncés sous un front large. Son regard était calme, posé, avec cette façon de s'attarder parfois une seconde de trop sur un détail, comme s'il avait pris l'habitude de tout remarquer sans en avoir l'air.`,``,0],
[`pause`,``,``,0],
[`tiret`,`— Pourrais-je savoir ce qui me vaut ta visite en cette belle matinée de printemps ? Les jours de repos ne sont plus ce qu'ils étaient.`,``,0],
[`p`,`Il avait dit cela d'un air faussement interrogateur, sans même prendre la peine de dire bonjour.`,``,0],
[`tiret`,`— Lieutenant, répondit-il avec un clin d'œil complice.`,``,0],
[`p`,`Son ami lui répondit par un sourire et repoussa sa chaise pour venir le saluer.`,``,0],
[`tiret`,`— Tu tombes bien.`,``,0],
[`tiret`,`— Je reviens de chez madame…`,``,0],
[`p`,`Un revers de main balaya la fin de la phrase.`,``,0],
[`tiret`,`— Oh, ça, je m'en doutais. Assieds-toi.`,``,0],
[`p`,`Il débarrassa la chaise d'en face d'une pile de chemises qu'il posa contre le pied du bureau. Une carte du secteur était dépliée à côté, maintenue à plat par un cendrier et une agrafeuse.`,``,0],
[`pause`,``,``,0],
[`p`,`Une barbe noire et dense, taillée court, remontait sur ses joues et soulignait sa mâchoire. Ses cheveux, épais et nettement ondulés, étaient coupés plus court sur les côtés.`,``,1],
[`p`,`Il portait un polo sombre et un pantalon sobre, une tenue élégante sans être formelle ; sa veste était restée sur le dossier de sa chaise. À sa ceinture, un étui noir contenant son badge dépassait légèrement sous le pan du polo, seul détail véritablement professionnel dans cette apparence de civil.`,``,0],
[`tiret`,`— Café ?`,``,0],
[`tiret`,`— Il est comment ?`,``,0],
[`p`,`Ses doigts remontèrent peigner sa barbe. Il ne semblait pas s'en rendre compte.`,``,0],
[`tiret`,`— Comme d'habitude.`,``,0],
[`tiret`,`— Alors non.`,``,0],
[`p`,`Une main large se posa sur la pile, en tira une chemise cartonnée et la fit glisser sur le bureau.`,``,0],
[`tiret`,`— C'est tout ce qu'on a.`,``,0],
[`pause`,``,``,0],
[`p`,`La déclaration tenait sur deux feuillets tapés serré, avec quelques mentions manuscrites dans la marge. Derrière venaient une fiche de signalement, la liste des appels passés dans la soirée et une feuille sur laquelle quelqu'un avait recopié l'itinéraire au crayon.`,``,1],
[`p`,`Une heure de départ.`,``,0],
[`p`,`Une heure de retour prévue.`,``,0],
[`p`,`Le tour du quartier, rue par rue.`,``,0],
[`p`,`Un appel passé en fin de journée, avec son heure.`,``,0],
[`p`,`Puis une déclaration reçue à vingt et une heures douze.`,``,0],
[`p`,`À mi-page, une correction : une heure barrée, une autre inscrite au-dessus, deux paraphes dans la marge.`,``,0],
[`pause`,``,``,0],
[`p`,`Deux photographies étaient agrafées au second feuillet. Il les regarda l'une après l'autre, puis les laissa retomber.`,``,1],
[`p`,`Son ami attendit qu'il ait fini la première page.`,``,0],
[`p`,`Même assis derrière son bureau, il gardait cette carrure tranquille qui remplissait l'espace autour de lui.`,``,0],
[`tiret`,`— Hier, j'ai eu du mal à la calmer. Son récit partait dans tous les sens, dit-il en faisant un geste vague au-dessus du dossier. Ou elle en donnait l'impression.`,``,0],
[`tiret`,`— C'est-à-dire ?`,``,0],
[`p`,`La question avait été posée sans qu'il relève les yeux du feuillet.`,``,0],
[`tiret`,`— Rien. Une impression.`,``,0],
[`p`,`Il haussa les épaules et n'y revint pas.`,``,0],
[`tiret`,`— Tu en penses quoi ?`,``,0],
[`tiret`,`— Entre nous, je n'écarte pas un départ volontaire.`,``,0],
[`p`,`Il se cala contre le dossier de sa chaise.`,``,0],
[`tiret`,`— À cet âge-là, ajouta-t-il, on agit d'abord. Une contrariété, quelque chose qu'on ne digère pas, et on part. J'en ai fait, moi aussi, des bêtises en mon temps.`,``,0],
[`p`,`Il eut un petit rire par le nez.`,``,0],
[`tiret`,`— Et puis franchement, ces jeunes, ils ne se rendent pas compte. Ça ne réfléchit pas trop, là-haut.`,``,0],
[`p`,`Il se tapota la tempe de l'index.`,``,0],
[`tiret`,`— Les conséquences, ça vient après…`,``,0],
[`p`,`Il disait cela comme une chose répétée assez souvent au bureau pour avoir fini par perdre son sens. Puis il se tut, sans cesser d'observer son ami, et pencha légèrement la tête.`,``,0],
[`tiret`,`— Cette tête-là, je la connais.`,``,0],
[`tiret`,`— On ne part pas comme ça.`,``,0],
[`tiret`,`— Tu dis ça vite.`,``,0],
[`tiret`,`— Quand on part, on prend quelque chose.`,``,0],
[`tiret`,`— Pas toujours.`,``,0],
[`tiret`,`— Il y a autre chose. J'en mettrais ma main au feu.`,``,0],
[`p`,`Il tourna le feuillet.`,``,0],
[`p`,`Il n'avait pas relevé la tête une seule fois.`,``,0],
[`pause`,``,``,0],
[`p`,`Quelqu'un passa la tête dans l'encadrement, demanda si on avait vu un trousseau de clés, les aperçut, les chaparda discrètement pour ne pas déranger la conversation, et repartit.`,``,1],
[`p`,`Le lieutenant suivit la manœuvre des yeux. Il regardait encore la porte quand la question arriva.`,``,0],
[`tiret`,`— Elle t'a dit quoi, là-dessus ?`,``,0],
[`tiret`,`— De quoi ? Là-dessus ?`,``,0],
[`tiret`,`— Un changement de comportement. Quelque chose d'inhabituel. Est-ce qu'elle a parlé d'une fugue, elle ?`,``,0],
[`tiret`,`— Non. Rien.`,``,0],
[`tiret`,`— Tu lui as posé la question ?`,``,0],
[`tiret`,`— Je lui ai demandé l'heure et le trajet. Le reste, elle l'a donné toute seule. Et ce qui restait ne m'avançait pas.`,``,0],
[`p`,`Alors que l'un commençait à jouer machinalement avec un stylo, l'autre reprit le premier feuillet et le parcourut une seconde fois, plus lentement, imperturbable.`,``,0],
[`tiret`,`— Il n'y a rien là-dessus. Rien sur les derniers jours.`,``,0],
[`tiret`,`— Non.`,``,0],
[`tiret`,`— Rien du tout ?`,``,0],
[`tiret`,`— Des horaires.`,``,0],
[`p`,`Il retourna le feuillet pour en vérifier le dos. Un silence s'installa.`,``,0],
[`p`,`Il reposa le feuillet et releva enfin les yeux.`,``,0],
[`tiret`,`— Il faudrait y retourner.`,``,0],
[`p`,`En face, le bic s'arrêta de tournoyer entre deux doigts, pour venir gratter distraitement le sommet du crâne.`,``,0],
[`tiret`,`— J'y comptais. Je veux voir la chambre. Et la réinterroger, si elle accepte. Pour moi, tout a déjà été dit, ajouta-t-il avec un geste vers la chemise. Mais tu n'as pas l'air convaincu. Un regard neuf est toujours bon à prendre, j'imagine.`,``,0],
[`p`,`Il eut un petit sourire et reposa son stylo à plat devant lui. Il n'attendait pas de réponse : l'autre s'était penché sur la carte et l'étudiait encore.`,``,0],
[`p`,`Son doigt se posa sur le secteur et commença à suivre une rue du bout de l'ongle.`,``,0],
[`tiret`,`— Là, ce quartier, tu vois ? Il m'est arrivé de passer devant. J'ai déjà entendu des disputes.`,``,0],
[`tiret`,`— Tu pointes l'adresse du travail.`,``,0],
[`p`,`Le lieutenant leva les yeux.`,``,0],
[`p`,`Un peu trop longtemps.`,``,0],
[`tiret`,`— Elle nous a signalé une altercation.`,``,0],
[`tiret`,`— Une altercation ?`,``,0],
[`tiret`,`— Elle n'a pas donné plus de détails. Je comptais parler au responsable ce matin.`,``,0],
[`p`,`Il sortit un calepin, vérifia quelque chose et le referma.`,``,0],
[`tiret`,`— Je vais le voir à onze heures. Tu veux m'accompagner ?`,``,0],
[`p`,`Ses deux mains s'étaient posées à plat sur le bureau, lui donnant l'impulsion pour se relever. La veste quitta le dossier de la chaise.`,``,0],
[`tiret`,`— Je viens.`,``,0],
[`p`,`Il remit les deux photographies dans la chemise, en aligna soigneusement le bord avec celui du bureau et la lui rendit.`,``,0],
[`pause`,``,``,0],
[`p`,`Sur le banc, les deux hommes attendaient toujours.`,``,1],
[`p`,`Celui qui avait un sac le reprit sur ses genoux lorsqu'ils passèrent devant lui. Il le garda ainsi jusqu'à ce que la porte se referme derrière eux.`,``,0],
[`p`,`Puis il le reposa à ses pieds.`,``,0],
]},
{ id:`chapitre-7`, rang:`Chapitre VII`, titre:`Première investigation`, quand:``, encart:``, p:[
[`p`,`Ils remontèrent la rue à deux.`,``,3],
[`p`,`June était devant chez elle, accroupie au bord d'un massif, un plant dans une main et un déplantoir dans l'autre. Il y avait trois autres plants alignés sur le gravier, et de la terre retournée sur un mètre.`,``,0],
[`p`,`Le massif était déjà plein. Elle arrachait ce qui tenait, et remettait autre chose dans le trou.`,``,0],
[`p`,`Elle en avait mis partout. Sur le gravier, sur le bas de son pantalon, sur la marche du perron. Elle enfonça le déplantoir d'un coup trop sec, buta sur une pierre et retira sa main. Elle regarda sa paume un instant, n'y trouva rien, et recommença.`,``,0],
[`pause`,``,``,0],
[`p`,`Elle les vit arriver et se releva plus vite qu'il n'aurait fallu.`,``,1],
[`tiret`,`— Bonjour. Il y a du nouveau ? Vous avez quelque chose ? Vous êtes allés à son travail, c'est ça, vous avez vu Henri…`,``,0],
[`tiret`,`— On peut entrer ? la coupa le policier.`,``,0],
[`p`,`Elle regarda la rue derrière eux, retira ses gants et les posa sur le rebord de la fenêtre, à l'endroit prévu pour ça.`,``,0],
[`tiret`,`— Entrez.`,``,0],
[`p`,`La table était débarrassée, les volets ouverts. La pièce sentait quelque chose, cette fois. Julie était installée dans le canapé avec un livre, les jambes repliées sous elle.`,``,0],
[`p`,`Isaac posa son téléphone sur la table, écran allumé.`,``,0],
[`tiret`,`— Je vais vous redemander des choses que vous avez déjà dites.`,``,0],
[`tiret`,`— Je m'en doutais.`,``,0],
[`p`,`Elle les redonna quand même. Les mêmes heures, les mêmes phrases, à un mot près, comme on récite une chose apprise contre son gré.`,``,0],
[`tiret`,`— Julie est rentrée à six heures et quart. J'ai attendu jusqu'à sept heures. J'ai appelé Henri.`,``,0],
[`p`,`Elle s'arrêta.`,``,0],
[`tiret`,`— Vous voulez la suite ? Vous l'avez, tout ça. Je vous l'ai donnée deux fois.`,``,0],
[`p`,`Isaac ne répondit pas. Il regarda Andrew.`,``,0],
[`tiret`,`— Je sais, dit celui-ci. Et je suis désolé de vous la faire redire.`,``,0],
[`p`,`Il tira une chaise et s'assit en face d'elle, ce qu'il n'avait pas fait en entrant.`,``,0],
[`tiret`,`— Ce ne sont pas les heures qui m'intéressent. C'est lui.`,``,0],
[`tiret`,`— On ne me l'a pas vraiment demandé, comment il était. Je ne sais pas… comme d'habitude… Distant…`,``,0],
[`tiret`,`— Et ensuite ?`,``,0],
[`p`,`Elle ouvrit la bouche et la referma.`,``,0],
[`tiret`,`— Ensuite on est passé à autre chose.`,``,0],
[`p`,`Andrew ne bougea pas de sa chaise.`,``,0],
[`tiret`,`— Alors reprenons à « distant ». Distant comment ?`,``,0],
[`p`,`June regarda ses mains, puis les posa à plat sur la table.`,``,0],
[`tiret`,`— Fermé.`,``,0],
[`p`,`Elle chercha un exemple.`,``,0],
[`tiret`,`— Il ne demande rien et il ne refuse rien.`,``,0],
[`p`,`Elle en trouva un.`,``,0],
[`tiret`,`— Le soir, on sort les jeux. Paul adorait ça. Julie joue pour lui faire plaisir. Lui, il regarde. Si on l'appelle, il vient. Il joue, il gagne ou il perd, et à la fin il remonte.`,``,0],
[`p`,`Elle secoua légèrement la tête.`,``,0],
[`tiret`,`— Il n'a jamais demandé à jouer une deuxième fois.`,``,0],
[`p`,`Andrew regarda Julie.`,``,0],
[`tiret`,`— Et avec vous ?`,``,0],
[`p`,`Elle avait posé son livre sur ses genoux, une page contre la cuisse.`,``,0],
[`tiret`,`— Avec moi, il parle un peu plus. Il me demande ce que je couds. Il regarde. Des fois, il tient le tissu.`,``,0],
[`p`,`Elle réfléchit à ce qu'elle venait de dire.`,``,0],
[`tiret`,`— Mais c'est moi qui parle.`,``,0],
[`p`,`Un petit silence.`,``,0],
[`tiret`,`— Lui, il écoute.`,``,0],
[`tiret`,`— Est-ce que quelque chose a changé, ces dernières semaines ?`,``,0],
[`p`,`June allait répondre non ; elle ne répondit pas tout de suite. Elle retint sa respiration, le regard perdu dans le vague.`,``,0],
[`tiret`,`— Il y a eu la piscine.`,``,0],
[`tiret`,`— La piscine ?`,``,0],
[`tiret`,`— Le cours de natation. Ils y vont tous, c'est obligatoire, et c'est la seule chose que je ne donne pas moi-même.`,``,0],
[`p`,`Elle chercha comment le dire.`,``,0],
[`tiret`,`— Il s'est mis dans une colère noire. Ça ne lui ressemblait pas.`,``,0],
[`tiret`,`— Contre quelqu'un ?`,``,0],
[`tiret`,`— Contre personne. On me l'a rapporté le soir même. Il ne voulait pas entrer dans le bassin. Ils ont insisté et il a…`,``,0],
[`p`,`Elle s'arrêta.`,``,0],
[`tiret`,`— Ils l'ont fait sortir. Il n'y retournera pas.`,``,0],
[`tiret`,`— Pourquoi ?`,``,0],
[`tiret`,`— Parce qu'ils ne veulent plus de lui au cours. On me l'a fait savoir le lendemain.`,``,0],
[`tiret`,`— Il est rentré comment, ce soir-là ?`,``,0],
[`tiret`,`— Il est monté sans rien dire. Je suis allée le voir. Il m'a envoyée promener.`,``,0],
[`p`,`Elle eut un bref sourire sans joie.`,``,0],
[`tiret`,`— Julie a essayé. Paul aussi. Il a refusé de descendre manger.`,``,0],
[`p`,`Son pouce passa lentement sur le bord de la table.`,``,0],
[`tiret`,`— Je lui ai monté une assiette et je l'ai laissée devant sa porte. Quand je suis montée me coucher, deux heures après, elle était encore là.`,``,0],
[`p`,`Elle marqua une pause.`,``,0],
[`tiret`,`— Je l'ai redescendue.`,``,0],
[`tiret`,`— Et le lendemain ?`,``,0],
[`tiret`,`— Le lendemain, il était comme avant. Il a dit bonjour, il a mangé, il est parti travailler… comme si ça n'avait jamais eu lieu.`,``,0],
[`tiret`,`— C'était quand ?`,``,0],
[`tiret`,`— La semaine dernière. Je ne sais plus quel jour.`,``,0],
[`p`,`Il releva la tête et regarda l'escalier.`,``,0],
[`tiret`,`— On peut voir sa chambre ?`,``,0],
[`tiret`,`— Montez.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`L'escalier craqua sous leurs pas.`,``,1],
[`p`,`La chambre était petite et bien tenue.`,``,0],
[`p`,`Un lit fait au carré. Une table sous la fenêtre. Une chaise. Une armoire basse.`,``,0],
[`p`,`Sur une étagère, une pile de livres d'images était posée à plat, avec une lampe à côté.`,``,0],
[`p`,`Andrew resta près de la porte.`,``,0],
[`p`,`Isaac fit le tour de la pièce en trois pas.`,``,0],
[`tiret`,`— Il n'a rien mis aux murs ?`,``,0],
[`tiret`,`— Je lui ai dit qu'il pouvait. Il dessine, un peu. Il apprend à tenir son crayon en ce moment, il aime bien mélanger les couleurs. Il range tout dans le tiroir.`,``,0],
[`p`,`Elle regarda la table.`,``,0],
[`tiret`,`— Je lui ai proposé de punaiser. Il m'a dit que ça allait comme ça.`,``,0],
[`p`,`Elle montra l'étagère pleine de livres.`,``,0],
[`tiret`,`— Ça, en revanche, il peut y rester des heures. Il ne sait pas lire, mais les images l'attirent beaucoup. Les autres attendent qu'on leur montre le monde. Lui, il va le chercher tout seul.`,``,0],
[`tiret`,`— Il manque quelque chose ?`,``,0],
[`p`,`June ouvrit l'armoire et regarda dedans avec lui.`,``,0],
[`tiret`,`— Non. Tout est là. Ce que Julie lui a repris, le linge de la semaine, la veste qu'il n'a pas encore mise.`,``,0],
[`p`,`Elle referma l'armoire.`,``,0],
[`p`,`Il ouvrit le tiroir de la table.`,``,0],
[`p`,`Les dessins étaient empilés sur deux ou trois centimètres. Des traits, des ronds au crayon, une feuille par-dessus l'autre. Il les repoussa, et dessous, six enveloppes fermées.`,``,0],
[`tiret`,`— Ça, c'est quoi ?`,``,0],
[`tiret`,`— Sa paye. Henri la remet comme ça, une enveloppe scellée chaque semaine.`,``,0],
[`tiret`,`— Il y en a six.`,``,0],
[`tiret`,`— Il est arrivé il y a un mois et demi, dit-elle en les fixant, je lui ai dit qu'il pouvait dépenser, que c'était à lui. Il ne les ouvre même pas.`,``,0],
[`pause`,``,``,0],
[`p`,`Andrew remarqua quelque chose de bleu et d'orange qui dépassait de sous l'oreiller.`,``,1],
[`tiret`,`— Et ça ?`,``,0],
[`p`,`Le policier suivit son regard et souleva le coussin.`,``,0],
[`tiret`,`— Son poisson, dit June.`,``,0],
[`p`,`Elle s'approcha et le prit dans ses mains sans même sembler s'en apercevoir.`,``,0],
[`tiret`,`— Il ne s'en sépare pas. Il lui arrive même de le mettre dans sa sacoche pour aller travailler. Je lui ai dit que ça ne se faisait pas, ajouta-t-elle avec un petit mouvement de tête. Il l'emmène quand même.`,``,0],
[`tiret`,`— Il l'a depuis longtemps ?`,``,0],
[`tiret`,`— Trois semaines.`,``,0],
[`p`,`Elle regarda la peluche, et ses doigts en lissèrent machinalement le tissu.`,``,0],
[`tiret`,`— C'est moi qui le lui ai acheté. Il me l'a demandé, dit-elle en levant les yeux. C'est la seule fois où il m'a demandé quelque chose… Il l'avait repéré quelque part. Il m'a dit qu'il y en avait un panier entier. Des bleus, des orange, des mélangés…`,``,0],
[`tiret`,`— Une petite vague brodée sur la nageoire de gauche, dit Andrew.`,``,0],
[`p`,`June cessa de lisser le tissu.`,``,0],
[`tiret`,`— Comment vous savez ça ?`,``,0],
[`tiret`,`— Il y a une boutique à côté de l'aquarium. Des poissons plein la vitrine, et cette vague sur chacun. C'est la marque du magasin.`,``,0],
[`p`,`Il était passé devant avec lui en sortant, et il l'avait remarquée comme il remarquait le reste.`,``,0],
[`tiret`,`— À côté de l'aquarium… Maintenant que vous le dites, oui… songea June.`,``,0],
[`pause`,``,``,0],
[`p`,`Le veilleur sembla prendre quelques secondes pour lui-même. Est-ce que le garçon avait vu la vitrine ce jour-là, en passant devant avec lui ? Ou y était-il retourné seul, depuis ?`,``,1],
[`p`,`June reposa la peluche sur l'oreiller, et elle prit le temps de la poser bien.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Ils redescendirent. Julie n'avait pas repris son livre.`,``,1],
[`p`,`Dans l'entrée, plusieurs paires de chaussures étaient rangées sous le banc.`,``,0],
[`p`,`Le policier les compta du regard.`,``,0],
[`tiret`,`— Il y en a trois.`,``,0],
[`tiret`,`— La petite paire est à Paul, dit Julie. Il les a oubliées.`,``,0],
[`tiret`,`— Il faudrait peut-être l'interroger, lui aussi.`,``,0],
[`tiret`,`— Il ne vous dira rien de plus que moi.`,``,0],
[`p`,`Julie l'avait dit sans élever la voix, et elle ramena ses jambes sous elle.`,``,0],
[`tiret`,`— Ils ont mangé un mois à la même table, et Paul lui parlait de ses livres, ajouta-t-elle. C'est tout ce qu'il y a eu.`,``,0],
[`tiret`,`— Et à vous, il vous a parlé, ces derniers jours ?`,``,0],
[`tiret`,`— Il parle. Il dit bonjour, il dit merci.`,``,0],
[`tiret`,`— De son travail ?`,``,0],
[`tiret`,`— Non.`,``,0],
[`tiret`,`— De la piscine ?`,``,0],
[`tiret`,`— Non. Je n'ai pas osé lui demander.`,``,0],
[`tiret`,`— Il était comment, la veille ?`,``,0],
[`p`,`Elle prit le temps d'y réfléchir vraiment, et cela dura plus longtemps que sa réponse.`,``,0],
[`tiret`,`— Il est rentré. Il est monté. Il est redescendu manger. Comme les autres jours.`,``,0],
[`p`,`Le policier reprit sa chaise et revint au début de la déclaration.`,``,0],
[`tiret`,`— June, dans votre déclaration, vous signalez une altercation à son travail.`,``,0],
[`tiret`,`— Oui, enfin. Il est rentré les genoux amochés, la lèvre fendue et le col plein de sang. Il revenait de son travail, j'en ai déduit qu'il s'était passé quelque chose là-bas.`,``,0],
[`p`,`Elle passa une main sur son propre genou, comme si elle revoyait la scène.`,``,0],
[`tiret`,`— Et j'ai eu du mal à faire partir les taches. Ce n'était plus frais. Ça s'était fait dans la journée, pas sur le chemin du retour.`,``,0],
[`tiret`,`— Là-bas, ou ailleurs. Il fait le tour du quartier toute la journée.`,``,0],
[`tiret`,`— Il y avait des gens avec qui il ne s'entendait pas ?`,``,0],
[`tiret`,`— Non, non. Il ne parle pas beaucoup, de toute façon, et à personne.`,``,0],
[`p`,`Elle réfléchit à la question plus qu'elle n'avait réfléchi aux précédentes.`,``,0],
[`tiret`,`— Mais c'était forcément là-bas, reprit-elle. C'était le jour du tri.`,``,0],
[`tiret`,`— Le jour du tri ?`,``,0],
[`tiret`,`— Deux fois par semaine, ils ne sortent pas. Ils restent trier au dépôt. Ça leur repose les jambes.`,``,0],
[`tiret`,`— Donc il n'a pas quitté le dépôt de la journée.`,``,0],
[`tiret`,`— Pas ce jour-là.`,``,0],
[`tiret`,`— Et ça, c'était la veille…`,``,0],
[`p`,`Il l'avait dit pour lui-même.`,``,0],
[`tiret`,`— C'était bien la veille, oui.`,``,0],
[`tiret`,`— Il vous a expliqué ?`,``,0],
[`tiret`,`— Il a dit qu'il était tombé.`,``,0],
[`tiret`,`— Vous l'avez cru ?`,``,0],
[`tiret`,`— Non. On ne se fend pas la lèvre en tombant sur les genoux.`,``,0],
[`tiret`,`— Il y a eu forcément autre chose. Il s'est battu, ou alors on l'a battu… Ils le traitent bien de… de porteur de voiles, alors…`,``,0],
[`p`,`Andrew la regarda sans rien dire. Il savait combien ça lui coûtait de poser ces mots sur Eliott. Elle semblait profondément blessée, comme s'ils avaient pu l'atteindre elle directement.`,``,0],
[`tiret`,`— Enfin, vous l'avez bien vu. Il raconte des choses qui ne tiennent pas debout, ça part dans tous les sens et on n'y comprend rien. Je sais qu'il est jeune, mais…`,``,0],
[`p`,`Le veilleur croisa un bras sur sa poitrine et posa le menton dans l'autre main.`,``,0],
[`tiret`,`— C'est dans votre déclaration, dit Isaac. Je l'ai noté.`,``,0],
[`p`,`Il revint deux pages en arrière pour vérifier.`,``,0],
[`tiret`,`— Ça change quelque chose ?`,``,0],
[`p`,`Andrew décroisa les bras.`,``,0],
[`tiret`,`— Ça arrive. C'est rare, mais ça arrive. La plupart racontent n'importe quoi en sortant. Chez les jeunes, ça se remarque, parce qu'ils n'ont pas encore appris à garder les choses pour eux.`,``,0],
[`p`,`Il laissa passer un temps.`,``,0],
[`tiret`,`— Les arrivants qui ont ce genre de comportement finissent par s'apaiser. En descendant, ça se calme. Au jardin, ce qui leur traversait la tête ne les atteint plus.`,``,0],
[`p`,`Il se tourna vers June.`,``,0],
[`tiret`,`— J'en ai vu.`,``,0],
[`p`,`Elle hocha la tête sans rien dire.`,``,0],
[`tiret`,`— Alors non. Ça ne change rien à ce qui lui est arrivé.`,``,0],
[`p`,`Personne ne répondit à ça.`,``,0],
[`p`,`Le policier verrouilla son téléphone, le garda un moment dans la main, puis le glissa dans sa poche.`,``,0],
[`tiret`,`— Bon. On a ce qu'il nous faut. Merci de votre accueil, on ne va pas vous déranger plus longtemps.`,``,0],
[`pause`,``,``,0],
[`p`,`June les accompagna jusqu'à la porte, les salua, et les deux hommes descendirent l'allée.`,``,1],
[`p`,`Andrew se retourna en passant le portillon. Les gants étaient restés sur le rebord de la fenêtre, et les trois plants attendaient sur le gravier, les mottes déjà sèches.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Ils firent une dizaine de pas dans la rue avant qu'Andrew parle.`,``,1],
[`tiret`,`— Il n'est pas parti de lui-même.`,``,0],
[`tiret`,`— On ne peut pas encore l'écarter, souligna Isaac.`,``,0],
[`tiret`,`— Il n'a pas emporté d'argent. Pas un vêtement. Rien. Il est parti du dépôt à l'heure, comme tous les jours, et il y a quinze minutes de marche entre là-bas et cette porte.`,``,0],
[`p`,`Il se tourna franchement vers lui.`,``,0],
[`tiret`,`— Et soyons sérieux deux minutes. Qui, avec un mois et demi d'existence, décide de disparaître ?`,``,0],
[`p`,`Le policier ne dit rien. Ils firent quelques pas.`,``,0],
[`tiret`,`— Et il a laissé le poisson.`,``,0],
[`tiret`,`— Une peluche.`,``,0],
[`tiret`,`— Justement. Une peluche, oui et non. Ce n'est pas qu'une peluche. C'est la seule chose qu'il ait jamais demandée. Il l'emmenait au travail alors qu'on le lui avait interdit.`,``,0],
[`p`,`Andrew s'arrêta de marcher.`,``,0],
[`tiret`,`— C'est une bouée de sauvetage à laquelle il se raccroche. Il ne se sent chez lui nulle part, et il a ça.`,``,0],
[`p`,`Ils repartirent.`,``,0],
[`tiret`,`— S'il était parti de lui-même, il l'aurait prise.`,``,0],
[`p`,`Isaac baissa les yeux.`,``,0],
[`tiret`,`— Une peluche ne permet pas d'établir grand-chose.`,``,0],
[`tiret`,`— Non.`,``,0],
[`p`,`Andrew regarda la rue devant lui.`,``,0],
[`tiret`,`— Mais lui, si.`,``,0],
[`pause`,``,``,0],
[`p`,`Le lieutenant attendit d'avoir presque atteint le bas de la rue.`,``,1],
[`tiret`,`— Ce n'est pas une fugue.`,``,0],
[`tiret`,`— Non.`,``,0],
[`p`,`Il ressortit son téléphone et tapa deux mots en marchant.`,``,0],
[`tiret`,`— Je vais faire reprendre le trajet. Rue par rue, des deux côtés.`,``,0],
[`p`,`Il le rangea. Il marqua une pause avant de reprendre sur un ton plus grave.`,``,0],
[`tiret`,`— Si on s'en est pris à ce garçon, quelles qu'en soient les raisons, c'est bien moche.`,``,0],
]},
{ id:`chapitre-8`, rang:`Chapitre VIII`, titre:`Le dépôt`, quand:``, encart:``, p:[
[`p`,`Le dépôt était au bout d'une rue qui ne menait qu'à lui.`,``,3],
[`p`,`Un bâtiment bas et long, gris sous la lumière du matin, avec un quai de chargement courant sur toute la façade. Les portes à lanières transparentes battaient encore de temps à autre, poussées par le passage d'un chariot ou d'une silhouette, puis revenaient lentement à leur place.`,``,0],
[`p`,`Ils arrivèrent à l'heure.`,``,0],
[`p`,`Le responsable, non.`,``,0],
[`p`,`Ils attendirent près des casiers, là où ils ne gênaient personne. Le travail continuait autour d'eux sans ralentir. Des chariots plats passaient à hauteur de genou, des bacs étaient emportés par quatre, des sacoches identiques se décrochaient au passage sans que personne ne s'arrête vraiment.`,``,0],
[`p`,`Personne ne regardait devant soi. Tout le monde savait où aller.`,``,0],
[`p`,`Andrew compta les casiers.`,``,0],
[`p`,`Il y en avait quatre-vingts.`,``,0],
[`p`,`Onze étaient vides.`,``,0],
[`pause`,``,``,0],
[`p`,`Au bout d'une dizaine de minutes, il se pencha légèrement vers l'autre.`,``,1],
[`tiret`,`— C'était bien maintenant ?`,``,0],
[`tiret`,`— Tu me mets un doute.`,``,0],
[`p`,`Le policier sortit son téléphone et vérifia l'heure.`,``,0],
[`tiret`,`— Oui. On est bien à l'heure.`,``,0],
[`pause`,``,``,0],
[`p`,`Une femme vint jusqu'à eux en s'essuyant les mains sur son pantalon.`,``,1],
[`tiret`,`— Vous attendez Henri ?`,``,0],
[`tiret`,`— Depuis un moment.`,``,0],
[`tiret`,`— Il en a pour cinq minutes. On a eu un petit incident technique. Vous voulez vous asseoir ?`,``,0],
[`tiret`,`— Ça ira, merci, déclina poliment Isaac.`,``,0],
[`p`,`La femme repartit comme elle était venue.`,``,0],
[`pause`,``,``,0],
[`p`,`Henri arriva quelques minutes plus tard par le quai, un gobelet dans une main et une liasse de journaux sous le bras. Il devait avoir une cinquantaine d'années. Un homme un peu épais, le ventre déjà bien installé sous sa chemise, avec cette carrure de ceux qui passent leurs journées debout sans jamais avoir vraiment le temps de faire du sport. Son visage était rond, les cheveux clairsemés sur le dessus, soigneusement rabattus sur le côté. Il avait les joues rouges de quelqu'un qui venait de courir après quelque chose qu'il n'avait pas envie de perdre.`,``,1],
[`p`,`Il posa le gobelet et les journaux sur le premier casier venu pour leur serrer la main.`,``,0],
[`tiret`,`— Pardonnez mon retard. La roue avant d'un des chariots a lâché, deux bacs à terre, tout le tri à refaire… Enfin bref, passons, vous n'êtes sûrement pas là pour entendre des soucis logistiques ! Enchanté. Henri. Que puis-je pour vous ?`,``,0],
