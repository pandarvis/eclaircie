<!doctype html>
<html lang="fr" data-nuit="0" data-glo="0" data-ouvert="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'Éclaircie</title>
<style>
:root{
  --papier:#F3EDE1; --papier-2:#EAE2D2;
  --encre:#201D18; --encre-2:#514A3E; --encre-3:#928975;
  --bureau:#221F1B; --bureau-2:#15130F;
  --gouttiere:.17; --or:#B08B4F; --corne:#D8CDB4; --corne-2:#C6B999;
  --serif:Constantia,"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:Corbel,Candara,"Segoe UI",Tahoma,sans-serif;
  --plume:"Segoe Script","Bradley Hand","Lucida Handwriting","Ink Free","Segoe Print",cursive;
}
html[data-nuit="1"]{
  --papier:#141A21; --papier-2:#0F151B;
  --encre:#DCE3EA; --encre-2:#A2AFBB; --encre-3:#63717F;
  --bureau:#080B0F; --bureau-2:#04060A;
  --gouttiere:.34; --or:#7CC6DC; --corne:#202934; --corne-2:#2C3846;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(120% 100% at 50% 0%,var(--bureau),var(--bureau-2));
  color:var(--encre-3);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- la scène ---------- */
#scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#cadre{transform-origin:50% 50%;will-change:transform}
#livre{
  position:relative;width:940px;height:752px;
  perspective:3500px;perspective-origin:50% 48%;
  transform:translateX(-235px);
  transition:transform 560ms cubic-bezier(.36,.06,.24,1);
}
html[data-ouvert="1"] #livre{transform:translateX(0)}
#ombre{
  position:absolute;left:12px;right:12px;top:16px;bottom:-4px;
  box-shadow:0 44px 90px -26px rgba(0,0,0,.85),0 8px 22px -8px rgba(0,0,0,.6);
  border-radius:3px;
}
html[data-ouvert="0"] #ombre{left:482px;right:12px}

/* ---------- la tranche : l'épaisseur qui dit où on en est ---------- */
.tranche{
  position:absolute;top:7px;bottom:7px;width:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(0,0,0,.30),rgba(0,0,0,0) 45%,rgba(0,0,0,.22)),
    repeating-linear-gradient(90deg,var(--papier-2) 0 1.5px,rgba(90,74,48,.16) 1.5px 3px);
  transition:width 280ms ease;opacity:.9;
}
#trG{right:100%;border-radius:3px 0 0 3px}
#trD{left:100%;border-radius:0 3px 3px 0}
html[data-ouvert="0"] .tranche{width:0!important}

/* ---------- une page ---------- */
.cote{position:absolute;top:0;width:470px;height:752px}
.cote.g{left:0}
.cote.d{left:470px}
.page{
  position:absolute;inset:0;background:var(--papier);color:var(--encre);
  overflow:hidden;
}
.page::after{
  content:"";position:absolute;top:0;bottom:0;width:64px;pointer-events:none;
  opacity:var(--gouttiere);
}
.page[data-cote="g"]::after{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.55))}
.page[data-cote="d"]::after{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.55))}
.page.garde{background:linear-gradient(145deg,#2E2A24,#1A1713)}
html[data-nuit="1"] .page.garde{background:linear-gradient(145deg,#111820,#080C11)}
.page.nulle{background:transparent}
.page.nulle::after{display:none}

.bloc{
  position:absolute;top:74px;width:360px;height:598px;
  font:14.2px/23px var(--serif);
  text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;
  letter-spacing:.002em;
}
.page[data-cote="g"] .bloc{left:48px}
.page[data-cote="d"] .bloc{left:62px}
.bloc p{margin:0;text-indent:1.25em;orphans:2;widows:2}
.bloc p.plat{text-indent:0}
/* un message ressemble a ce qu'il lit : un encart tres leger, une
   lineale d'interface, le nom et l'heure d'arrivee. Le remplissage
   n'est que lateral : une hauteur casserait la grille. */
.bloc p.sms{
  margin:0;text-indent:0;text-align:left;padding:2px 14px 3px;
  border:0 solid transparent;border-width:9px 0 9px;
  background:var(--papier-2);background-clip:padding-box;border-radius:4px;
  font:400 .84em/23px "Segoe UI",Tahoma,Arial,sans-serif;
  color:var(--encre);letter-spacing:0;
}
.bloc p.sms::before{
  content:attr(data-de) " · " attr(data-h);display:block;
  min-height:23px;
  font:400 .62em/23px "Segoe UI",Tahoma,Arial,sans-serif;
  color:var(--encre-3);letter-spacing:.06em;
}
.bloc p.coupe{text-align-last:justify;-moz-text-align-last:justify}
.bloc p.pause{
  text-indent:0;text-align:center;letter-spacing:.5em;color:var(--encre-3);
  margin:23px 0;height:23px;
}
/* Une pause sans marque : une ligne de blanc, et rien d'ecrit. La
   grille reste juste -- une ligne, pas trois. */
.bloc p.pause:empty{margin:0;height:23px;letter-spacing:0}
.bloc em{font-style:italic}
.ouvre{padding:138px 0 69px;text-align:center}
.ouvre h2{
  margin:0;font:400 17px/46px var(--serif);color:var(--encre);
  letter-spacing:.26em;text-transform:uppercase;
  /* l’interlettrage ajoute un blanc apres la derniere lettre :
     text-indent le rattrape, moitie du blanc, et le titre est centre */
  text-indent:.26em;
}
/* la mention de temps : plus petite que le rang, et elle ne crie pas */
.ouvre .quand{
  margin:-10px 0 0;font:italic 400 11.5px/16px var(--serif);
  color:var(--encre-3);letter-spacing:.05em;text-indent:.05em;
}
.tete{
  position:absolute;top:34px;width:360px;
  font:8.6px/12px var(--sans);letter-spacing:.24em;text-transform:uppercase;
  color:var(--encre-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.page[data-cote="g"] .tete{left:48px;text-align:left}
.page[data-cote="d"] .tete{left:62px;text-align:right}
.folio{
  position:absolute;bottom:36px;left:0;width:100%;text-align:center;
  font:10.5px var(--serif);color:var(--encre-3);letter-spacing:.14em;
}

/* ---------- la page de titre et le sommaire ---------- */
.titrage{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:0 56px}
.titrage h1{
  margin:0;font:400 34px/1.15 var(--serif);letter-spacing:.14em;
  text-transform:uppercase;color:var(--encre);
}
.titrage .filet{width:64px;height:1px;background:var(--encre-3);margin:26px 0}
.titrage .quoi{font:12px var(--serif);letter-spacing:.34em;text-transform:uppercase;color:var(--encre-3)}
.titrage .bas{position:absolute;bottom:74px;font:9.5px var(--sans);letter-spacing:.2em;
  text-transform:uppercase;color:var(--encre-3)}

/* le plan : une planche au trait, pas une illustration */
.planche{
  position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;padding:0 34px;
}
.planche > div{width:100%;max-width:402px}
.planche .p-tete{
  margin:0 0 18px;font:400 9.4px/14px var(--sans);color:var(--encre-2);
  letter-spacing:.3em;text-transform:uppercase;text-indent:.3em;
  text-align:center;
}
.planche svg{width:100%;display:block}
.plan .p-mur{fill:none;stroke:var(--encre-3);stroke-width:2.4}
.plan .p-serre{fill:none;stroke:var(--encre-3);stroke-width:1.6;opacity:.7}
.plan .p-bande path{fill:none;stroke:var(--encre-3);opacity:.16;
  stroke-linecap:round;stroke-linejoin:round}
.plan .p-coulee path,.plan .p-coulee circle{
  fill:none;stroke:var(--encre);stroke-width:3.4;opacity:.42;
  stroke-linecap:round;
}
.plan .p-caps ellipse{fill:var(--encre);opacity:.72}
/* celles qui vont s'ouvrir : la paroi a pali */
.plan .p-caps .claire{
  fill:none;stroke:var(--encre);stroke-width:1.6;opacity:.6;
}
/* celles qui vont s'ouvrir : la paroi a pali */
.plan .p-caps .claire{
  fill:none;stroke:var(--encre);stroke-width:1.6;opacity:.6;
}
/* celles qui vont s'ouvrir : la paroi a pali */
.plan .p-caps .claire{
  fill:none;stroke:var(--encre);stroke-width:1.6;opacity:.6;
}
/* celles qui vont s'ouvrir : la paroi a pali */
.plan .p-caps .claire{
  fill:none;stroke:var(--encre);stroke-width:1.6;opacity:.6;
}
/* celles qui vont s'ouvrir : la paroi a pali */
.plan .p-caps .claire{
  fill:none;stroke:var(--encre);stroke-width:1.6;opacity:.6;
}
/* celles qui vont s'ouvrir : la paroi a pali */
.plan .p-caps .claire{
  fill:none;stroke:var(--encre);stroke-width:1.6;opacity:.6;
}
/* celles qui vont s'ouvrir : la paroi a pali */
.plan .p-caps .claire{
  fill:none;stroke:var(--encre);stroke-width:1.6;opacity:.6;
}
/* celles qui vont s'ouvrir : la paroi a pali */
.plan .p-caps .claire{
  fill:none;stroke:var(--encre);stroke-width:1.6;opacity:.6;
}
/* celles qui vont s'ouvrir : la paroi a pali */
.plan .p-caps .claire{
  fill:none;stroke:var(--encre);stroke-width:1.6;opacity:.6;
}
.plan .p-piece circle,.plan .p-piece path,.plan .p-piece rect{
  fill:none;stroke:var(--encre-3);stroke-width:1.8;
}
/* le tiret qui vise le sol : la serre n'a pas de contour a elle */
.plan .p-tiret path{fill:none;stroke:var(--encre-3);stroke-width:1.2}
.plan .p-tiret circle{fill:var(--encre-3)}
.plan .p-nom text{
  font:400 17px var(--sans);fill:var(--encre-2);
  letter-spacing:.14em;text-transform:uppercase;
  paint-order:stroke;stroke:var(--papier);stroke-width:3.6px;
  stroke-linejoin:round;
}
/* la fiche de placement : un formulaire, donc une lineale et des filets */
.fiche{
  position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;padding:0 58px;
}
.fiche .f-corps{width:100%}
.fiche .f-tete{
  margin:0;font:400 9.4px/14px var(--sans);color:var(--encre-2);
  letter-spacing:.3em;text-transform:uppercase;text-indent:.3em;
  text-align:center;
}
.fiche .f-sous{
  margin:4px 0 0;font:italic 400 9px/13px var(--sans);
  color:var(--encre-3);letter-spacing:.05em;text-align:center;
}
.fiche .f-champs{
  margin:20px 0 0;border-top:1px solid var(--encre-3);
  border-bottom:1px solid var(--encre-3);padding:7px 0 6px;
}
.fiche .f-champs > div{
  display:flex;align-items:baseline;
  font:400 9.8px/20px var(--sans);color:var(--encre);
}
/* imprime : ce que le formulaire demande */
.fiche .f-champs span{
  flex:0 0 128px;color:var(--encre-3);letter-spacing:.14em;
  text-transform:uppercase;font-size:7.8px;
}
/* a la plume : ce qu'Andrew a rempli */
.fiche .f-champs b{
  font:400 12.6px/20px var(--plume);
  font-weight:400;letter-spacing:0;color:var(--encre);
}
/* les deux options sont imprimees ; seule la croix est de lui */
.fiche .f-champs b.f-opt{
  font:400 9.8px/20px var(--sans);letter-spacing:.02em;
}
.fiche .c{
  display:inline-block;width:8px;height:8px;margin-right:7px;
  border:1px solid var(--encre-3);position:relative;vertical-align:-1px;
}
.fiche .c-on::after{
  content:"✕";position:absolute;left:-2px;top:-6.5px;
  font:400 12.5px/1 var(--plume);color:var(--encre);
}
.fiche .c-b{margin-left:20px}
.fiche .f-consigne{
  margin:13px 0 1px;font:italic 400 9px/13px var(--sans);
  color:var(--encre-3);letter-spacing:.04em;
}
.fiche svg{display:block;margin:0 auto}
.fiche .f-lg text{
  font:400 5.9px var(--sans);fill:var(--encre-3);
  letter-spacing:.2em;text-transform:uppercase;
}
.fiche .f-case{
  margin:13px 0 0;border:1px solid var(--encre-3);padding:7px 10px 8px;
}
/* dans un cadre, les champs n'ont plus besoin de leurs propres filets */
.fiche .f-case .f-nb{margin:0;border:0;padding:0}
.fiche .f-clef{
  margin:0;font:400 7.8px/12px var(--sans);color:var(--encre-3);
  letter-spacing:.2em;text-transform:uppercase;
}
.fiche .f-est{
  margin:4px 0 0;font:italic 400 8.6px/12px var(--sans);color:var(--encre-3);
}
.fiche .f-obs{padding-bottom:6px}
/* le pied : un filet imprime, et la main d'Andrew posee dessus */
.fiche .f-pied{
  margin:13px 2px 0;display:flex;align-items:flex-end;
  justify-content:flex-end;gap:13px;
}
.fiche .f-pied .f-clef{padding-bottom:4px}
.fiche .f-trait{
  width:132px;height:27px;border-bottom:1px solid var(--encre-3);
  display:flex;align-items:flex-end;justify-content:center;
}
.fiche .f-sign{
  font:400 17px/1 var(--plume);font-style:normal;color:var(--encre);
  transform:rotate(-2.5deg);padding-bottom:2px;
}
.fiche .f-lignes{margin-top:9px}
/* la main d'Andrew se pose au-dessus du premier filet */
.fiche .f-lignes .f-note{
  display:block;margin:0 0 2px;font:400 11.8px/16px var(--plume);
  font-weight:400;color:var(--encre);
}
.fiche .f-lignes i{
  display:block;height:1px;margin-bottom:11px;
  background:var(--encre-3);opacity:.45;
}
.suite{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.suite span{
  font:400 14px var(--serif);letter-spacing:.44em;text-transform:uppercase;
  color:var(--encre-3);padding-left:.44em;
}
.suite span::before,.suite span::after{
  content:"";display:block;width:38px;height:1px;background:var(--encre-3);
  opacity:.5;margin:0 auto;
}
.suite span::before{margin-bottom:26px;margin-left:calc(50% - 19px - .22em)}
.suite span::after{margin-top:26px;margin-left:calc(50% - 19px - .22em)}

.som{position:absolute;top:74px;width:360px;height:598px;color:var(--encre)}
.page[data-cote="g"] .som{left:48px}
.page[data-cote="d"] .som{left:62px}
.som h3{
  margin:0 0 69px;font:400 13px/23px var(--serif);
  letter-spacing:.34em;text-transform:uppercase;color:var(--encre-3);text-align:center;
}
.som ul{list-style:none;margin:0;padding:0;font:13.4px/34.5px var(--serif)}
.som li{display:flex;align-items:baseline;cursor:default}
.som .fil{
  flex:1;margin:0 .55em;border-bottom:2px dotted var(--encre-3);
  transform:translateY(-.24em);opacity:.95;
}
.som .f{font-variant-numeric:tabular-nums;color:var(--encre-2)}
.som li.ici .n,.som li.ici .f{color:var(--or);font-weight:600}

/* ---------- la couverture ---------- */
#couv,#feuille{
  position:absolute;left:470px;top:0;width:470px;height:752px;
  transform-style:preserve-3d;transform-origin:0 50%;
}
#couv{z-index:9}
#feuille{z-index:8}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
/* la profondeur exacte de chaque face est posee lame par lame */
.face.verso{transform:rotateY(180deg)}

/* Les lames : la feuille est courbe parce qu'elle est articulee. */
.lame{position:absolute;top:0;height:752px;transform-origin:0 50%;transform-style:preserve-3d}
/* Chaque lame deborde d'un pixel sur sa voisine, et ce debordement
   passe DERRIERE elle : ce qui fuit par la couture est alors le meme
   texte au meme endroit, et la couture disparait. */
.lame>.face{left:0;top:0;right:auto;bottom:auto;width:calc(100% + 1px);height:100%}
.fen{position:absolute;top:0;width:470px;height:752px}
/* Les voiles d'ombre sont AU NIVEAU DE LA LAME, devant tout le reste,
   et ils font EXACTEMENT sa largeur : debordants, ils se superposaient
   d'une couture a l'autre et l'ombre y comptait double. L'ame, elle,
   depasse toujours d'un pixel -- elle s'assombrit par filtre, voir
   courber(). Un voile par sens de vue, chacun invisible de dos. */
.voile{
  position:absolute;left:0;top:0;bottom:0;width:calc(100% + 1px);
  pointer-events:none;background:none;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.voile.ar{transform:rotateY(180deg)}

/* Quand le livre est ferme, il n'y a que la couverture : le contre-plat
   restait affiche a cote d'elle, et faisait un carre sombre. */
html[data-ouvert="0"] .cote{visibility:hidden}

/* La corne : le coin deja replie, qui dit qu'on peut prendre la page. */
#corne{
  position:absolute;right:0;bottom:0;width:46px;height:46px;z-index:6;
  border:0;padding:0;background:transparent;cursor:pointer;
  transition:width 260ms cubic-bezier(.3,.85,.4,1),height 260ms cubic-bezier(.3,.85,.4,1);
}
/* l'ombre que le rabat porte sur la page qu'il decouvre */
#corne::before{
  content:"";position:absolute;left:-6px;right:2px;top:-6px;bottom:2px;
  background:linear-gradient(315deg,rgba(0,0,0,.55) 0 50%,transparent 50%);
  filter:blur(5px);
}
/* le rabat lui-meme : le dos de la feuille, et le pli net */
#corne::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(315deg,rgba(0,0,0,.18) 0 14%,rgba(0,0,0,0) 44%,rgba(0,0,0,0) 50%,transparent 50%),
    linear-gradient(315deg,var(--corne) 0 49.4%,var(--corne-2) 49.4% 50%,transparent 50%);
}
#corne:hover{width:88px;height:88px}
#corne:focus-visible{outline:2px solid var(--or);outline-offset:3px}
html[data-ouvert="0"] #corne{display:none}

/* La corne gauche : la meme, en miroir, pour revenir en arriere.
   Discrete au repos ; elle se leve quand le curseur passe. */
#corneg{
  position:absolute;left:0;bottom:0;width:46px;height:46px;z-index:6;
  border:0;padding:0;background:transparent;cursor:pointer;opacity:.3;
  transition:width 260ms cubic-bezier(.3,.85,.4,1),height 260ms cubic-bezier(.3,.85,.4,1),opacity 220ms ease;
}
#corneg::before{
  content:"";position:absolute;left:2px;right:-6px;top:-6px;bottom:2px;
  background:linear-gradient(45deg,rgba(0,0,0,.55) 0 50%,transparent 50%);
  filter:blur(5px);
}
#corneg::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(45deg,rgba(0,0,0,.18) 0 14%,rgba(0,0,0,0) 44%,rgba(0,0,0,0) 50%,transparent 50%),
    linear-gradient(45deg,var(--corne) 0 49.4%,var(--corne-2) 49.4% 50%,transparent 50%);
}
#corneg:hover{width:88px;height:88px;opacity:1}
#corneg:focus-visible{outline:2px solid var(--or);outline-offset:3px;opacity:1}
html[data-ouvert="0"] #corneg{display:none}
#couv .recto{
  background:#171410 center/cover no-repeat;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}
#couv .recto .habillage{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(8,6,4,.60) 0%,rgba(8,6,4,.05) 34%,rgba(8,6,4,.10) 62%,rgba(8,6,4,.78) 100%);
}
#couv .recto .titre{
  position:absolute;left:0;right:0;top:52px;text-align:center;padding:0 34px;
  font:400 33px/1.1 var(--serif);letter-spacing:.17em;text-transform:uppercase;
  color:#F6EFE0;text-shadow:0 2px 18px rgba(0,0,0,.8);
}
#couv .recto .sous{
  position:absolute;left:0;right:0;bottom:58px;text-align:center;
  font:10px var(--sans);letter-spacing:.42em;text-transform:uppercase;color:#D9C9A6;
  text-shadow:0 2px 12px rgba(0,0,0,.9);
}
#couv .recto .filet{
  position:absolute;left:50%;top:112px;width:52px;height:1px;margin-left:-26px;
  background:rgba(246,239,224,.55);
}
#couv .verso{background:linear-gradient(145deg,#2E2A24,#1A1713)}
html[data-nuit="1"] #couv .verso{background:linear-gradient(145deg,#111820,#080C11)}

/* ---------- les flèches ---------- */
.fleche{
  position:fixed;top:50%;transform:translateY(-50%);z-index:20;
  width:56px;height:96px;border:0;border-radius:6px;cursor:pointer;
  background:rgba(255,255,255,.07);color:#8B8474;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;
  transition:background 160ms,color 160ms,opacity 200ms;
}
.fleche:hover{background:rgba(255,255,255,.16);color:#F2EADA}
.fleche:disabled{opacity:.16;cursor:default}
.fleche svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
#prec{left:16px}
#suiv{right:16px}

/* ---------- la barre du bas ---------- */
#barre{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;align-items:center;gap:16px;padding:10px 18px 12px;
  font:11px var(--sans);color:var(--encre-3);
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.45));
}
#barre button{
  border:0;background:rgba(255,255,255,.06);color:var(--encre-3);
  font:11px var(--sans);letter-spacing:.1em;text-transform:uppercase;
  padding:7px 12px;border-radius:4px;cursor:pointer;transition:background 150ms,color 150ms;
}
#barre button:hover{background:rgba(255,255,255,.14);color:#EFE7D6}
#barre button[aria-pressed="true"]{background:rgba(176,139,79,.26);color:#E8D3AA}
#ou{margin-left:auto;letter-spacing:.08em;white-space:nowrap}
#ou b{font-weight:600;color:#CFC3AC}
#rail{flex:1;height:20px;position:relative;cursor:pointer;min-width:120px}
#rail .voie{position:absolute;left:0;right:0;top:9px;height:2px;background:rgba(255,255,255,.11);border-radius:2px}
#rail .fait{position:absolute;left:0;top:9px;height:2px;background:var(--or);border-radius:2px;transition:width 260ms ease}

/* ---------- le sommaire en surimpression ---------- */
#voile{
  position:fixed;inset:0;z-index:30;display:none;
  background:rgba(6,8,11,.72);backdrop-filter:blur(3px);
  align-items:center;justify-content:center;
}
#voile.on{display:flex}
#voile .boite{
  width:min(440px,86vw);max-height:80vh;overflow:auto;
  background:var(--papier);color:var(--encre);padding:34px 38px 30px;border-radius:4px;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.8);
}
#voile .som{position:static;width:auto;height:auto;left:auto}
#voile .som li{cursor:pointer;padding:2px 0;border-radius:3px}
#voile .som li:hover .n{color:var(--or)}

/* ---------- la fiche du glossaire ---------- */
#fiche{
  position:fixed;z-index:22;width:212px;max-height:62vh;overflow:auto;display:none;
  background:var(--papier);color:var(--encre);
  box-shadow:0 22px 48px -14px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.07);
  padding:15px 17px 16px;border-radius:3px;
}
#fiche.on{display:block;animation:venir 180ms ease-out}
#fiche.bas{
  width:auto;left:20px;right:20px;top:auto;bottom:50px;max-height:24vh;
  display:none;column-width:300px;column-gap:26px;
}
#fiche.bas.on{display:block}
#fiche.bas h4{column-span:all}
@keyframes venir{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.glo.ouvert{background:rgba(176,139,79,.22);border-radius:2px}
#fiche h4{margin:0 0 6px;font:600 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--encre-3)}
#fiche p{margin:0;font:12.6px/1.55 var(--serif)}
html[data-glo="1"] .glo{
  border-bottom:1px dotted var(--encre-3);cursor:help;
}
html[data-glo="0"] .glo{border:0;cursor:inherit;pointer-events:none}

/* Le mot d'accueil : rien ne disait que les fleches ouvraient le livre. */
#indice{
  position:fixed;z-index:15;display:flex;align-items:baseline;gap:11px;
  opacity:0;transition:opacity 700ms ease;pointer-events:none;
  color:#7A7262;font-family:var(--sans);max-width:224px;
}
html[data-nuit="1"] #indice{color:#5C6875}
#indice.on{opacity:1;pointer-events:auto;cursor:pointer}
#indice .k{
  font-size:17px;line-height:1;color:#A2917A;
}
html[data-nuit="1"] #indice .k{color:#7CC6DC}
#indice .t{font-size:11px;letter-spacing:.17em;text-transform:uppercase;line-height:1.5}
#indice em{
  display:block;font-style:normal;text-transform:none;letter-spacing:.02em;
  font-size:11.5px;line-height:1.75;opacity:.78;margin-top:6px;
}
/* les touches se dessinent comme des touches, sinon on croit qu'on
   parle des deux fleches posees a l'ecran */
#indice b{
  display:inline-block;font-weight:400;font-size:10.5px;line-height:15px;
  min-width:17px;text-align:center;padding:0 3px;margin:0 1px;
  border:1px solid currentColor;border-radius:3px;opacity:.85;
  vertical-align:.06em;
}

#banc{position:absolute;left:-9999px;top:0;visibility:hidden;height:auto!important}
#attente{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  font:11px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:#6A6053;z-index:40}
</style>
</head>
<body>

<div id="attente">on relie le livre…</div>

<div id="scene">
  <div id="cadre">
    <div id="livre">
      <div id="ombre"></div>
      <div class="tranche" id="trG"></div>
      <div class="tranche" id="trD"></div>
      <div class="cote g" id="pG"></div>
      <div class="cote d" id="pD"></div>
      <button id="corne" title="Page suivante" aria-label="Page suivante"></button>
      <button id="corneg" title="Page précédente" aria-label="Page précédente"></button>
      <div id="feuille" hidden></div>

</div>

<button class="fleche" id="prec" title="Page précédente — flèche gauche"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>

  <button id="bNuit" aria-pressed="false" title="Lecture de nuit — touche N">Nuit</button>

  <div id="ou"></div>
</div>

<div id="indice"><span class="k">&rarr;</span><span class="t">Pour ouvrir<em>Les flèches de l’écran, ou <b>&larr;</b> <b>&rarr;</b> au clavier, tournent les pages.</em></span></div>

<div id="voile"><div class="boite" id="boite"></div></div>
<div class="bloc" id="banc"></div>

<script>
const LIVRE = [
{ id:`prologue`, rang:`Prologue`, titre:`La cérémonie`, quand:``, encart:``, p:[
[`p`,`Deux <a class="glo" data-mot="Capsule">capsules</a> étaient venues pendant la nuit, et personne ne savait qui allait en sortir.`,``,3],
[`p`,`On lui avait donné la salle 4 pour les deux.`,``,0],
[`p`,`C'était trop grand, et il n'avait rien dit. On ne discute pas une salle, et surtout pas celle qui était libre.`,``,0],
[`p`,`Le <a class="glo" data-mot="Veilleur">veilleur</a> poussa la porte, les bras chargés, et le soleil lui arriva dessus d'un coup. Il entrait par les ouvertures ménagées entre les nervures du plafond et posait sur les dalles de longues bandes obliques. Contre le mur du fond, un <a class="glo" data-mot="Coulant">coulant</a> passait. Épais comme un bras, entré par une percée du mur, enroulé autour de deux colonnes, ressorti plus loin sans qu'on sache où il allait.`,``,0],
[`p`,`Personne ne l'avait planté là. On avait bâti autour, et on avait sculpté tout le reste.`,``,0],
[`p`,`Les colonnes étaient couvertes du pied au chapiteau. Des feuilles, des tiges, des grappes lourdes, et dans les feuilles des corps, des mains, des visages tournés vers le milieu de la pièce. Sur la troisième en partant du seuil, la sculpture montait jusqu'à mi-hauteur et s'arrêtait net. Le coulant prenait le relais et continuait jusqu'en haut.`,``,0],
[`p`,`On ne savait pas laquelle des deux avait copié l'autre.`,``,0],
[`p`,`Il posa ses affaires sur la desserte. Vingt-deux chaises empilées contre le mur, en quatre piles inégales. Il n'avait pas décidé de les compter.`,``,0],
[`p`,`Deux capsules, deux postes.`,``,0],
[`p`,`Il déplia la lampe sur pied à hauteur d'épaule, orientée vers le sol, et fit rouler un premier miroir depuis le mur jusqu'à l'emplacement du poste. Il stoppa sa course en activant le frein. Il l'essuya avec le linge accroché à la barre, en commençant par le haut, recula d'un pas, se vit dedans, et le tourna vers le mur. Une bassine à droite, vide, avec les flacons dedans.`,``,0],
[`p`,`Quand il eut terminé de mettre le premier poste en place, il s'affaira au deuxième, réitérant deux mètres plus loin : lampe, miroir, bassine.`,``,0],
[`p`,`Restait la table. Elle trônait au milieu de la pièce, dans la bande de soleil qui tombait là à cette heure-là. Il prit sur la desserte une nappe blanche et toute lisse, ainsi que son chemin de table, une grande bande rectangulaire orangée. Il les ajusta sur le plateau immaculé avant d'y déposer un pichet d'eau au milieu. Un aller-retour à la desserte : deux verres, deux timbales, deux biberons. Il en disposa trois devant chaque place.`,``,0],
[`p`,`On ne pariait pas. Alors on posait les trois, on prenait celui qu'il fallait le moment venu et on remettait les deux autres sur la desserte sans y penser. La pile de serviettes suivait le même principe : quatre tailles, et il en descendit une de chaque.`,``,0],
[`p`,`Il compta les éléments sur la table. Sept. On était bon.`,``,0],
[`p`,`Il récupéra deux chaises du tas.`,``,0],
[`p`,`Les visiteurs arrivèrent avant les capsules, comme toujours, par petits groupes, et ils s'installèrent le long des murs en parlant à voix basse. Ils s'appliquaient à parler bas. C'était une chose qu'on faisait ici sans que personne l'ait jamais demandé. On avait prévenu tard, alors ils n'étaient pas nombreux. Ils étaient douze, et ils tenaient tous sur un seul côté.`,``,0],
[`p`,`Deux marches basses couraient le long de ce mur-là, pour ceux de derrière. Trois s'assirent dessus, les autres restèrent debout. Ils n'avaient pas d'âge commun : une femme qui en paraissait quatre-vingts, deux hommes autour de la cinquantaine, un autre d'une vingtaine d'années qui les connaissait tous et les appelait par leur prénom.`,``,0],
[`p`,`Nora entra la dernière, en nouant ses manches.`,``,0],
[`tiret`,`— Bonjour Andrew. On est deux ?`,``,0],
[`tiret`,`— On est deux.`,``,0],
[`tiret`,`— Alors c'est un bon jour.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Deux nouvelles personnes, des <a class="glo" data-mot="Préparateur">préparateurs</a>, entrèrent à leur tour et firent rouler deux chariots jusqu'à leur poste respectif ; un murmure parcourut le petit groupe.`,``,1],
[`p`,`Ils étaient de la <a class="glo" data-mot="Serre">serre</a>. C'étaient eux qui vivaient au milieu de la <a class="glo" data-mot="Coulée">coulée</a>, qui la suivaient d'un bout à l'autre, qui savaient déterminer à la main quand une capsule était prête et qui, après validation interne, la décrochaient.`,``,0],
[`p`,`Les deux <a class="glo" data-mot="Éclaircie">éclaircies</a> du jour étaient couchées côte à côte, comme on les avait <a class="glo" data-mot="Cueillie">cueillies</a>. Une capsule, ça ne pousse pas debout : ça pousse à plat sur le coulant, en rang avec les autres, et il faut la détacher de ce qui la porte. Celles-ci étaient venues dans la nuit, toutes les deux, d'un coup, à quelques <a class="glo" data-mot="Travée">travées</a> l'une de l'autre, et il avait fallu monter la <a class="glo" data-mot="Cérémonie">cérémonie</a> au matin.`,``,0],
[`p`,`Elles faisaient la longueur d'un corps et un peu plus. Larges au milieu, effilées aux deux bouts, avec cette dissymétrie qu'ont les choses qui ont poussé : un flanc plus plein que l'autre, une courbe qui reprenait là où on ne l'attendait pas. Des nervures couraient sur toute la longueur, très fines, serrées près des pointes et écartées au ventre, et elles se rejoignaient sans jamais tout à fait se toucher. Rien là-dedans n'avait été dessiné.`,``,0],
[`p`,`Elles étaient belles. La paroi avait pris ce jaune très pâle qui vient à la fin, presque comme de la cire, et par endroits on voyait au travers. Une ombre plus dense, une courbe, quelque chose de replié. On ne distinguait rien de plus. Là-dedans, tout se confondait avec le fond, et ceux qui prétendaient reconnaître un genou ou une épaule à travers une paroi mentaient, ou débutaient.`,``,0],
[`p`,`Sur le dessus, le rabat était en place, plus sombre et plus mat que le reste. Personne n'y avait taillé quoi que ce soit : à ce stade la paroi est si fine qu'elle finirait par céder toute seule, et on ne fait pas d'entailles à une chose qui va s'ouvrir sans vous.`,``,0],
[`p`,`Le reste avait été fait ailleurs, par d'autres mains. Nettoyées, branchées, relevées une dernière fois.`,``,0],
[`p`,`Les préparateurs redressèrent les chariots. Les capsules passèrent de l'horizontale à la verticale en trois crans, très lentement, avec un bruit de crémaillère que tout le monde entendit.`,``,0],
[`p`,`Un des préparateurs lui tendit les deux fiches de cueillie, puis rejoignit son collègue, déjà droit et immobile, les mains croisées devant lui, sur une des bordures de la salle. Andrew les parcourut en diagonale et les rangea dans son carnet. L'heure de la cueillie, et l'état de chaque capsule avant cérémonie.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Il prit le rabat à deux mains et le replia d'un quart. Ça ne cassait pas, ça pliait, et ça tenait où on le laissait. Un quart, pas plus : le visage, la gorge, le haut des épaules. Le reste attendrait le second veilleur.`,``,1],
[`p`,`La lumière entra dedans.`,``,0],
[`p`,`Le corps eut un mouvement — pas un sursaut, un ralentissement de tout, comme quelqu'un qu'on tire d'un sommeil trop profond et qui remonte par paliers. Les paupières bougèrent sans s'ouvrir. Elles s'ouvrirent, se refermèrent aussitôt sur la lumière, se rouvrirent à moitié. Les pupilles mirent longtemps à se faire.`,``,0],
[`p`,`On chuchota « douze » le long du mur, et « treize » plus loin.`,``,0],
[`p`,`Un voile de gelée le recouvrait entièrement, orange, épais, mat, sans une goutte nulle part. Ça ne coulait pas, cette chose-là. Ça s'enlevait. Andrew posa la main à plat sur l'épaule et fit descendre la paume : le voile vint d'un seul tenant, roulé sur lui-même comme la pelure d'un fruit, et découvrit le bras et la main, qui étaient parfaitement propres et parfaitement secs. Il le déposa dans la bassine. Il recommença sur l'autre épaule.`,``,0],
[`p`,`Le corps était placé comme on se place pour dormir quand on n'a mal nulle part.`,``,0],
[`p`,`Le veilleur sortit un instrument — étrange pour qui ignore à quoi il sert, banal pour qui sait le manier. Il fit le relevé. Puis, comme un exercice exécuté depuis des années, il trancha pour tous.`,``,0],
[`tiret`,`— Capsule éclaircie, <a class="glo" data-mot="Arrivant">arrivant</a> réactif. L'Archiviste lui a compté dix ans.`,``,0],
[`tiret`,`— Dix ans, répéta le visiteur d'une vingtaine d'années. C'est si rare !`,``,0],
[`p`,`Plus loin sur la marche, quelqu'un souffla par le nez. Personne ne se retourna.`,``,0],
[`p`,`Andrew fit pivoter le miroir sur son pied et le régla en biais, à la bonne hauteur, un peu de trois quarts.`,``,0],
[`p`,`Le garçon se vit.`,``,0],
[`p`,`Il resta là-dessus un long moment. Sa respiration changea de rythme deux fois.`,``,0],
[`p`,`Puis il regarda les différents visages qui s'attardaient sur le sien, l'autre capsule à deux mètres de la sienne, et le plafond, qu'il interrogea du regard pour comprendre d'où venait la lumière.`,``,0],
[`p`,`Puis le regard du garçon se posa sur lui.`,``,0],
[`p`,`C'était le signe ; on ne parlait jamais avant.`,``,0],
[`tiret`,`— Bienvenue à toi.`,``,0],
[`p`,`Il attendit.`,``,0],
[`tiret`,`— Ici, chacun a un mot qui le désigne. Un seul, et c'est le sien, et il ne changera pas. Comment veux-tu qu'on t'appelle ?`,``,0],
[`p`,`Le jeune arrivant répondit sans réfléchir une seconde, comme on répond à une question dont on connaît la réponse depuis toujours.`,``,0],
[`tiret`,`— Eliott.`,``,0],
[`p`,`Andrew écrivit le mot sur son carnet, et à la suite le numéro qu'il porterait toute sa vie. Il souligna les deux.`,``,0],
[`p`,`Puis il prit les deux flacons et les remplit lui-même, à même le voile, en le pressant entre le pouce et l'index. Il les boucha, les essuya, les rangea debout dans un coin de la bassine.`,``,0],
[`p`,`Nora prit son relais et ôta le rabat en entier. La veilleuse passa autour du corps d'Eliott et décolla ce qui restait de gelée aux plis des coudes et des genoux.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`De la même manière, Andrew replia le second rabat d'un quart et l'arrêta là.`,``,1],
[`p`,`Ce corps-là mit plus longtemps à revenir. Une quarantaine d'années, et pour une fois personne ne se trompa de beaucoup. Il ouvrit les yeux, les referma, les rouvrit, et regarda le plafond très haut sans rien y chercher.`,``,0],
[`p`,`Eliott observait la scène tandis que Nora s'affairait autour de lui. Il regardait ce qu'on faisait à l'autre. Les mains sur l'épaule, le voile qui venait d'un tenant, le miroir qu'on tournait. Il regardait comme on regarde quelqu'un subir la chose qu'on vient soi-même de subir, avec cet intérêt un peu bête qu'on y met.`,``,0],
[`p`,`Nora tendit les mains. Le garçon les prit et sortit tout seul, les jambes hésitantes, et elle le tint le temps qu'il fallait. Elle lui passa par la tête une serviette de cérémonie — un grand rectangle de toile percé d'un trou, qui tombait droit devant et droit derrière — croisa les pans sur les côtés et les ferma d'une ceinture.`,``,0],
[`p`,`Le garçon brisa les murmures en une phrase.`,``,0],
[`tiret`,`— Il faut vider mes poches.`,``,0],
[`p`,`Personne ne répondit. Il ne regardait personne en particulier, et il attendait vraiment qu'on fasse quelque chose.`,``,0],
[`tiret`,`— Elles sont pleines.`,``,0],
[`p`,`Deux ou trois personnes regardèrent la serviette, comme s'il avait pu y avoir des poches dessus. Il n'y avait rien. Une femme, au milieu du mur, avait posé la main sur le bras de son voisin sans s'en apercevoir.`,``,0],
[`p`,`Andrew ne se retourna pas. Il avait les deux mains occupées à prélever la gelée sur le corps de l'homme.`,``,0],
[`p`,`Puis le garçon reprit, plus doucement, comme on rassure quelqu'un :`,``,0],
[`tiret`,`— Je reviens bientôt.`,``,0],
[`p`,`Nora marqua un temps. Un seul.`,``,0],
[`tiret`,`— Ça arrive, dit-elle, pour la salle. Ça arrive souvent.`,``,0],
[`p`,`Et c'était vrai. Les arrivants sortaient avec la langue et rien d'autre, et la langue tournait à vide un moment avant de se poser sur quelque chose. Il n'y avait rien à comprendre ; juste à attendre. Ce n'était pas systématique.`,``,0],
[`tiret`,`— Non non, tu ne comprends pas, c'est un peu tard !`,``,0],
[`p`,`La veilleuse eut un léger mouvement de tête étonné, sauvé par un sourire rassurant. Elle rajusta sa serviette qui n'en avait pas besoin et l'installa à table.`,``,0],
[`p`,`Il rouvrit la bouche, la referma. Et ce fut tout.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Andrew sortit l'instrument, fit le relevé, et trancha pour tous.`,``,1],
[`tiret`,`— Capsule éclaircie, arrivant réactif. L'Archiviste lui a compté quarante-deux ans.`,``,0],
[`p`,`Le miroir pivota. L'homme se vit dedans. Il regarda longtemps, lui aussi.`,``,0],
[`p`,`Puis on lui posa la même question qu'au garçon.`,``,0],
[`tiret`,`— Nicolas.`,``,0],
[`p`,`La voix sortit grave et éraillée, et elle le surprit autant que les autres.`,``,0],
[`p`,`Andrew s'éloigna et vint se placer près du pichet. Son travail aux postes s'arrêtait là.`,``,0],
[`p`,`Sa collègue finit tout ce qu'il y avait à faire, aida le quadragénaire à sortir et le dirigea vers la table, à la place voisine. Il posa les mains à plat devant lui parce qu'il ne savait pas quoi en faire.`,``,0],
[`p`,`Puis il tourna la tête.`,``,0],
[`p`,`Eliott le regardait déjà.`,``,0],
[`p`,`L'homme leva la main et se toucha la bouche, du bout des doigts, comme on vérifie une chose qu'on vient de voir. Eliott leva la main et se toucha la bouche.`,``,0],
[`p`,`Il fit descendre l'index le long de son menton. Eliott fit descendre le sien.`,``,0],
[`p`,`Il ouvrit la paume devant lui et la regarda. Eliott ouvrit la sienne.`,``,0],
[`p`,`Quelqu'un rit tout bas contre le mur. C'était drôle, ce petit qui singeait l'autre, et la salle avait besoin de rire de quelque chose.`,``,0],
[`p`,`L'homme s'aperçut de ce qui se passait et s'arrêta. Eliott s'arrêta aussi, la main en l'air, puis il la reposa sur la table.`,``,0],
[`p`,`Ça dura le temps que ça dura, et il tira sur sa serviette parce qu'elle glissait de l'épaule.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Andrew prit le pichet et fit le tour de la table. Il versa de l'eau dans chacun des verres et les recentra en face de chaque arrivant. Il récupéra le reste et le rapporta à la desserte.`,``,1],
[`p`,`Ils burent tous les deux.`,``,0],
[`p`,`Après le nom, le pichet. C'était l'usage, et personne n'aurait su dire depuis quand : on disait que la première eau emportait ce qui restait du sommeil, et que personne ne pouvait aller le chercher à sa place. Ceux qui n'y croyaient pas regardaient quand même — c'est le seul moment où l'on voit un corps faire une chose que personne ne lui a apprise.`,``,4],
[`p`,`L'homme reposa son verre, regarda le fond, et le reprit.`,``,0],
[`p`,`Alors la salle s'avança, et pour la première fois de la matinée il y eut du bruit.`,``,0],
[`p`,`Ils vinrent un par un déposer au milieu de la table ce qu'ils avaient apporté pour leur porter chance. Un fruit. Une boule d'osier tressée. Trois épis noués par un fil de laine rouge. Une pierre plate. Une femme posa la sienne, la regarda, et la tourna d'un quart. Elle voulait qu'elle soit dans le bon sens. Il n'y avait pas de bon sens.`,``,0],
[`p`,`Ça se penchait pour mieux voir. Ça commentait.`,``,0],
[`tiret`,`— Bienvenue, dirent plusieurs, sans s'adresser à personne en particulier.`,``,0],
[`p`,`D'autres reprirent le mot en passant derrière eux. Une main s'attarda une seconde sur une épaule et repartit.`,``,0],
[`p`,`Aucun d'eux ne les connaissait. Aucun ne les reverrait. Ça n'enlevait rien.`,``,0],
[`p`,`Eliott regardait le tas grossir au milieu de la table.`,``,0],
[`p`,`Puis les visiteurs sortirent, dans le même ordre où ils étaient entrés.`,``,0],
[`p`,`Andrew tint la porte le temps que le dernier passe, et il la referma sur eux.`,``,0],
[`p`,`Le bruit du couloir s'arrêta net.`,``,0],
[`p`,`Nora fit signe à Eliott et Nicolas de la suivre. Ils se levèrent et lui emboîtèrent le pas, vers une porte au fond de la pièce à laquelle ni l'un ni l'autre n'avait fait attention jusqu'ici.`,``,0],
[`p`,`Elle s'ouvrit sur du vert, et se referma.`,``,0],
[`p`,`Les préparateurs recouchèrent les capsules sur les chariots, chargèrent les bassines et les emportèrent. Un moment plus tard, il n'y avait plus dans la pièce que deux miroirs, deux lampes, une table avec des cadeaux dessus, et un homme debout avec un carnet.`,``,0],
[`p`,`Andrew reporta les deux arrivants en une ligne. Le jour, les deux travées, l'heure, les âges relevés, les deux mots, les deux numéros. Il écrivait vite, d'une écriture qui n'était belle nulle part ailleurs.`,``,0],
[`p`,`Sous la ligne, il y avait une case pour les observations.`,``,0],
[`p`,`Son regard remonta d'un cran, sur le mot du garçon, et redescendit dessus. La pointe de la plume effleura le papier, s'y attarda, et se releva.`,``,0],
[`p`,`Il rangea le carnet.`,``,0],
[`p`,`Il éteignit les deux lampes et sortit.`,`fin`,0],
]},
{ id:`chapitre-1`, rang:`Chapitre I`, titre:`Une journée à la ruche`, quand:``, encart:``, p:[
[`p`,`Quatre cent trente-huit.`,``,3],
[`p`,`C'était le nombre de pas qui séparaient sa porte de celle de la <a class="glo" data-mot="Ruche">ruche</a>. Il ne l'avait jamais compté exprès : le chiffre était venu tout seul, un matin, et il n'était jamais reparti. Les jours où une voiture se garait en travers du trottoir, il en faisait quatre cent quarante et un. Ces matins-là ne comptaient pas.`,``,0],
[`p`,`La ruche s'ouvrait par deux battants de bois clair que personne ne fermait avant la nuit. Sur le montant de droite, à hauteur d'épaule, on avait taillé une capsule de profil, d'un seul trait. Tant de mains l'avaient touchée en entrant qu'elle n'était plus qu'un creux. Andrew y posa la sienne sans y penser, comme les autres.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Tout de suite en entrant, sur la gauche, l'accueil.`,``,1],
[`p`,`C'était une grande pièce rectangulaire, basse de plafond, la seule du complexe qui eût quelque chose de familier. On y trouvait un guichet derrière une vitre, quelques chaises alignées contre les murs et d'autres disposées dos à dos au centre de la pièce. Dix-huit visiteurs attendaient qu'on vienne les chercher. Deux d'entre eux gardaient sur les genoux ce qu'ils avaient apporté avec eux, refusant, pour une raison ou pour une autre, de le poser à leurs pieds.`,``,0],
[`p`,`Tous savaient qu'il faudrait attendre. Une cérémonie ne commence pas parce que ceux qui doivent y assister sont arrivés.`,``,0],
[`p`,`Alors chacun s'occupait comme il pouvait. De petits groupes s'étaient formés, trois ou quatre personnes tout au plus, et les conversations flottaient dans la pièce à cette hauteur de voix que personne n'a besoin de demander. On échangeait des suppositions sur la salle où l'on serait envoyé, sur le nombre de personnes qui viendraient ensuite, sur l'âge qu'on leur donnerait, sur ce qu'on allait voir entrer.`,``,0],
[`p`,`Chez certains, l'attente commençait à se lire sur les visages.`,``,0],
[`p`,`Près de la porte du fond, quatre visiteurs la regardaient toutes les deux minutes.`,``,0],
[`p`,`La pièce, pourtant, avait été pensée pour rendre l'attente supportable. Aux deux extrémités, de grandes plantes s'élevaient le long de troncs fins qui semblaient avoir poussé avec elles. Leur feuillage, plus dense à la base, s'ouvrait ensuite en larges feuilles retombant de part et d'autre.`,``,0],
[`p`,`Sur les murs, des tableaux de marqueterie. De fines feuilles de bois, choisies dans des essences différentes, découpées puis assemblées bord à bord jusqu'à ce que les joints disparaissent. Rien n'était peint. Les couleurs appartenaient au bois : ses blonds, ses bruns, ses noirs, ses veines qui devenaient parfois presque des lignes de dessin.`,``,0],
[`p`,`Ceux-là montraient des montagnes qui n'existaient nulle part. Des versants blonds sous des ombres presque noires, des ciels parcourus de veines qu'aucun ciel n'avait jamais eues. La matière faisait le paysage autant qu'elle le représentait.`,``,0],
[`p`,`On s'arrêtait parfois devant sans savoir ce qui avait retenu le regard — le paysage, le bois, ou la manière dont l'un était devenu l'autre.`,``,0],
[`p`,`Des appliques diffusaient une lumière jaune orangé, douce sans être faible.`,``,0],
[`p`,`Et, au fond de la pièce, une sculpture de verre s'élevait presque jusqu'au plafond. De minces filets d'eau coulaient le long de ses deux faces et disparaissaient dans un bassin qu'on distinguait à peine.`,``,0],
[`p`,`C'était le seul bruit continu de la salle.`,``,0],
[`p`,`L'eau.`,``,0],
[`p`,`Anna, la secrétaire, leur avait expliqué comment ça allait se passer. Elle le referait pour ceux qui arriveraient en retard, et elle le referait encore pour ceux qui n'avaient rien retenu la première fois, parce qu'il y en avait toujours un ou deux qui avaient la tête dans les nuages, tant le moment était un rendez-vous attendu.`,``,0],
[`p`,`Il longea le comptoir, en poussa le portillon et prit lui-même sa feuille dans un casier. Du côté des chaises, il y eut ce petit temps d'arrêt qu'on a lorsqu'un médecin traverse sa propre salle d'attente sans s'y asseoir.`,``,0],
[`tiret`,`— Bonjour Anna.`,``,0],
[`tiret`,`— Bonjour toi. Salle 2, ils sont quatre aujourd'hui. Nora descend à dix heures.`,``,0],
[`tiret`,`— Quatre.`,``,0],
[`tiret`,`— Quatre. Tu es en avance de deux minutes.`,``,0],
[`tiret`,`— Je suis toujours en avance de deux minutes.`,``,0],
[`tiret`,`— Je sais. C'est pour ça que je le dis.`,``,0],
[`p`,`Il rit. C'était la même plaisanterie depuis des années et elle marchait encore.`,``,0],
[`p`,`Le veilleur plia la feuille en deux et la glissa dans la poche basse de sa blouse. Il quitta l'accueil et s'engagea dans un grand couloir.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Les dix-huit, eux, ne prendraient pas ce chemin. On viendrait les chercher dans la salle d'attente, puis on les ferait sortir par l'autre côté. De là, ils traverseraient la zone de résidence avant de rejoindre la porte qui leur était destinée.`,``,1],
[`p`,`Cette partie du complexe était réservée aux arrivants. Après l'examen de la cueillie — le tout premier examen de leur vie —, ils y resteraient huit jours au minimum. Des chambres, un réfectoire, et quelques visiteurs chargés de leur tenir compagnie pendant ce qui pouvait ressembler, vu de l'extérieur, à une période de repos.`,``,0],
[`p`,`La première inspection avait un but simple : s'assurer que l'arrivant était bien arrivé immaculé, sans anomalie ni blessure.`,``,0],
[`p`,`On n'était jamais trop prudent.`,``,0],
[`p`,`D'après les études menées jusque-là, toutes les capsules n'avaient pas les mêmes délais de maturation. Il arrivait même que, d'une travée à l'autre, leur maturation s'achève sur des relevés étranges. Dans ces cas-là, on vérifiait que l'arrivant n'avait pas été touché d'une manière ou d'une autre au cours du processus.`,``,0],
[`p`,`Cette vérification revenait à l'<a class="glo" data-mot="Analyste">analyste</a>.`,``,0],
[`p`,`Ils étaient hommes et femmes, tous experts dans leur domaine, et passaient déjà leurs journées à étudier les capsules, leurs mesures et leurs variations. Il n'y avait donc rien d'étrange à ce qu'ils examinent également ce qui en sortait.`,``,0],
[`p`,`C'était, au fond, la même chose.`,``,0],
[`p`,`Du moins, c'était ainsi qu'on le présentait.`,``,0],
[`pause`,``,``,0],
[`p`,`Le couloir était large et linéaire, avec un plafond bas et des appliques disposées tous les six mètres. Pendant vingt pas, on aurait pu se croire dans n'importe quel bâtiment administratif du pays.`,``,1],
[`p`,`Puis le plafond montait.`,``,0],
[`p`,`Il montait d'un coup, et continuait de monter.`,``,0],
[`p`,`À mesure qu'il s'élevait, les lampes devenaient inutiles. On ne les éteignait pas — personne n'avait jamais reçu l'ordre de le faire — mais quelque chose de plus grand qu'elles arrivait par le haut. Le jour tombait de très loin, en longues obliques. Sur les dalles, il déposait des plaques claires que l'on pouvait traverser ou contourner.`,``,0],
[`p`,`Andrew les traversait.`,``,0],
[`p`,`On n'était pas dehors. On n'était jamais dehors, ici. Tout tenait sous un seul toit, et ce toit était si haut qu'on avait cessé d'y penser.`,``,0],
[`p`,`Les murs, eux, étaient sculptés.`,``,0],
[`p`,`Pas décorés : sculptés.`,``,0],
[`p`,`Du sol jusqu'à la hauteur où le regard renonce, des bandes horizontales couraient sur toute la longueur, l'une au-dessus de l'autre. Dans chacune, une scène minuscule qu'il aurait fallu s'arrêter pour lire. Des entrelacs s'intercalaient entre les bandes. Des signes revenaient tous les trois mètres, et plus personne ne connaissait leur valeur. Derrière tout cela, taillé plus profondément dans la pierre, un second plan n'apparaissait qu'en biais, lorsque le jour tombait du bon côté.`,``,0],
[`pause`,``,``,0],
[`p`,`Ce n'était pas de la magie.`,``,1],
[`p`,`Ce patrimoine n'avait pas surgi de nulle part du jour au lendemain, et personne n'avait jamais prétendu le contraire. Seulement, on n'avait jamais su de quelle génération l'idée était venue.`,``,0],
[`p`,`Et par-dessus, la végétation courait.`,``,0],
[`p`,`Elle avait l'air libre, mais elle ne l'était pas tout à fait. On avait bâti là où l'on pouvait bâtir, ce qui supposait qu'on avait regardé avant. Ensuite, on s'était adapté.`,``,0],
[`p`,`Jamais un coulant n'avait été coupé pour faire passer un mur.`,``,0],
[`p`,`Lorsqu'un coulant passait, on perçait le mur et on continuait de l'autre côté. Il y avait des trous partout, ronds et propres, avec un brin vert au milieu, et personne ne trouvait cela remarquable.`,``,0],
[`p`,`À mi-parcours, une porte sur la droite ouvrait sur la salle de repos. Une odeur de café s'en échappait, mêlée à des voix qui se coupaient la parole. Il reconnut celle de Nora.`,``,0],
[`p`,`Il ne s'arrêta pas pour autant.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Puis le couloir cessa.`,``,1],
[`p`,`Il ne donnait pas sur une pièce. Il donnait sur un volume.`,``,0],
[`p`,`Le sol changeait, la lumière aussi. L'air était plus lourd de deux ou trois degrés. La coulée prenait tout : les murs, l'espace entre les colonnes, la traversée du vide, du sol jusqu'à des hauteurs où personne n'était jamais monté vérifier.`,``,0],
[`p`,`Et sur la coulée, les capsules.`,``,0],
[`p`,`Il y en avait partout, et jamais deux fois au même endroit.`,``,0],
[`p`,`Une à hauteur de hanche, sur un coulant qui rampait le long d'un banc. Une autre à six mètres, seule, accrochée à une branche qui traversait le vide. Puis, dix pas plus loin, six collées les unes aux autres sur deux mètres, si serrées qu'il faudrait les décrocher dans l'ordre.`,``,0],
[`p`,`Elles poussaient à plat, couchées sur ce qui les portait.`,``,0],
[`p`,`Jeunes, elles avaient la couleur de la coulée. Puis elles la perdaient en mûrissant, jusqu'à prendre, à la fin, ce jaune orangé, presque translucide, qui indiquait qu'elles étaient prêtes.`,``,0],
[`p`,`Pour aller chercher celles qui poussaient en hauteur, on montait des échafaudages. On les redescendait ensuite.`,``,0],
[`p`,`C'était la serre.`,``,0],
[`p`,`Très haut, sur une plateforme montée la veille, trois préparateurs travaillaient autour d'une capsule considérée comme arrivée à maturité. Deux la tenaient par-dessous pendant que le troisième la détachait. Ils ne l'auraient pas fait hier et ils ne le feraient pas demain : l'analyste avait donné le jour, et c'était aujourd'hui. On appelait ça la cueillie. L'heure serait notée, et elle finirait sur la fiche qu'on remettrait au veilleur.`,``,0],
[`p`,`Au loin, immanquable, la porte du <a class="glo" data-mot="Registre">registre</a>. Massive, elle aussi tout autant chargée d'ornements que le reste, encadrée de chaque côté par le mur de pierre qui faisait le tour de la salle, et la coulée serpentant dessus par endroits. Il n'allait pas là non plus.`,``,0],
[`p`,`Les différents quartiers, eux, se fondaient dans l'environnement de la serre. Des murs, un toit, une porte, sculptés comme tout ce qui avait été bâti ici, et la coulée qui passait entre eux et par-dessus.`,``,0],
[`p`,`Un préparateur répondant au nom de Bastien reconnut le veilleur de loin, à sa silhouette et à sa façon de marcher.`,``,0],
[`pause`,``,``,0],
[`p`,`Andrew était grand sans être imposant, l'épaule large, la taille droite, avec la solidité tranquille de ceux qui entretiennent leur condition sans chercher à paraître plus forts qu'ils ne le sont. Cheveux bruns, courts, légèrement désordonnés, deux ou trois mèches refusant de rester en place — et quelques autres restées blanches.`,``,1],
[`p`,`Cinquante-deux ans. Dix ans de service.`,``,0],
[`p`,`Il portait la tenue, comme tout le monde ici : blouse de toile écrue, croisée sur le devant, six boutons sur le côté droit, l'écusson de la ruche brodé sur l'épaule opposée, deux poches basses. La ceinture au septième trou en partant du bout. Le petit clic tombait toujours au même endroit. Pas six, pas huit.`,``,0],
[`p`,`Ses chaussures étaient la seule chose à lui.`,``,0],
[`pause`,``,``,0],
[`p`,`Bastien traversa pour le rejoindre. Il venait de la coulée et ça se voyait : manches roulées, avant-bras verts jusqu'au coude, et cette odeur de tige coupée que les gens de la serre traînent partout et ne sentent plus.`,``,1],
[`p`,`Il arriva à hauteur d'Andrew, assez près pour voir le reste. Barbe de trois jours, mâchoire carrée, nez droit, sourcils épais. Les yeux du veilleur étaient d'un brun profond, attentifs, toujours en train d'observer quelque chose : chaleureux quand il se détendait, nettement plus sérieux dès qu'il se concentrait. Rien d'intimidant au premier regard. Ce n'était pas une raison pour le sous-estimer.`,``,0],
[`tiret`,`— Andrew ! Tu tombes bien.`,``,0],
[`tiret`,`— C'est ce qu'on me dit tous les matins, et ça n'a jamais rien annoncé de bon.`,``,0],
[`tiret`,`— J'ai un problème de compte. Tu as deux minutes ?`,``,0],
[`tiret`,`— J'ai deux heures.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Le quartier des préparateurs s'ouvrait sur une allée centrale, assez large pour y faire passer deux chariots de front, et de chaque côté des boxes où l'on travaillait. Pas de portes : des cloisons à mi-hauteur, un établi par box, des crochets partout. Des caisses empilées contre le mur du fond, quatorze. Sur la cloison de droite, un tableau noir couvert de numéros de travées, effacé et réécrit tant de fois que le noir était devenu gris.`,``,1],
[`pause`,``,``,0],
[`p`,`Ils étaient une quinzaine, et il n'y avait pas de bureaux.`,``,1],
[`p`,`Deux ou trois levèrent la main en le voyant entrer. On lui proposa du café et il accepta de bon cœur. Il n'avait pas fait le détour par la salle de repos ; ce n'était pas une raison pour refuser une bonne tasse.`,``,0],
[`pause`,``,``,0],
[`p`,`Dans le premier box, sur l'établi, une capsule. Cueillie dans la nuit, calée sur deux berceaux de mousse, avec deux personnes autour. L'une lavait la paroi au chiffon, à l'eau claire, en tournant toujours dans le même sens, et l'eau du seau était verte. L'autre avait décollé le rabat sur dix centimètres, glissé dessous trois sondes souples, et rabattu par-dessus. Les sondes remontaient jusqu'à un appareil posé au bout de la table, une caisse grise avec un cadran et deux aiguilles qui ne bougeaient presque pas.`,``,1],
[`p`,`C'était la dernière chose qu'on faisait à une capsule. Après ça, elle ne serait plus touchée que par un veilleur.`,``,0],
[`tiret`,`— Elle est pour toi, celle-ci, non ? dit le préparateur au chiffon.`,``,0],
[`tiret`,`— Salle 2. À dix heures.`,``,0],
[`tiret`,`— Elle est belle.`,``,0],
[`tiret`,`— Elles sont toutes belles.`,``,0],
[`tiret`,`— Celle-là, ce n'est pas pareil. Regarde-la.`,``,0],
[`p`,`Il la regarda. Elle était belle.`,``,0],
[`p`,`L'homme au chiffon s'émerveillait devant une capsule comme quelqu'un qui n'en aurait jamais vu.`,``,0],
[`tiret`,`— On ne t'en a pas montré, à l'<a class="glo" data-mot="École">école</a> ? dit Andrew.`,``,0],
[`tiret`,`— Oh si, si. Mais ce n'est pas la même chose que de les voir en vrai !`,``,0],
[`p`,`« Capsule éclaircie, arrivant réactif. L'Archiviste lui a compté soixante-seize ans », se souvint Andrew en considérant son sourire béat.`,``,0],
[`p`,`Personne ne pouvait lui en vouloir. Il venait tout juste de quitter les bancs de l'école et il avait encore des cours du soir, et ça faisait à peine un mois qu'il était là. Un apprenti modèle, qui apprenait vite.`,``,0],
[`p`,`Dans ce service — comme partout ailleurs — les plus anciens du métier étaient aussi ceux qui avaient l'air les plus jeunes. Ça se comprenait très bien.`,``,0],
[`pause`,``,``,0],
[`p`,`Vera arrivait derrière eux. En tant qu'analyste, elle se pencha sur le cadran, le regarda deux secondes et ne dit rien. Elle continua jusqu'au fond de la pièce, où l'attendaient un tabouret trop haut pour sa table et l'ensemble de ses planches.`,``,1],
[`pause`,``,``,0],
[`p`,`Quand l'analyste tranchait, elle avait raison. Ce n'était pas une affaire de grade — personne dans ce bâtiment ne commandait à personne. C'était son métier, et rien d'autre. La maturation d'une capsule, elle l'avait apprise par cœur, année après année, relevé après relevé. Observer, reconnaître, comparer, prédire. Le préparateur cueillait, lavait, branchait et conduisait ; il écoutait la date qu'on lui donnait, il l'acceptait sans discuter, et il avait cent fois raison de le faire.`,``,1],
[`tiret`,`— La dix-neuf, dit Bastien.`,``,0],
[`tiret`,`— La travée dix-neuf ?`,``,0],
[`tiret`,`— Oui. Elle a douze capsules.`,``,0],
[`p`,`Vera ne leva pas la tête tout de suite.`,``,0],
[`tiret`,`— Elle en a onze.`,``,0],
[`tiret`,`— Ça, c'était avant. Maintenant il y en a douze. Je suis allé les recompter trois fois.`,``,0],
[`p`,`Elle posa son crayon et sortit sa planche de la travée dix-neuf. Onze colonnes, onze séries, onze histoires commencées à onze dates différentes. La douzième n'était nulle part. Elle n'avait jamais été relevée, parce que personne n'avait jamais su qu'elle était là.`,``,0],
[`tiret`,`— Elle est où ?`,``,0],
[`tiret`,`— Tout au fond, au ras du sol, sous les autres. On ne la voit qu'accroupi. Je ne descends pas là toutes les semaines.`,``,0],
[`tiret`,`— Depuis quand ?`,``,0],
[`tiret`,`— Aucune idée.`,``,0],
[`p`,`Andrew écoutait sans rien dire. Ça n'avait rien d'extraordinaire : une capsule pousse où elle pousse, personne n'a jamais choisi l'emplacement d'une seule d'entre elles, et il y en avait des dizaines de milliers dans ce bâtiment. On en oubliait. On les retrouvait.`,``,0],
[`tiret`,`— Tu l'as touchée ? dit Vera.`,``,0],
[`tiret`,`— Oui.`,``,0],
[`tiret`,`— Et ?`,``,0],
[`tiret`,`— Elle est prête.`,``,0],
[`p`,`Une main de préparateur ne valait pas celle d'une analyste. Bien sûr qu'elle pouvait sembler prête. Ce n'était pas si simple que ça.`,``,0],
[`p`,`Le geste seul ne donnait pas de date. Vera pouvait relever cette capsule dans l'heure, elle n'aurait qu'un point sur un graphique vierge, et il en fallait quatre au minimum pour chiffrer correctement le jour d'une éclaircie totale. Toutes les capsules n'arrivaient pas à maturation de la même manière. C'était en croisant des moyennes, des chiffres accumulés sur des années et les relevés faits sur place qu'on finissait par le savoir.`,``,0],
[`p`,`Or Bastien pouvait se tromper comme ne pas se tromper. Il était nouveau dans le métier, et un préparateur ne tranchait pas. Tout le monde le pensait tout bas sans le dire tout haut. Personne ne lui en voulait de ne pas savoir encore.`,``,0],
[`tiret`,`— Deux jours, dit-elle. Avant ça, je ne dirai rien. De toute manière, si ça avait été une <a class="glo" data-mot="Capsule flash">capsule flash</a>, elle se serait ouverte depuis longtemps.`,``,0],
[`tiret`,`— Mais elle est claire, dit Bastien.`,``,0],
[`tiret`,`— Je ne dis pas le contraire.`,``,0],
[`p`,`Andrew regarda le tableau noir. Trois travées avaient une salle en face : la neuf, la dix, la onze. Trois salles, trois veilleurs. En face de la dix-neuf, celle de Bastien, il n'y avait rien — on ne réserve pas une salle pour une capsule qui n'existe sur aucune planche.`,``,0],
[`pause`,``,``,0],
[`p`,`Une capsule qui s'ouvre sans personne autour s'ouvre quand même. Elle n'attend pas, elle ne prévient pas. C'était arrivé deux fois depuis qu'il était là, et les deux fois quelqu'un s'était retrouvé debout tout seul au milieu de la coulée, sans miroir, sans eau, sans personne à qui donner son nom.`,``,1],
[`tiret`,`— Je relèverai deux fois par jour, dit Vera. Matin et soir. Et je veux qu'on recompte tout le fond avant la fin de la semaine.`,``,0],
[`tiret`,`— Ça va prendre trois jours.`,``,0],
[`tiret`,`— Ça prendra trois jours.`,``,0],
[`p`,`Andrew sortit son carnet.`,``,0],
[`tiret`,`— Je passerai la voir aussi.`,``,0],
[`tiret`,`— Quand ?`,``,0],
[`tiret`,`— Le matin. Avant de descendre.`,``,0],
[`p`,`Il écrivit : travée dix-neuf, douzième capsule, et la date et l'heure qu'il était.`,``,0],
[`p`,`Il n'avait pas d'avis sur la date et il n'en aurait pas. C'était le confort du métier : les autres prévoyaient, lui constatait.`,``,0],
[`tiret`,`— Et si elle s'ouvre cette nuit ? dit Bastien.`,``,0],
[`tiret`,`— Alors elle s'ouvrira cette nuit, et on n'y pourra rien.`,``,0],
[`p`,`C'était vrai, ça ne consolait personne, et les trois s'en contentèrent parce qu'il n'y avait rien d'autre à en tirer.`,``,0],
[`pause`,``,``,0],
[`tiret`,`— Tu descends où, aujourd'hui ? demanda Bastien en le raccompagnant jusqu'à la porte.`,``,0],
[`tiret`,`— Salle 2. Ils sont quatre.`,``,0],
[`tiret`,`— Quatre, répéta Bastien, avec le petit hochement de tête qu'on a pour les bonnes nouvelles des autres. Alors c'est un bon jour.`,``,0],
[`tiret`,`— C'est ce qui se dit en effet.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Il ressortit et prit à gauche, vers l'aile des cérémonies.`,``,1],
[`p`,`Il n'avait rien à porter. On avait descendu la veille ce qu'il fallait dans la salle 2 : la nappe et le chemin de table, les serviettes dans les quatre tailles, les timbales, les flacons vides. On le faisait pour lui, il le faisait pour d'autres, et personne ne tenait le compte.`,``,0],
[`p`,`L'odeur le prit à cinquante mètres.`,``,0],
[`pause`,``,``,0],
[`p`,`Elle n'arrivait pas de face. Elle était déjà là, installée dans l'allée, sans direction, comme une température. Il aurait pu faire le tour par l'autre côté. Il ne le fit pas, parce qu'il était en avance et parce qu'on ne change pas de chemin pour une odeur.`,``,1],
[`pause`,`· · ·`,``,0],
[`p`,`Ils étaient quatre au bout de l'allée, en combinaison.`,``,1],
[`p`,`Trois regardaient. Le quatrième raclait.`,``,0],
[`tiret`,`— Ouais, et surtout le fond ! On laisse rien, faut que ça brille ! criait l'un.`,``,0],
[`p`,`Les autres riaient, et celui qui raclait riait aussi, parce que c'était son tour et qu'il n'y avait rien à dire.`,``,0],
[`p`,`C'était le dernier entré au service. C'était aussi le seul à qui on aurait donné soixante ans.`,``,0],
[`p`,`Andrew le regarda le temps de passer et ne trouva rien à en dire.`,``,0],
[`p`,`On disait de celles-là que c'étaient des capsules non éclaircies. C'était le mot du registre, et ce n'était pas celui des yeux.`,``,0],
[`p`,`Ça ne ressemblait pas à une capsule. Ça n'en avait ni la longueur, ni les nervures, ni cette dissymétrie propre aux choses qui ont poussé. C'était une poche sombre et boursouflée, sortie de travers sur un coulant de bordure.`,``,0],
[`p`,`Personne ne l'avait vue grossir et personne n'aurait pu la relever. Elle était venue d'un coup, puis avait crevé dans la nuit, sur le flanc, sans que rien l'annonce.`,``,0],
[`p`,`On aurait dit une excroissance que la coulée s'était faite à elle-même, puis qu'elle avait poussée à l'écart pour ne pas salir ce qu'il y avait autour.`,``,0],
[`p`,`Il en restait ça : quelque chose d'affaissé sur le coulant, comme un sac qu'on aurait vidé sans le poser.`,``,0],
[`p`,`Le reste avait coulé.`,``,0],
[`p`,`Ce n'était pas de la gelée. La gelée est orange, mate, sèche ; elle s'enlève d'un tenant et ne laisse rien derrière elle.`,``,0],
[`p`,`Ça, c'était autre chose.`,``,0],
[`p`,`Ça s'était étalé sur trois mètres et avait pris la pente. Par endroits, c'était encore en tas, avec des grumeaux gros comme le poing, plus pâles au cœur, qui gardaient un moment la marque de la raclette avant de se refermer lentement dessus.`,``,0],
[`p`,`Ailleurs, c'était plus clair, plus liquide, et ça s'était insinué dans le joint entre deux dalles. Il faudrait revenir gratter demain.`,``,0],
[`p`,`Entre les deux, il y avait tout ce qu'on veut : des filaments qui pendaient au bord du seau lorsqu'on relevait l'outil et ne se décidaient pas à tomber ; une membrane formée en surface qui se plissait quand on marchait à côté ; et, dessous, la masse qui continuait de descendre parce que le sol descendait.`,``,0],
[`p`,`Les régurgitations de n'importe quel être vivant, petit ou grand, à côté de ça, c'était du petit-lait.`,``,0],
[`p`,`Les seaux étaient alignés le long du mur, à moitié pleins.`,``,0],
[`p`,`Il y en avait six.`,``,0],
[`p`,`Il en faudrait un septième.`,``,0],
[`tiret`,`— La cinquième cette semaine, dit quelqu'un derrière.`,``,0],
[`p`,`Personne ne répondit.`,``,0],
[`p`,`Il n'y avait rien à répondre, et il restait deux mètres à faire.`,``,0],
[`p`,`On nettoyait vite. Pas pour l'odeur : parce qu'on disait qu'une travée gâtée gâtait ses voisines. Personne n'avait jamais vérifié si c'était vrai, et personne ne tenait à être celui qui essaierait.`,``,0],
[`p`,`Andrew n'y toucha pas.`,``,0],
[`p`,`Il l'avait fait pendant deux ans, comme tout le monde, et depuis, d'autres le faisaient. Il ne ralentit pas et ne se boucha pas le nez, parce qu'aucun des quatre ne l'aurait fait à sa place et qu'on se tient droit devant les gens qui travaillent.`,``,0],
[`pause`,``,``,0],
[`p`,`Il passa à trois mètres et continua vers la salle 2, où quatre capsules s'apprêtaient à être redressées pour dix heures précises, claires et propres, sur leurs chariots.`,``,1],
[`pause`,``,``,0],
[`p`,`L'odeur le suivit dans l'allée. Une odeur, insipide, et prenante au nez, comme le fond d'un vase de fleurs qu'on aurait oublié tout un été.`,`fin`,1],
]},
{ id:`chapitre-2`, rang:`Chapitre II`, titre:`L'allée des Tilleuls`, quand:``, encart:``, p:[
[`p`,`La rue s'appelait l'allée des Tilleuls parce qu'il y avait des tilleuls, plantés tous les dix mètres le long du trottoir, et qui, deux semaines par an, sentaient si fort qu'on dormait les fenêtres ouvertes. Personne n'avait décidé de ce nom. On avait fini par dire ça, et c'était resté.`,``,3],
[`pause`,``,``,0],
[`p`,`Les maisons étaient les mêmes d'un bout à l'autre, avec leurs barrières basses et blanches, repeintes plus souvent qu'il n'était nécessaire. Les pelouses étaient tondues court, toutes à la même hauteur, parce que chacun surveillait celle du voisin sans jamais le dire.`,``,1],
[`pause`,``,``,0],
[`p`,`La rue montait d'un côté, vers le tournant. De l'autre, elle redescendait vers le grand axe, et par là les <a class="glo" data-mot="Jardin">jardins</a> étaient passés derrière. Les dernières maisons donnaient presque sur le trottoir.`,``,1],
[`p`,`Ce matin-là, dans l'avant-dernière, celle aux volets violets, Linette cherchait ses chaussures depuis un bon moment.`,``,0],
[`p`,`Elle finit par les trouver sous le fauteuil.`,``,0],
[`p`,`Elle posait les choses là où elle se trouvait, jamais là où elles allaient.`,``,0],
[`p`,`Elle les mit.`,``,0],
[`pause`,``,``,0],
[`p`,`La télévision parlait dans son dos. C'était une chaîne qui ne passait que des documentaires : des animaux, des plantes, des montagnes, des rivières. Elle l'avait trouvée un jour sans la chercher et n'en avait plus bougé.`,``,1],
[`p`,`Ce matin-là, il était question de fourmis qui faisaient pousser des champignons sous la terre.`,``,0],
[`pause`,``,``,0],
[`p`,`La glace de l'entrée lui renvoya une figure ronde, un cou plissé, des rides fines au coin de la bouche et d'autres au coin des yeux, qui partaient en éventail dès qu'elle souriait.`,``,1],
[`p`,`Elle souriait tout le temps.`,``,0],
[`p`,`Il y en avait un peu moins que l'année d'avant. Ça ne se voyait pas d'un matin sur l'autre, mais ça se voyait. Ses mains aussi tremblaient un peu moins.`,``,0],
[`p`,`Elle s'habilla.`,``,0],
[`p`,`Violet, comme le reste : la robe à petits boutons des jours doux, le gilet qu'elle prenait parce qu'on ne savait jamais, le foulard.`,``,0],
[`pause`,``,``,0],
[`p`,`Sept ans qu'elle sortait comme ça, et personne n'avait jamais réussi à lui faire mettre autre chose.`,``,1],
[`p`,`Le séjour avait suivi, avec le temps.`,``,0],
[`p`,`Un vase violet sur la table basse, des napperons violets sous les choses, une théière violette dont le bec était ébréché, un coussin, une boîte à couture, deux bougies qui n'avaient jamais servi et un cendrier alors qu'elle ne fumait pas.`,``,0],
[`pause`,``,``,0],
[`p`,`Rien n'avait été acheté exprès.`,``,1],
[`p`,`Simplement, quand une chose violette se présentait quelque part, elle ne repartait pas sans.`,``,0],
[`p`,`Des pinceaux séchaient dans un pot de confiture. Des toiles attendaient contre le mur, retournées. Il y avait une odeur d'huile et de térébenthine qui ne partait jamais tout à fait, et un chevalet près de la porte-fenêtre, là où la lumière durait le plus longtemps.`,``,0],
[`p`,`Sur le mur, ses premières aquarelles étaient accrochées à côté des dernières.`,``,0],
[`p`,`On voyait très bien la différence, et elle ne s'en cachait pas.`,``,0],
[`p`,`Elle trouvait ça encourageant.`,``,0],
[`p`,`La boîte d'aquarelle tenait sous le bras.`,``,0],
[`p`,`Vingt-quatre godets, dont six creusés jusqu'au fond et dix-huit presque neufs. Deux pinceaux, un chiffon, un bocal à vis pour l'eau, un carnet.`,``,0],
[`p`,`Ça se posait n'importe où.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Il fallait descendre jusqu'au bout de la rue, tourner à gauche, et marcher encore un peu.`,``,1],
[`p`,`L'an dernier, elle s'arrêtait deux fois en chemin. Cette année, une seule.`,``,0],
[`pause`,``,``,0],
[`p`,`L'étang était dans un creux, entre la route et le dos des jardins, et on ne le voyait qu'une fois dedans.`,``,1],
[`p`,`Les saules trempaient.`,``,0],
[`p`,`L'eau était grise au milieu, verte le long des branches, brune près du bord, et elle n'allait nulle part. Ça sentait la vase et l'herbe coupée.`,``,0],
[`p`,`Ce qu'elle aimait là, c'est que rien n'y allait vite.`,``,0],
[`p`,`Un caillou tombait, l'eau s'ouvrait, faisait ses ronds de plus en plus larges, puis redevenait plate.`,``,0],
[`p`,`Des canards se déplaçaient à la rame, s'arrêtaient au milieu sans raison, repartaient dans l'autre sens.`,``,0],
[`p`,`Un homme lançait un bâton à un chien qui ne le rapportait pas.`,``,0],
[`p`,`De l'autre côté, deux coureurs passèrent, revinrent, repassèrent, sans avoir l'air d'avancer.`,``,0],
[`p`,`On entendait la ville, mais de loin.`,``,0],
[`p`,`Un klaxon quelque part, un chantier qui tapait, le grondement continu de la route derrière les arbres.`,``,0],
[`p`,`Ça n'entrait pas.`,``,0],
[`p`,`Ça restait au bord.`,``,0],
[`pause`,``,``,0],
[`p`,`Elle chercha un banc en particulier et le trouva tout de suite, près de l'eau.`,``,1],
[`p`,`Il avait un pied plus court que les autres, mais c'était l'un des mieux placés pour la vue.`,``,0],
[`p`,`Et c'était celui que son amie Maud avait choisi aujourd'hui.`,``,0],
[`p`,`Elles se retrouvaient là deux matins par semaine, quand il faisait beau.`,``,0],
[`pause`,``,``,0],
[`p`,`Maud lui fit signe d'approcher, contente de la voir.`,``,1],
[`p`,`Linette lui rendit son sourire, prête, une fois de plus, à partager ses godets et ses pinceaux de bon cœur.`,``,0],
[`tiret`,`— Ma belle Maud. Comment tu vas, aujourd'hui ?`,``,0],
[`tiret`,`— On ne peut mieux. Et toi ? Attends, je vais t'aider.`,``,0],
[`p`,`Maud se leva et la prit par le bras.`,``,0],
[`p`,`Linette s'aida autant de son amie que de l'accoudoir pour descendre les derniers centimètres, et il fallut un moment avant que son dos accepte de se remettre droit.`,``,0],
[`tiret`,`— Aïe aïe aïe. Vivement que tous ces petits maux s'en aillent, dit-elle en riant tout bas. Tu as apporté ton thermos ?`,``,0],
[`tiret`,`— Bien sûr.`,``,0],
[`tiret`,`— Et moi j'ai pensé au gâteau. Tu avais vu, pour la boulangerie ?`,``,0],
[`tiret`,`— Non.`,``,0],
[`tiret`,`— Fermée, annonça Linette d'un air grave.`,``,0],
[`tiret`,`— Fermée comment ?`,``,0],
[`tiret`,`— Fermée, confirma-t-elle sur une intonation plus profonde encore. Jusqu'à nouvel ordre.`,``,0],
[`tiret`,`— Quoi ?`,``,0],
[`tiret`,`— Je te jure. Je suis dégoûtée. Je m'étais habituée à leur framboisier.`,``,0],
[`tiret`,`— Celui avec les petites framboises dessus ?`,``,0],
[`tiret`,`— Celui-là.`,``,0],
[`tiret`,`— Il était joli.`,``,0],
[`tiret`,`— Il était surtout bon.`,``,0],
[`p`,`Elles rirent toutes les deux.`,``,0],
[`pause`,``,``,0],
[`p`,`Les canards quittèrent l'eau les uns après les autres et vinrent voir.`,``,1],
[`p`,`Ils n'avaient peur de rien. On leur donnait quelque chose, d'habitude.`,``,0],
[`p`,`Ils montèrent jusqu'aux chaussures, se mirent en travers et attendirent.`,``,0],
[`tiret`,`— J'ai rien pour vous, leur dit Linette. Restez comme ça, je vous fais.`,``,0],
[`p`,`Ça ne les convainquit pas. Le gâteau était sur le banc et ils l'avaient vu. L'un d'eux entreprit les godets, un autre visa le bocal, et il fallut tenir la boîte à deux mains.`,``,0],
[`tiret`,`— Non. Non ! Ça, c'est du bleu, tu vas être malade.`,``,0],
[`p`,`C'était ça, leurs matinées : on peignait et on se racontait tout.`,``,0],
[`pause`,``,``,0],
[`p`,`Elles s'étaient portraiturées l'une l'autre un nombre incalculable de fois sans jamais s'en fatiguer.`,``,1],
[`p`,`Maud avait une trentaine d'années, Linette en avait soixante-douze, et elles étaient sorties la même semaine, à huit jours près.`,``,0],
[`p`,`Cela ne cessait jamais de les étonner.`,``,0],
[`p`,`C'était aussi la seule chose au monde sur laquelle elles n'avaient rien à dire.`,``,0],
[`pause`,``,``,0],
[`p`,`Le papier prit l'eau, puis le gris.`,``,1],
[`p`,`C'était le meilleur moment, celui où la couleur s'en va toute seule et où on ne sait pas encore ce qu'elle va faire.`,``,0],
[`p`,`Un vert dedans.`,``,0],
[`p`,`Le vert partit dans le gris.`,``,0],
[`p`,`Le pinceau tremblait au départ, puis il se tenait.`,``,0],
[`p`,`C'était comme ça chaque fois : les premières minutes pour rien, et après, la main allait.`,``,0],
[`pause`,``,``,0],
[`p`,`Les canards tinrent encore un moment, par principe.`,``,1],
[`p`,`Puis ils comprirent qu'il n'y aurait rien et s'en allèrent en ronchonnant vers un autre banc, plus loin, où quelqu'un venait de déballer quelque chose.`,``,0],
[`pause`,``,``,0],
[`p`,`Il fut question du portail du quatorze, repeint en bleu, ce qui ne rendait pas mal du tout, il fallait le reconnaître.`,``,1],
[`p`,`Puis de la dame du bout de la rue qui s'était mise à vendre des confitures sur le marché du samedi.`,``,0],
[`tiret`,`— C'est une très bonne idée, dit Maud.`,``,0],
[`tiret`,`— Je trouve aussi.`,``,0],
[`tiret`,`— J'en ai acheté deux pots.`,``,0],
[`tiret`,`— Deux ?`,``,0],
[`tiret`,`— Un pour moi, dit-elle en levant un doigt. Et un encore pour moi !`,``,0],
[`p`,`Cette dernière explosa de rire toute seule. Linette l'observa et éclata à son tour.`,``,0],
[`tiret`,`— Mais c'est même pas drôle, s'exclama-t-elle en soufflant du nez.`,``,0],
[`tiret`,`— Je sais ! parvint à articuler Maud, prise d'un fou rire devant la tête de son amie.`,``,0],
[`p`,`Elles rirent encore un peu, puis le rire se défit de lui-même, par petites reprises, jusqu'à n'être plus qu'un sourire.`,``,0],
[`p`,`Linette s'essuya le coin de l'œil du poignet et reprit son pinceau. Devant elles, l'eau avait continué de bouger sans elles.`,``,0],
[`p`,`Un moment passa.`,``,0],
[`p`,`Une fillette remonta le chemin, accompagnée d'une seconde, un peu plus grande.`,``,0],
[`p`,`C'était cette dernière qui guidait la petite, cela se voyait. On nommait ces personnes-là des berceurs et des <a class="glo" data-mot="Berceur, berceuse">berceuses</a>.`,``,0],
[`p`,`Linette les suivit du regard sans lever son pinceau.`,``,0],
[`tiret`,`— Celle-là, je l'ai toujours vue comme ça.`,``,0],
[`p`,`Maud leva la tête, juste le temps de voir, et retourna à sa peinture.`,``,0],
[`tiret`,`— Ah, elle ? Oh, eh bien elle est pas près de changer.`,``,0],
[`tiret`,`— Sept ans que je viens. Elle n'a pas pris un centimètre.`,``,0],
[`p`,`Linette se rendit compte qu'elle ne les avait pas croisées depuis un bon moment : la petite était rentrée au jardin peu avant. De les revoir remonter l'allée toutes les deux surprenait un peu, sans avoir rien d'impossible.`,``,0],
[`p`,`La berceuse, elle, avait changé. Linette l'avait connue jeune femme ; maintenant elle avait des poignets de gamine et marchait du même pas que la petite. Elle demeurait cependant toujours plus grande, d'une tête seulement ; de dos, si l'une ne guidait pas l'autre, on n'aurait plus su qui accompagnait qui.`,``,0],
[`tiret`,`— Le monsieur du cinq, tu sais, celui qui habite la maison avec la façade jaune, eh bien il était à sa cérémonie, dit Maud. Il m'a dit qu'il a entendu le veilleur dire que l'Archiviste lui avait compté neuf ans.`,``,0],
[`p`,`Linette leva le nez de son pinceau. Maud n'y fit pas attention.`,``,0],
[`tiret`,`— Et sa berceuse descend comme tout le monde. C'est drôle de se dire que la petite vient tout juste d'y rentrer et que la personne qui l'a élevée s'apprête à la suivre à peine quelques années plus tard !`,``,0],
[`p`,`Linette regarda le bout de l'allée et sourit toute seule.`,``,0],
[`tiret`,`— C'est bizarre, quand même.`,``,0],
[`tiret`,`— Oui, dit Maud en riant. Remarque, son éclaircie lui a donné neuf ans, alors…`,``,0],
[`p`,`Elle reprit son vert.`,``,0],
[`p`,`La matinée passa là-dedans.`,``,0],
[`pause`,`· · ·`,``,0],
[`tiret`,`— Houla ! Il est bientôt l'heure de rentrer.`,``,0],
[`p`,`Maud regarda le ciel.`,``,0],
[`tiret`,`— En fin de semaine, ça va flotter presque tous les jours.`,``,0],
[`tiret`,`— Tu crois ?`,``,0],
[`tiret`,`— J'ai regardé ce matin.`,``,0],
[`tiret`,`— Alors tu viendras à la maison plutôt ?`,``,0],
[`tiret`,`— C'est proposé si gentiment.`,``,0],
[`p`,`Maud rangea le matériel et referma la palette, qui était capricieuse.`,``,0],
[`p`,`Puis elle aida son amie à se relever.`,``,0],
[`p`,`Elles trouvèrent encore de quoi se dire pendant une bonne vingtaine de minutes, s'embrassèrent et se promirent de se revoir très vite.`,``,0],
[`pause`,`· · ·`,``,0],
[`p`,`Elle rentra vers midi. La télévision parlait maintenant d'un oiseau qui avait pour habitude de coudre les feuilles entre elles pour faire son nid.`,``,1],
[`pause`,``,``,0],
[`p`,`La cuisine était dans un angle du séjour. Elle remplit une casserole à moitié d'eau et la posa sur le feu de gauche, celui qu'on lui avait montré à l'école ; elle n'en avait jamais pris d'autre. L'eau d'abord, les pâtes ensuite : le formateur l'avait dit trois fois. Le couteau sortit du tiroir pour la tomate et y retourna aussitôt après un bref passage sous l'eau, parce qu'un couteau n'a rien à faire sur un plan de travail.`,``,1],
[`p`,`Elle éteignit le feu, et vérifia deux fois qu'il était éteint, parce que le formateur avait dit de vérifier deux fois, et qu'elle trouvait ça très raisonnable.`,``,0],
[`p`,`Elle mangea debout, devant la fenêtre.`,``,0],
[`pause`,``,``,0],
[`p`,`L'après-midi lui appartenait.`,``,1],
[`p`,`Elle épingla l'aquarelle du matin au coin du chevalet et sortit une toile commencée l'hiver d'avant, où il y avait déjà l'étang, la rive, et des nuages qu'elle avait trouvés réussis. L'huile avait séché depuis longtemps. Ça ne l'empêchait pas : elle chargeait un peu plus, et ça tenait.`,``,0],
[`pause`,``,``,0],
[`p`,`Elle mit les canards. Les trois premiers vinrent tout seuls. Le quatrième, elle le recommença trois fois sans en être contente.`,``,1],
[`p`,`Puis les saules, qu'elle avait toujours remis à plus tard, et un bout du banc au premier plan.`,``,0],
[`p`,`Les couleurs ne se mesuraient pas. Elle prenait ce qui venait, mélangeait sur la palette, et si ça ne donnait rien elle en remettait. Ça finissait par donner quelque chose.`,``,0],
[`pause`,``,``,0],
