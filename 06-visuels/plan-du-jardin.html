<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>L'Éclaircie — le jardin, trois plans</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --nuit:#0a0d10; --nuit2:#11161b; --trait:#2a3138;
  --or:#d9a441; --or-pale:#f0d9a0; --creme:#e9e0cc;
  --vert:#7fb069; --vert-clair:#a8d18a; --vert-sombre:#3d5a3a;
  --orange:#ec9006; --orange-pale:#ffd79a;
  --bleu:#0081B3; --bleu-clair:#4fb8e0; --bleu-nuit:#004572;
  --paille:#c9a86a;
  --texte:#c8c2b4; --texte-2:#8a8578; --texte-3:#5d594f;
  --serif:"Cambria","Georgia","Palatino Linotype",serif;
  --sans:"Inter","Segoe UI","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--nuit);color:var(--texte);font-family:var(--sans)}
#page{display:flex;height:100vh;overflow:hidden}
#scene{flex:1;min-width:0;display:flex;flex-direction:column;padding:20px 20px 12px}
#tete{flex:none}
#tete h1{margin:0;font-family:var(--serif);font-size:23px;font-weight:400;
  letter-spacing:.05em;color:var(--creme)}
#tete .ss{margin-top:5px;font-size:12px;color:var(--texte-3);letter-spacing:.04em}
#barre{display:flex;gap:8px;margin:14px 0 2px;flex-wrap:wrap;align-items:center}
.pl{background:#141a20;border:1px solid var(--trait);color:var(--texte-2);
  border-radius:999px;padding:7px 15px;font:inherit;font-size:12.5px;cursor:pointer;
  transition:.16s;letter-spacing:.02em}
.pl:hover{border-color:#3d4750;color:var(--texte)}
.pl.on{background:#1d2630;border-color:var(--or);color:var(--or-pale)}
.pl b{font-weight:600;letter-spacing:.14em;margin-right:7px;color:var(--or);opacity:.8}
.pl.on b{opacity:1}
#rejouer{margin-left:auto;background:#101c24;border:1px solid #1d4257;color:var(--bleu-clair);
  border-radius:999px;padding:7px 15px;font:inherit;font-size:12.5px;cursor:pointer;
  display:none;transition:.16s;letter-spacing:.02em}
#rejouer:hover{border-color:var(--bleu);background:#12242f}
#rejouer.vu{display:block}
svg{flex:1;min-height:0;width:100%;margin-top:4px}
#legende{flex:none;display:flex;gap:16px;flex-wrap:wrap;font-size:11px;
  color:var(--texte-3);padding-top:8px;border-top:1px solid var(--trait);margin-top:4px}
#legende span{display:flex;align-items:center;gap:6px}
#legende i{width:11px;height:11px;border-radius:2px;display:inline-block}

aside{width:400px;flex:none;background:var(--nuit2);border-left:1px solid var(--trait);
  overflow-y:auto;padding:24px 26px 40px}
aside h2{font-family:var(--serif);font-weight:400;font-size:21px;color:var(--creme);
  margin:0 0 3px;letter-spacing:.02em}
aside .sur{font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--or);opacity:.75;margin-bottom:14px}
aside p{font-size:13.5px;line-height:1.72;color:var(--texte-2);margin:0 0 13px}
aside b{color:var(--creme);font-weight:600}
aside em{color:var(--or-pale);font-style:italic}
.puce{display:flex;gap:10px;margin:11px 0;font-size:12.5px;line-height:1.62;color:var(--texte-2)}
.puce i{color:var(--or);font-style:normal;flex:none;opacity:.7}
.lab{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--texte-3);
  margin:24px 0 10px;padding-top:15px;border-top:1px solid var(--trait)}
.fiche{background:#0d1216;border:1px solid #24313a;border-left:2px solid var(--or);
  border-radius:6px;padding:15px 16px;margin:0 0 18px}
.fiche h3{margin:0 0 7px;font-family:var(--serif);font-weight:400;font-size:16px;color:var(--or-pale)}
.fiche .kind{font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--texte-3);margin-bottom:8px}
.fiche p{margin:0;font-size:12.8px;line-height:1.65}
.rien{color:var(--texte-3);font-size:12px;font-style:italic}

/* ------------------------------- le dessin ------------------------------- */
.mur{fill:none;stroke:var(--creme);stroke-width:3.4;opacity:.55;stroke-linejoin:round}
.mur-in{fill:#0e1512;stroke:none}
.parc{fill:none;stroke:var(--texte-3);stroke-width:.8;opacity:.45;stroke-dasharray:2 5}
.allee{fill:none;stroke:#2b332c;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.allee-b{fill:none;stroke:#3b4a3a;stroke-width:1;opacity:.5;stroke-linecap:round}
.sentier{fill:none;stroke:#39412f;stroke-width:3.4;stroke-linecap:round;
  stroke-dasharray:1.5 6;opacity:.85}
.pelouse{fill:#12201a;stroke:#25392a;stroke-width:.9}
.beton{fill:#1a1e22;stroke:#2c333a;stroke-width:.9}

.etendue{fill:#101d17;stroke:#2b4231;stroke-width:1.2}
.pre{fill:#152418;stroke:#3d5a3a;stroke-width:1.1;stroke-dasharray:6 4}
.enclos{fill:#1a1d15;stroke:#6d7a52;stroke-width:1.1;stroke-dasharray:4 3}
.eau{fill:#0d2130;stroke:none}
.margelle{fill:none;stroke:var(--bleu);stroke-width:2.4;opacity:.85}
.clos{fill:#15181c;stroke:#8d6c7a;stroke-width:1.1}
.sport{fill:#161d1a;stroke:#4a5f4a;stroke-width:1.1}

.zone{cursor:pointer}
.zone:hover .pre,.zone:hover .enclos{stroke:var(--or-pale);opacity:1}
.zone:hover .eau{fill:#122c3f}
.zone.on .pre,.zone.on .enclos{stroke:var(--or);stroke-width:1.8;stroke-dasharray:none}
.zone.on .margelle{stroke:var(--or-pale)}
.zone.on .etendue{stroke:var(--or);stroke-width:2}

.bat{fill:#171c22;stroke:var(--creme);stroke-width:1.2;opacity:.92;cursor:pointer}
.bat:hover{fill:#222a33;stroke:var(--or-pale)}
.bat.on{fill:#2a2114;stroke:var(--or);stroke-width:1.8}
.bat.soin{fill:#101a20;stroke:var(--bleu)}
.bat.soin:hover{fill:#152430}
.bat.fin{fill:#1a1216;stroke:#8d6c7a}
.bat.commun{fill:#1b1a14;stroke:var(--or);opacity:.95}
.bat.ferme{fill:#1c1710;stroke:var(--paille);opacity:.95}
.cab{fill:#141a15;stroke:var(--vert-sombre);stroke-width:.9}
.jeu{fill:#1e1a14;stroke:var(--orange);stroke-width:1;opacity:.9;cursor:pointer}
.jeu:hover{fill:#2a2317}
.jeu.on{stroke-width:2}

.arbre{fill:var(--vert-sombre);opacity:.55}
.arbre2{fill:none;stroke:var(--vert);stroke-width:.7;opacity:.3}
.grille{stroke:var(--or);stroke-width:2.6;stroke-linecap:round}
.grille.cond{stroke:#6b4a3a;stroke-dasharray:3 3}
.fresque{fill:none;stroke:var(--vert-clair);stroke-width:2.2;opacity:.35;
  stroke-linecap:round;stroke-dasharray:14 7}
.etiq{font-family:var(--sans);font-size:9.5px;fill:var(--texte-2);
  letter-spacing:.1em;text-transform:uppercase;pointer-events:none}
.etiq.gd{font-size:11px;fill:var(--creme);letter-spacing:.26em}
.etiq.hors{fill:var(--texte-3);text-transform:none;letter-spacing:.04em;font-size:9px}
.etiq.paille{fill:var(--paille);opacity:.85}
.note{font-family:var(--serif);font-size:10.5px;fill:var(--texte-3);
  font-style:italic;letter-spacing:0;text-transform:none;pointer-events:none}

.bete{fill:var(--creme);opacity:.62;pointer-events:none}
.bete.paille{fill:var(--paille);opacity:.72}
.chat{fill:#c9b8a0;opacity:.8;pointer-events:none}

/* ------------------------------ ce qui bouge ------------------------------ */
.onde{fill:none;stroke:var(--bleu-clair);stroke-width:1.1;opacity:0;
  transform-box:fill-box;transform-origin:center;animation:onde 5.5s ease-out infinite}
@keyframes onde{
  0%{transform:scale(.12);opacity:0}
  12%{opacity:.55}
  100%{transform:scale(1);opacity:0}
}
.surface{fill:none;stroke:var(--bleu-clair);stroke-width:1;opacity:.3;
  stroke-dasharray:5 9;animation:derive 14s linear infinite}
@keyframes derive{to{stroke-dashoffset:-140}}
.chemin{fill:none;stroke:var(--paille);stroke-width:2.4;stroke-linecap:round;
  stroke-dasharray:7 6;opacity:.75;animation:chemine 6s linear infinite}
@keyframes chemine{to{stroke-dashoffset:-26}}
.chemin-fond{fill:none;stroke:#2a2418;stroke-width:5.4;stroke-linecap:round;
  stroke-linejoin:round}
.trajet{fill:none;stroke:var(--bleu);stroke-width:2.2;stroke-linecap:round;
  stroke-linejoin:round;stroke-dasharray:7 5}
.trajet-ombre{fill:none;stroke:var(--nuit);stroke-width:7;stroke-linecap:round;
  stroke-linejoin:round;opacity:.85}
.marcheur{fill:var(--bleu-clair);stroke:var(--nuit);stroke-width:1.3}
.halo-m{fill:var(--bleu);opacity:.18;animation:battre 2.4s ease-in-out infinite}
@keyframes battre{0%,100%{opacity:.18}50%{opacity:.05}}
.feuille{animation:respire 9s ease-in-out infinite}
@keyframes respire{0%,100%{opacity:.55}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){
  .onde,.surface,.chemin,.halo-m,.feuille{animation:none}
  .onde{opacity:.28}
}
</style>
</head>
<body>
<div id="page">
  <div id="scene">
    <div id="tete">
      <h1>Le jardin — trois plans</h1>
      <div class="ss">Trois façons de poser les mêmes bâtiments. Elles ne diffèrent pas par le décor :
        elles répondent différemment à une seule question — <b style="color:var(--texte-2)">qui passe devant les salles de fin de vie</b>.</div>
      <div id="barre"></div>
    </div>
    <svg id="svg" viewBox="0 0 1020 700" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="legende"></div>
  </div>
  <aside><div id="pan"></div></aside>
</div>

<script>
const SVG='http://www.w3.org/2000/svg', svg=document.getElementById('svg');
const el=(n,a={},p=svg)=>{const e=document.createElementNS(SVG,n);
  for(const k in a) e.setAttribute(k,a[k]); p.appendChild(e); return e;};
const n2=v=>Math.round(v*10)/10;

/* Un tirage reproductible : le plan doit etre le meme a chaque ouverture. */
let graine=20260819;
const alea=()=>{graine=(graine*1103515245+12345)&0x7fffffff; return graine/0x7fffffff;};

/* Une enceinte n'est jamais droite : elle suit la rue. */
const lisse=(pts,f=.42)=>{
  let d=`M${n2(pts[0][0])},${n2(pts[0][1])}`;
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length], c=pts[(i+2)%pts.length];
    const m1=[a[0]+(b[0]-a[0])*(1-f),a[1]+(b[1]-a[1])*(1-f)];
    const m2=[b[0]+(c[0]-b[0])*f,b[1]+(c[1]-b[1])*f];
    d+=` L${n2(m1[0])},${n2(m1[1])} Q${n2(b[0])},${n2(b[1])} ${n2(m2[0])},${n2(m2[1])}`;
  }
  return d+'Z';
};
const poly=pts=>`M${pts.map(p=>n2(p[0])+','+n2(p[1])).join(' L')}`;
const boucle=pts=>poly(pts)+' Z';
/* Rien de ce qui pousse n'est rectangulaire. Une tache fermee, irreguliere
   mais reproductible : meme graine, meme contour a chaque ouverture. */
const tache=(cx,cy,rx,ry,n=11,irr=.17)=>{
  const p=[];
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2, k=1-irr+alea()*irr*2;
    p.push([cx+Math.cos(a)*rx*k, cy+Math.sin(a)*ry*k]);
  }
  return lisse(p,.5);
};
const dilate=(pts,d)=>{
  const cx=pts.reduce((s,p)=>s+p[0],0)/pts.length, cy=pts.reduce((s,p)=>s+p[1],0)/pts.length;
  return pts.map(([x,y])=>{const dx=x-cx,dy=y-cy,l=Math.hypot(dx,dy)||1;
    return [x+dx/l*d, y+dy/l*d];});
};
const dedans=(pts,[x,y])=>{
  let d=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const [xi,yi]=pts[i],[xj,yj]=pts[j];
    if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) d=!d;
  }
  return d;
};
const centre=pts=>[pts.reduce((s,p)=>s+p[0],0)/pts.length, pts.reduce((s,p)=>s+p[1],0)/pts.length];
function surLeTour(pts,t){
  const n=pts.length, f=t*n, i=Math.floor(f)%n, r=f-Math.floor(f);
  const a=pts[i], b=pts[(i+1)%n];
  return [a[0]+(b[0]-a[0])*r, a[1]+(b[1]-a[1])*r];
}

/* =====================================================================
   LES BETES — des silhouettes, pas des dessins
   ===================================================================== */
const trait=(d,g,s,couleur='var(--creme)',w=1,o=.5)=>el('path',{d,transform:`scale(${s})`,
  style:`stroke:${couleur};stroke-width:${w};opacity:${o};fill:none;stroke-linecap:round`},g);

const BETES={
  poney:(g,s)=>{
    el('path',{d:'M1,9 C1,6 3,5 6,5 L11,5 C13,5 14,6 14.4,8 L16,4.6 L17.4,5.4 L15.6,10 C15.2,11.6 13.6,12.4 11.6,12.4 L4,12.4 C2,12.4 1,11 1,9 Z',
      transform:`scale(${s})`,class:'bete'},g);
    trait('M3.2,12 l-.4,4.2 M6.4,12 l.6,4.2 M10.6,12 l-.4,4.2 M13,12 l.6,4',g,s,'var(--creme)',1.1,.55);
    trait('M1,8.6 C-0.4,9.6 -0.6,11.4 0.2,12.6',g,s,'var(--creme)',1,.45);
  },
  chevre:(g,s)=>{
    el('path',{d:'M1.6,9 C1.6,6.6 3.2,5.6 5.6,5.6 L10,5.6 C11.8,5.6 12.6,6.6 12.8,8 L14.4,5.6 L15.6,6.2 L14,10 C13.6,11.4 12.4,12 10.8,12 L4,12 C2.4,12 1.6,10.8 1.6,9 Z',
      transform:`scale(${s})`,class:'bete'},g);
    trait('M14.6,5.4 C15.8,4 16.6,3.4 17.2,3.6 M13.6,5.2 C14.4,3.6 14.8,2.8 15.4,2.8',g,s,'var(--creme)',.9,.5);
    trait('M3.4,11.8 l0,3.6 M6,11.8 l0,3.6 M9.6,11.8 l0,3.6 M11.6,11.8 l0,3.6',g,s,'var(--creme)',1,.5);
  },
  poule:(g,s)=>{
    el('path',{d:'M3,10.6 C3,7.4 5.4,5.6 8,5.6 C10.8,5.6 12.6,7.4 12.6,10 C12.6,12.4 10.6,13.6 8,13.6 C5,13.6 3,12.6 3,10.6 Z',
      transform:`scale(${s})`,class:'bete paille'},g);
    el('path',{d:'M11.6,6.6 C11.6,4.6 12.8,3.6 13.8,3.6 C14.8,3.6 15.4,4.4 15.4,5.6 C15.4,6.8 14.6,7.4 13.6,7.4 Z',
      transform:`scale(${s})`,class:'bete paille'},g);
    el('path',{d:'M15.2,5.2 l2,.8 l-2,.8 Z',transform:`scale(${s})`,class:'bete paille'},g);
    trait('M13.4,3.4 c.2,-1.4 .9,-1.7 1.3,-1.4 M6,13.4 l0,2 M9.4,13.4 l0,2',g,s,'var(--paille)',.9,.65);
  },
  lapin:(g,s)=>{
    el('ellipse',{cx:8,cy:11,rx:5.2,ry:3.8,transform:`scale(${s})`,class:'bete'},g);
    el('circle',{cx:13,cy:9,r:2.6,transform:`scale(${s})`,class:'bete'},g);
    el('path',{d:'M12.4,6.8 C12,3.6 12.6,2 13.6,2 C14.4,2 14.6,3.6 14,6.6 Z M14.4,7 C14.6,4 15.4,2.6 16.2,2.8 C17,3 16.8,4.6 15.8,7.2 Z',
      transform:`scale(${s})`,class:'bete'},g);
    el('circle',{cx:3,cy:10.6,r:1.6,transform:`scale(${s})`,class:'bete'},g);
  },
  cochon:(g,s)=>{
    el('ellipse',{cx:8,cy:10.6,rx:6,ry:3.6,transform:`scale(${s})`,class:'bete paille'},g);
    el('circle',{cx:13.2,cy:9.6,r:1.4,transform:`scale(${s})`,class:'bete paille'},g);
    trait('M11.8,7.8 c.7,-1.5 1.7,-1.6 1.9,-.6',g,s,'var(--paille)',.9,.7);
  },
  chat:(g,s)=>{
    el('path',{d:'M2,11 C2,8.6 4,7.4 6.6,7.4 L9.6,7.4 C11.4,7.4 12.4,8.6 12.4,10.4 L12.4,12.4 L2.6,12.4 Z',
      transform:`scale(${s})`,class:'chat'},g);
    el('circle',{cx:12.4,cy:6.6,r:2.4,transform:`scale(${s})`,class:'chat'},g);
    el('path',{d:'M10.6,5 l-.4,-2.4 l2,1.4 Z M14.2,5 l.6,-2.4 l-2.2,1.4 Z',
      transform:`scale(${s})`,class:'chat'},g);
    trait('M2,11.6 C-.4,11.4 -1,9 .4,7.6',g,s,'#c9b8a0',1.1,.75);
  },
  toboggan:(g,s)=>trait('M2,14 L10,4 L13,4 M10,4 L10,14 M13,4 C15,7 15,11 13,14',g,s,'var(--orange)',1.3,.75),
  balancoire:(g,s)=>trait('M3,14 L8,3 L13,14 M5.4,7 L5.4,13 M10.6,7 L10.6,13 M4.4,13 L6.4,13 M9.6,13 L11.6,13',g,s,'var(--orange)',1.2,.7),
  ballon:(g,s)=>{
    el('circle',{cx:8,cy:9,r:5.4,transform:`scale(${s})`,
      style:'stroke:var(--vert-clair);stroke-width:1.2;opacity:.5;fill:none'},g);
    trait('M8,3.6 L8,14.4 M2.8,7 L13.2,11 M2.8,11 L13.2,7',g,s,'var(--vert-clair)',.9,.35);
  }
};
function bete(type,x,y,s=1,p=svg){
  const g=el('g',{transform:`translate(${n2(x)},${n2(y)}) translate(-8,-9)`},p);
  (BETES[type]||BETES.chat)(g,s);
  return g;
}

/* =====================================================================
   LES TROIS PLANS
   ===================================================================== */
const PLANS=[
{
 cle:'A', nom:'Le damier', sous:'la cité scolaire',
 mur:[[122,74],[600,60],[880,120],[934,340],[890,592],[520,640],[168,600],[96,352]],
 principe:`<p><b>On a tracé des rues et on a posé les bâtiments dessus.</b> Deux axes qui se
  croisent, huit lotissements en deux rangées, et tout le reste dans les cases qui restent.
  <em>C'est un plan de commande publique : quelqu'un a dessiné ça sur une table, d'un coup, et
  ça n'a jamais été rediscuté.</em></p>
  <p>Le centre médical est <b>au milieu du croisement</b>, là où tout le monde passe.
  La cantine lui est accolée : on y va deux fois par jour.</p>`,
 enjeu:`<p><b>Les salles de fin de vie donnent sur la cour d'honneur.</b> Elles sont derrière une
  porte comme les autres, dans le même bâtiment que la cantine, et <em>quatre cents petits
  passent devant deux fois par jour sans savoir ce qu'il y a derrière.</em></p>
  <p>C'est le plan le plus glaçant des trois, et le plus vraisemblable : <b>personne n'a pensé
  à les mettre ailleurs, parce que personne n'a voulu y penser.</b></p>`,
 defauts:[
  ['Le lotissement 3 est de travers','Bâti avant les autres, sur une orientation qui n\'existe plus. On a tracé la rue autour.'],
  ['La grille ouest est condamnée','Elle donnait sur une voie qui n\'a jamais été percée. On l\'a laissée, avec sa serrure.'],
  ['Le bassin est comblé','Il reste un creux dans la pelouse, et l\'herbe y est plus verte.'],
  ['La fresque s\'arrête net','Le gymnase a été adossé au mur vingt ans après. Les dessins reprennent de l\'autre côté, en plus petit.']],
 grilles:[[512,66,'principale',0],[928,300,'livraisons',0],[540,641,'sud',0],[102,330,'ouest',1]],
 allees:[[[512,66],[512,640]],[[110,340],[930,308]],[[300,80],[300,620]],[[730,72],[730,620]],
         [[180,190],[880,178]],[[170,480],[890,470]]],
 sentiers:[[[300,190],[404,258],[512,300]],[[730,470],[640,540],[540,600]]],
 zones:[
  ['pelouse',[[330,340],[490,332],[494,452],[326,458]]],
  ['pelouse',[[760,190],[880,186],[884,300],[758,302]]],
  ['beton',[[404,214],[622,208],[626,300],[406,304]]]],
 bat:[
  ['soin',424,214,196,110,'Centre médical','Trois étages, le seul du jardin. Consultations au rez, dortoir de garde au premier, les dossiers au second.'],
  ['fin',444,330,150,52,'Fin de vie','Six chambres, une véranda, un couloir qui ne dessert rien d\'autre. La porte donne sur la cour, entre la cantine et le centre médical.'],
  ['commun',330,214,64,110,'Cantine','Les repas arrivent de la ville en camion, deux fois par jour.'],
  ['commun',150,205,120,80,'Gymnase','Adossé au mur, ce qui coupe la fresque.'],
  ['commun',150,320,120,70,'Salle de jeu','Pour les jours de pluie, et il pleut souvent.'],

const LIEUX={
 "L'étendue":['le milieu du jardin',"Tout l'espace qu'on n'a pas bâti : la mare, les prés, les enclos, les cabanes. <b>L'allée n'y entre pas — elle en fait le tour.</b> Un chemin, lui, y entre exprès, passe devant chaque bête et ressort au même endroit. <em>On ne traverse pas l'étendue pour aller ailleurs. On y va pour y être.</em>"],
 "La mare":["au milieu de l'étendue","Une margelle montée à hauteur de poitrine tout autour, assez large pour qu'on s'y accoude et trop haute pour qu'on l'enjambe. <b>Personne n'est jamais tombé dedans</b>, et deux berceurs sont là en permanence quand il y a du monde. <em>Il y a des poissons, et personne ne sait qui les a mis.</em>"],
 "Le chemin des bêtes":["dans l'étendue","Il entre par le nord, fait le tour de la mare, longe les enclos l'un après l'autre et ressort où il est entré. <b>On le fait dans un sens ou dans l'autre, et selon à qui on demande, ça change tout.</b> <em>Sable tassé, refait deux fois par an.</em>"],
 "Le pré des poneys":["l'étendue, à l'est","Trois poneys, jamais plus grands qu'un double poney. <b>C'est une règle : au jardin, aucune bête ne doit dépasser celui qui la caresse.</b> <em>Ils sont doux, lents, et complètement blasés.</em>"],
 "Le pré des chèvres":["l'étendue, au sud-est","Quatre chèvres naines, un tas de rochers monté exprès pour qu'elles grimpent dessus, et un portillon que les petits savent ouvrir. <em>Elles mangent tout ce qui dépasse, y compris les manches.</em>"],
 "Le poulailler":["l'étendue, au sud","Cinq poules et un tableau à la porte pour dire qui ramasse quand. <b>Les œufs partent au réfectoire, et ça compte beaucoup dans l'idée qu'on se fait de soi à cinq ans.</b>"],
 "Les lapins":["l'étendue, à l'ouest","Quatre lapins dans un enclos plus grand qu'il n'en faut, avec des tuyaux enterrés pour qu'ils aient où disparaître. <em>On ferme le clapier le soir à cause des chats.</em>"],
 "Les cochons d'Inde":["l'étendue, au nord","Quatre, et c'est le seul enclos où l'on entre. <b>Ils tiennent dans deux mains et ils sifflent dès qu'on approche du bac de granulés.</b>"],
 "Le terrain":['au nord',"Bitume peint, deux paniers à hauteur d'enfant, des buts tracés dessus. <em>Les lignes du milieu ont été repeintes tant de fois qu'il y en a trois qui se chevauchent.</em>"],
 "Aire de jeu":['dans les zones ouvertes',"Toboggan, balançoires, structures en bois. <b>Il y en a plusieurs, exprès, pour qu'aucun dortoir ne soit plus loin qu'un autre.</b>"],
 "Bacs à sable":['près du réfectoire',"Deux bacs, une bâche qu'on tire le soir, et du sable qu'on remplace tous les deux ans."],
 "Le trajet":['une scène à écrire',"Andrew et Isaac entrent par la grille du nord-ouest et vont au centre médical, à l'est. <b>Ils traversent tout le jardin : onze minutes à pied.</b> <em>Le chemin passe au sud de l'étendue, ce qui leur fait longer les prés — et c'est là qu'on peut leur faire voir ce qu'on veut leur faire voir.</em>"],
 "Les chats":['partout',"Personne ne les a fait venir. Ils entrent par le mur, dorment sur les bancs chauds, se laissent porter par ceux qui savent s'y prendre. <b>Il y en a trois, et leurs noms ne sont les mêmes dans aucun dortoir.</b>"]

let courant=2, choisi=null, anim=null;
const sortirClasses=()=>[].forEach.call(svg.querySelectorAll('.on'),e=>e.classList.remove('on'));
function choisir(nom,genre,txt,noeud){
  choisi=[nom,genre,txt]; sortirClasses();
  if(noeud) noeud.classList.add('on');
  rendPan();
}
function cliquable(g,nom,genre,txt,cible){
  g.addEventListener('click',e=>{e.stopPropagation(); choisir(nom,genre,txt,cible||g);});
}

function dessine(p){
  if(anim){cancelAnimationFrame(anim); anim=null;}
  svg.innerHTML=''; graine=20260819;
  const cH=el('g'), cB=el('g'), cA=el('g'), cE=el('g');

  /* ---- le parc, dehors ---- */
  const dehors=dilate(p.mur,30), loin=dilate(p.mur,52);
  el('path',{d:lisse(loin),class:'parc'},cH);
  el('path',{d:lisse(dehors),class:'parc'},cH);
  for(let i=0;i<64;i++){
    const q=surLeTour(dehors,i/64), o=surLeTour(loin,i/64);
    if(i%4===0) el('circle',{cx:n2(o[0]),cy:n2(o[1]),r:n2(4+alea()*3),class:'arbre'},cH);
    if(i%8===3) el('line',{x1:n2(q[0]-3),y1:n2(q[1]),x2:n2(q[0]+3),y2:n2(q[1]),
      stroke:'#4a5148','stroke-width':1.6,'stroke-linecap':'round'},cH);
  }

  /* ---- le mur et ses fresques ---- */
  el('path',{d:lisse(p.mur),class:'mur-in'},cB);
  el('path',{d:lisse(p.mur),class:'mur'},cB);
  const c0=centre(p.mur);
  (p.fresques||[]).forEach(([a,b])=>{
    const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const dx=c0[0]-m[0], dy=c0[1]-m[1], l=Math.hypot(dx,dy)||1;
    const dec=v=>[v[0]+dx/l*13, v[1]+dy/l*13];
    const A=dec(a), B=dec(b), M=dec(m);
    el('path',{d:`M${n2(A[0])},${n2(A[1])} Q${n2(M[0])},${n2(M[1])} ${n2(B[0])},${n2(B[1])}`,
      class:'fresque'},cB);
  });

  /* ---- les grilles ---- */
  (p.grilles||[]).forEach(([x,y,nom,cond])=>{
    const dx=c0[0]-x, dy=c0[1]-y, l=Math.hypot(dx,dy)||1;
    const px=-dy/l, py=dx/l, w=cond?11:17;
    el('line',{x1:n2(x-px*w),y1:n2(y-py*w),x2:n2(x+px*w),y2:n2(y+py*w),
      class:'grille'+(cond?' cond':'')},cB);
    for(let k=-2;k<=2;k++)
      el('line',{x1:n2(x+px*k*w/2.6-dx/l*7),y1:n2(y+py*k*w/2.6-dy/l*7),
        x2:n2(x+px*k*w/2.6+dx/l*7),y2:n2(y+py*k*w/2.6+dy/l*7),
        stroke:cond?'#6b4a3a':'var(--or)','stroke-width':.8,opacity:.6},cB);
    el('text',{x:n2(x-dx/l*24),y:n2(y-dy/l*24),class:'etiq hors','text-anchor':'middle'},cE)
      .textContent=nom;
  });

  /* ---- les zones plates ---- */
  (p.zones||[]).forEach(([cls,pts])=>el('path',{d:lisse(pts,.5),class:cls},cB));
  (p.anneaux||[]).forEach(([x,y,r])=>
    el('circle',{cx:x,cy:y,r:r,fill:'none',stroke:'#243027','stroke-width':1,
      'stroke-dasharray':'3 7',opacity:.7},cB));

  /* ======================= L'ÉTENDUE ======================= */
  if(p.etendue){
    const [ex,ey,erx,ery]=p.etendue;
    const ge=el('g',{class:'zone'},cB);
    el('path',{d:tache(ex,ey,erx,ery,13,.09),class:'etendue'},ge);
    cliquable(ge,"L'étendue",LIEUX["L'étendue"][0],LIEUX["L'étendue"][1]);

    if(p.chemin){
      const d=lisse(p.chemin,.5);
      const gc=el('g',{class:'zone'},cB);
      el('path',{d,class:'chemin-fond'},gc);
      if(p.amorce){
        el('path',{d:poly(p.amorce),class:'chemin-fond'},gc);
        el('path',{d:poly(p.amorce),class:'chemin'},gc);
      }
      el('path',{d,class:'chemin'},gc);
      cliquable(gc,"Le chemin des bêtes",LIEUX["Le chemin des bêtes"][0],LIEUX["Le chemin des bêtes"][1]);
    }

    const poser=(liste,cls)=>(liste||[]).forEach(([x,y,rx,ry,nom,type,n])=>{
      const g=el('g',{class:'zone'},cB);
      el('path',{d:tache(x,y,rx,ry,10,.12),class:cls},g);
      for(let i=0;i<n;i++){
        const a=alea()*Math.PI*2, k=.2+alea()*.55;
        bete(type, x+Math.cos(a)*rx*k, y+Math.sin(a)*ry*k, cls==='pre'?1:.74, g);
      }
      el('text',{x:n2(x),y:n2(y+ry+12),class:'etiq paille','text-anchor':'middle'},cE)
        .textContent=nom;
      const f=LIEUX[nom]||["l'étendue",''];
      cliquable(g,nom,f[0],f[1]);
    });
    poser(p.pres,'pre');
    poser(p.encl,'enclos');

    if(p.eau){
      const [mx,my,mrx,mry]=p.eau;
      const gm=el('g',{class:'zone'},cB);
      const d=tache(mx,my,mrx,mry,15,.2);
      el('path',{d,class:'eau'},gm);
      el('path',{d:tache(mx,my,mrx*.7,mry*.68,13,.22),class:'surface'},gm);
      el('path',{d,class:'margelle'},gm);
      [[mx-18,my-8,0],[mx+16,my+9,1.9],[mx+2,my-16,3.6]].forEach(([x,y,r])=>{
        const o=el('circle',{cx:n2(x),cy:n2(y),r:14,class:'onde'},gm);
        o.style.animationDelay=r+'s';
      });
      el('text',{x:n2(mx),y:n2(my+mry+13),class:'etiq','text-anchor':'middle'},cE)
        .textContent='La mare';
      cliquable(gm,'La mare',LIEUX['La mare'][0],LIEUX['La mare'][1]);
    }
  }

  /* ---- les allées, puis les sentiers d'usure ---- */
  (p.allees||[]).forEach(a=>{el('path',{d:poly(a),class:'allee'},cB);
    el('path',{d:poly(a),class:'allee-b'},cB);});
  (p.sentiers||[]).forEach(a=>el('path',{d:poly(a),class:'sentier'},cB));

  /* ---- les arbres ---- */
  const occupe=(p.bat||[]).map(b=>[b[1]-6,b[2]-6,b[3]+12,b[4]+12])
    .concat((p.jeux||[]).map(j=>[j[0]-6,j[1]-6,j[2]+12,j[3]+12]))
    .concat((p.sport||[]).map(j=>[j[0]-6,j[1]-6,j[2]+12,j[3]+12]));
  const et=p.etendue;
  let pose=0;
  for(let i=0;i<1200 && pose<106;i++){
    const x=80+alea()*880, y=50+alea()*610;
    if(!dedans(p.mur,[x,y])) continue;
    if(occupe.some(([a,b,w,h])=>x>a&&x<a+w&&y>b&&y<b+h)) continue;
    if(et && Math.pow((x-et[0])/(et[2]+8),2)+Math.pow((y-et[1])/(et[3]+8),2) < 1) continue;
    const r=3+alea()*4.2;
    const c=el('circle',{cx:n2(x),cy:n2(y),r:n2(r),class:'arbre'},cB);
    if(alea()>.72){ c.classList.add('feuille'); c.style.animationDelay=(alea()*9)+'s'; }
    if(alea()>.62) el('circle',{cx:n2(x),cy:n2(y),r:n2(r+3),class:'arbre2'},cB);
    pose++;
  }

  /* ---- le terrain de sport ---- */
  (p.sport||[]).forEach(([x,y,w,h,nom])=>{
    const g=el('g',{class:'zone'},cB);
    el('rect',{x,y,width:w,height:h,rx:h/2,class:'sport'},g);
    el('line',{x1:n2(x+w/2),y1:y,x2:n2(x+w/2),y2:n2(y+h),
      stroke:'var(--creme)','stroke-width':.8,opacity:.3},g);
    el('circle',{cx:n2(x+w/2),cy:n2(y+h/2),r:n2(h/5),fill:'none',
      stroke:'var(--creme)','stroke-width':.8,opacity:.3},g);
    bete('ballon',x+w-24,y+h-20,.9,g);
    el('text',{x:n2(x+w/2),y:n2(y+h+13),class:'etiq','text-anchor':'middle'},cE).textContent=nom;
    const f=LIEUX[nom]||['au jardin',''];
    cliquable(g,nom,f[0],f[1]);
  });

  /* ---- les aires de jeu ---- */
  (p.jeux||[]).forEach(([x,y,w,h,t,icone])=>{
    const g=el('g',{},cB);
    const r=el('rect',{x,y,width:w,height:h,rx:9,class:'jeu'},g);
    for(let i=0;i<4;i++)
      el('circle',{cx:n2(x+10+alea()*(w-20)),cy:n2(y+10+alea()*(h-20)),
        r:n2(2+alea()*3),fill:'var(--orange)',opacity:.35},g);
    if(icone) bete(icone,x+w/2,y+h/2-1,1.15,g);
    el('text',{x:n2(x+w/2),y:n2(y+h+12),class:'etiq','text-anchor':'middle'},cE).textContent=t;
    const f=LIEUX[t]||['au jardin',''];
    cliquable(g,t,f[0],f[1],r);
  });

  /* ---- les creux ---- */
  (p.trous||[]).forEach(([x,y,r,t])=>{
    if(!r) return;
    el('ellipse',{cx:x,cy:y,rx:r,ry:n2(r*.62),fill:'#16241c',stroke:'#2f4634',
      'stroke-width':.9,'stroke-dasharray':'4 4'},cB);
    if(t) el('text',{x,y:n2(y+r*.62+13),class:'note','text-anchor':'middle'},cE).textContent=t;
  });

  /* ---- le trajet ---- */
  let chemin=null;
  if(p.trajet){
    el('path',{d:poly(p.trajet.pts),class:'trajet-ombre'},cB);
    chemin=el('path',{d:poly(p.trajet.pts),class:'trajet'},cB);
    const a=p.trajet.pts[0], z=p.trajet.pts[p.trajet.pts.length-1];
    [a,z].forEach(q=>el('circle',{cx:n2(q[0]),cy:n2(q[1]),r:4.6,fill:'var(--bleu)',
      stroke:'var(--nuit)','stroke-width':1.4},cB));
    const tx=el('text',{x:n2(p.trajet.lab[0]),y:n2(p.trajet.lab[1]),class:'note',
      'text-anchor':'middle',style:'fill:var(--bleu);cursor:pointer;pointer-events:auto'},cE);
    tx.textContent=p.trajet.t;
    cliquable(tx,'Le trajet',LIEUX['Le trajet'][0],LIEUX['Le trajet'][1],null);
  }

  /* ---- l'échelle ---- */
  if(p.echelle){
    const [x,y]=p.echelle, L=145;
    el('line',{x1:x,y1:y,x2:n2(x+L),y2:y,stroke:'var(--texte-3)','stroke-width':1.4},cE);
    [0,L].forEach(d=>el('line',{x1:n2(x+d),y1:n2(y-4),x2:n2(x+d),y2:n2(y+4),
      stroke:'var(--texte-3)','stroke-width':1.4},cE));
    el('text',{x:n2(x+L/2),y:n2(y-9),class:'etiq hors','text-anchor':'middle'},cE)
      .textContent='100 mètres';
  }

  /* ---- le bâti ---- */
  (p.bat||[]).forEach(b=>{
    const [cls,x,y,w,h,t,txt,biais]=b;
    const petit = cls==='cab';
    const a=el('rect',{x,y,width:w,height:h,rx:petit?3:5,
      class:petit?'cab':'bat '+(cls==='bat'?'':cls)},cB);
    const ang = biais===1 ? -11 : biais;
    if(biais) a.setAttribute('transform',`rotate(${ang} ${n2(x+w/2)} ${n2(y+h/2)})`);
    if(!petit){
      a.style.cursor='pointer';
      const genre = cls==='soin'?'le soin':cls==='fin'?'la fin de vie':
                    cls==='ferme'?'la fermette':cls==='commun'?'bâtiment commun':'les dortoirs';
      a.addEventListener('click',e=>{e.stopPropagation(); choisir(t,genre,txt,a);});
    }
    const dedansAutre = cls==='fin' && (p.bat||[]).some(o=>o[0]==='soin'
      && x>o[1] && y>o[2] && x+w<o[1]+o[3] && y+h<o[2]+o[4]);
    /* Les batiments de la fermette sont petits : leur nom se pose dessous,
       a l'horizontale. Tourner une etiquette de trente pixels ne la rend pas
       lisible, ca la rend seulement tournee. */
    const dessous = dedansAutre || cls==='ferme';
    const px=x+w/2, py=dessous ? y+h+11 : y+h/2+3;
    const e=el('text',{x:n2(px),y:n2(py),
      class:'etiq'+(cls==='ferme'?' paille':''),'text-anchor':'middle'},cE);
    e.textContent=t;
    if(w<70 && !dessous) e.setAttribute('transform',`rotate(-90 ${n2(px)} ${n2(py)})`);
    else if(biais && !dessous) e.setAttribute('transform',`rotate(${ang} ${n2(px)} ${n2(py)})`);
  });

  if(p.etendue) el('text',{x:n2(p.etendue[0]),y:n2(p.etendue[1]-p.etendue[3]+16),
    class:'etiq gd','text-anchor':'middle'},cE).textContent="L'ÉTENDUE";
  (p.etiq||[]).forEach(([x,y,cls,t])=>{
    if(!t) return;
    el('text',{x,y,class:'etiq '+(cls||''),'text-anchor':'middle'},cE).textContent=t;
  });

  /* ======================= CE QUI BOUGE ======================= */
  const mobiles=[];

  if(p.chats && p.allees && p.allees[0]){
    const rail=el('path',{d:boucle(p.allees[0]),fill:'none',stroke:'none'},cA);
    const L=rail.getTotalLength();
    p.chats.forEach(([dep,sens])=>{
      const g=el('g',{style:'cursor:pointer;pointer-events:auto'},cA);
      bete('chat',0,0,.9,g);
      g.addEventListener('click',e=>{e.stopPropagation();
        choisir('Les chats',LIEUX['Les chats'][0],LIEUX['Les chats'][1],null);});
      mobiles.push({g,L,ch:rail,t:dep,v:0.0000075*(0.7+alea()*0.7),sens});
    });
  }

  const bouton=document.getElementById('rejouer');
  bouton.className = chemin ? 'vu' : '';
  bouton.textContent = '▸ Andrew et Isaac traversent le jardin';
  if(chemin){
    const L=chemin.getTotalLength();
    const halo=el('circle',{r:9,class:'halo-m',cx:-99,cy:-99},cA);
    const m1=el('circle',{r:5,class:'marcheur',cx:-99,cy:-99},cA);
    const m2=el('circle',{r:4.2,class:'marcheur',cx:-99,cy:-99},cA);
    const lab=el('text',{class:'note',x:-99,y:-99,'text-anchor':'middle',
      style:'fill:var(--bleu-clair)'},cA);
    let t=null;
    bouton.onclick=()=>{ t=0; chemin.style.strokeDasharray=L; chemin.style.strokeDashoffset=L; };
    mobiles.push({tick:(dt)=>{
      if(t===null) return;
      t+=dt*0.00011;
      if(t>=1.14){ t=null;
        chemin.style.strokeDasharray='7 5'; chemin.style.strokeDashoffset=0;
        [halo,m1,m2].forEach(e=>{e.setAttribute('cx',-99);e.setAttribute('cy',-99);});
        lab.textContent=''; return; }
      const u=Math.min(t,1);
      chemin.style.strokeDashoffset=L*(1-u);
      const a=chemin.getPointAtLength(L*u), b=chemin.getPointAtLength(Math.max(0,L*u-13));
      [[halo,a],[m1,a],[m2,b]].forEach(([e,q])=>{
        e.setAttribute('cx',n2(q.x)); e.setAttribute('cy',n2(q.y));});
      lab.setAttribute('x',n2(a.x)); lab.setAttribute('y',n2(a.y-14));
      lab.textContent = u<.45 ? 'Andrew et Isaac' : (u<.95 ? '' : 'le centre médical');
    }});
  }

  if(mobiles.length){
    let prec=null;
    const pas=(ts)=>{
      const dt=prec===null?16:Math.min(60,ts-prec); prec=ts;
      mobiles.forEach(m=>{
        if(m.tick){ m.tick(dt); return; }
        m.t=(m.t+m.v*dt*m.sens+1)%1;
        const q=m.ch.getPointAtLength(m.L*m.t);
        const r=m.ch.getPointAtLength(m.L*((m.t+0.004)%1));
        const sens=(r.x-q.x)*m.sens>=0?1:-1;
        m.g.setAttribute('transform',`translate(${n2(q.x)},${n2(q.y)}) scale(${sens},1)`);
      });
      anim=requestAnimationFrame(pas);
    };
    anim=requestAnimationFrame(pas);
  }

  svg.addEventListener('click',()=>{choisi=null; sortirClasses(); rendPan();});
  legende(p);
}

function legende(p){
  const L=[['#171c22','#e9e0cc','dortoirs'],['#1b1a14','#d9a441','bâtiments communs'],
    ['#1c1710','#c9a86a','la fermette'],['#101a20','#0081B3','centre médical'],
    ['#1a1216','#8d6c7a','fin de vie'],['#1e1a14','#ec9006','aires de jeu'],
    ['#0d2130','#0081B3','la mare'],['#152418','#3d5a3a','prés et enclos']];
  document.getElementById('legende').innerHTML =
    L.map(([f,b,t])=>`<span><i style="background:${f};border:1px solid ${b}"></i>${t}</span>`).join('')
    + `<span><i style="background:none;border-top:2px dashed #c9a86a"></i>le chemin des bêtes</span>`
    + `<span><i style="background:none;border-top:2px dashed #0081B3"></i>le trajet d'Andrew</span>`
    + `<span style="color:var(--texte-2)">— cliquez n'importe quoi</span>`;
}

function rendPan(){
  const p=PLANS[courant];
  let h='';
  if(choisi){
    h+=`<div class="fiche"><div class="kind">${choisi[1]||''}</div><h3>${choisi[0]}</h3>
        <p>${choisi[2] || `Rien de particulier — et c'est bien le but : la plupart des bâtiments d'un jardin sont interchangeables.`}</p></div>`;
  }
  h+=`<div class="sur">Plan ${p.cle}</div><h2>${p.nom}</h2>
    <p style="color:var(--texte-3);font-size:12px;margin-top:-8px">${p.sous}</p>
    ${p.principe}
    <div class="lab">Ce que ce plan décide</div>${p.enjeu}`;
  if(p.defauts && p.defauts.length){
    h+=`<div class="lab">Ce qui ne va pas, et qui doit rester</div>`;
    p.defauts.forEach(([t,d])=>{h+=`<div class="puce"><i>◦</i><span><b>${t}.</b> ${d}</span></div>`;});
  }
  if(!choisi) h+=`<div class="lab">Le détail</div><p class="rien">Cliquez un bâtiment, un enclos, la mare, un chemin, un chat.</p>`;
  document.getElementById('pan').innerHTML=h;
  document.querySelector('aside').scrollTop=0;
}

const barre=document.getElementById('barre');
PLANS.forEach((p,i)=>{
  const b=document.createElement('button');
  b.className='pl'+(i===courant?' on':'');
  b.innerHTML=`<b>${p.cle}</b>${p.nom}${p.cle==='C'?' · retenu':''}`;
  b.addEventListener('click',()=>{
    courant=i; choisi=null;
    [].forEach.call(barre.querySelectorAll('.pl'),x=>x.classList.remove('on'));
    b.classList.add('on');
    dessine(PLANS[i]); rendPan();
  });
  barre.appendChild(b);
});
const rej=document.createElement('button');
rej.id='rejouer'; barre.appendChild(rej);

dessine(PLANS[courant]); rendPan();
</script>
</body>
</html>
